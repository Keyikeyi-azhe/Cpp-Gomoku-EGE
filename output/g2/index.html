：先 stop 旧任务；保存地址、端口、握手；清停止标志；CreateThread(entry,this)。","    // 变量含义：ip 为点分十进制IPv4；p 是端口，不是座位；greeting 为HELLO正文。","    // 注意：true 只表示线程建成，不表示已连接成功；连接成功需UI收到 WELCOME。","    bool start(const std::string& ip,int p,const std::string& greeting) {","        stop();","        address=ip;","        port=p;","        hello=greeting;","        InterlockedExchange(&stopFlag,0);","        thread=CreateThread(NULL,0,entry,this,0,NULL);","        return thread!=NULL;","        // true仅表示线程创建成功；连接/握手的成功或失败通过incoming消息报告。","    }","    // 【函数 NetClient::sendMessage】UI提交一条出站 message。","    // 处理步骤：在临界区内，outgoing 未满256就追加。","    // 变量含义：当前实现队列满时静默丢弃，没有返回失败；不要理解成每次调用都确保消息入队。","    // 语句说明：出站队列最多256条；当前实现满时不追加，且没有返回值报告丢弃。","    void sendMessage(const std::string& message) {","        EnterCriticalSection(&mutex);","        if(outgoing.size()<256) {","            outgoing.push_back(message);","        }","        LeaveCriticalSection(&mutex);","    }","    // 【函数 NetClient::take】UI非阻塞取一条 incoming，经 message 输出。","    // 处理步骤：进锁检查 found；有消息取front并pop_front；离锁，返回 found。","    // 变量含义：found 为队列非空判断。","    // 注意：此处“不阻塞等待消息”不等于完全不等待：争用临界区时仍可能短暂等待锁。","    bool take(std::string& message) {","        EnterCriticalSection(&mutex);","        bool found=!incoming.empty();","        if(found) {","            message=incoming.front();","            incoming.pop_front();","        }","        LeaveCriticalSection(&mutex);","        return found;","        // 队列为空时 found 为假，调用者据此知道暂时没有消息","    }","};","#endif"],"online_ui.h":["// 【本文件阅读路线】仅联网：onlineAction 用户操作 -> updateOnline 接收状态；drawOnlinePage 房间页面 -> drawOnlineSidebar 对局侧栏。","// 【建议阅读 10 / 联网界面整合】online_ui.h","// 全局状态 -> onlineEnter/onlineConnect -> updateOnline -> onlineMove/onlineAsk。","// 再读onlineAction、保存与退出流程，最后看drawOnlinePage/drawOnlineSidebar。","// 本文件依赖main.cpp已声明的全局变量和绘图函数；include位置本身也是依赖关系。","// 外部接口声明位置：标准库对应的头文件；Win32/Winsock系统头；EGE的graphics.h。","// 头文件保护：首次包含时定义下面的宏，再次包含会跳过本文件，避免同一一次编译处理的源文件及其包含的头文件重复定义。","#ifndef GOMOKU_ONLINE_UI_H","#define GOMOKU_ONLINE_UI_H","#include \"ui_common.h\"","#include <iphlpapi.h>","#include \"network_protocol.h\"","NetClient netClient;","NetState netState;","// 服务端广播来的权威对局状态","HANDLE serverProcess=NULL,serverReady=NULL;","// serverProcess 是房主启动的服务端进程句柄；serverReady 是它的就绪事件","HWND ipEdit=NULL,portEdit=NULL;","// 两个原生输入框：填 IP 和端口","// 【阅读提示】netStage：0菜单/1建房表单/2加入表单/3连接中/4等待室/5关闭提示。","// 【阅读提示】archiveStage：0正常/1询问保存/2命名/3决定再战/4等待对方/5结束返回。","// 【阅读提示】以上是本机UI状态；权威房间阶段是netState.phase，见","int netStage=0,netRole=-1,archiveStage=0,archiveRound=-1;","// netStage连接页阶段0..5；netRole座位-1/0/1；archiveStage本机保存阶段0..5；archiveRound已触发保存的局号。","// 语句说明：连接成立/等状态确认/本机建房/曾开局/连接不可继续；五个标志职责不同。","bool netConnected=false,netPending=false,netHosting=false,netStarted=false,netLost=false;","// 语句说明：lobbyExit为等待室退出询问；closeAfterOnline表示联网收尾后关闭整个程序。","bool lobbyExit=false,closeAfterOnline=false;","// 语句说明：netLeaving正在等待离开确认；netExitAck已收CLOSE_ACK；netMovePending区分落子等待提示。","bool netLeaving=false,netExitAck=false,netMovePending=false;","// 语句说明：netSeenExit已处理的离开流水；netLatency为RTT毫秒，-1表示尚未测到。","int netSeenExit=0,netLatency=-1;","// 语句说明：自动返回时刻/离开等待截止/最近操作发送时刻，均为GetTickCount64毫秒。","ULONGLONG netAutoHomeAt=0,netLeaveDeadline=0,netPendingAt=0;","std::wstring netEndNotice,copyAddress;","// netEndNotice 结束时的提示文字；copyAddress 供复制按钮用的纯地址","void onlineRequestHome();","void onlineDeparture(int reason);","void onlineSaveStatus(int stage);","ULONGLONG netConnectAt=0,netDeadline=0;","// netConnectAt为最早尝试启动连接时刻（启动后清0）；netDeadline为连接阶段总截止毫秒。","std::string netAddress,netGreeting;","// 要连接的地址和连接后要发的问候语","int netPort=5000;","// 端口，默认 5000","std::wstring netError,hostAddresses;","// netError 当前要显示的错误文字；hostAddresses 本机地址提示","// 【类型 NetAction】联网按钮编号，从A_ONLINE=100开始，统一交onlineAction。RESTART/EXIT/UNDO/RESIGN","// 分别请求kind=1/2/3/4；SAVE类仅推进本机保存流程；AGAIN为同意再战，HOME为请求离开。","enum NetAction {","    A_ONLINE=100,A_NET_HOST,A_NET_JOIN,A_NET_BACK,A_NET_CONNECT,A_NET_CANCEL,","    A_NET_READY,A_NET_LEAVE,A_NET_YES,A_NET_NO,A_NET_RESTART,A_NET_EXIT,","    A_NET_SAVE_YES,A_NET_SAVE_NO,A_NET_WRITE,A_NET_NAME_CANCEL,A_NET_AGAIN,A_NET_HOME,A_NET_UNDO,A_NET_RESIGN,A_NET_COPY","};","// 【函数 onlineForms】按 visible 控制联网表单输入框。","// 处理步骤：IP仅在 netStage=2 时显示；端口在 visible 时显示；焦点放到适合的框。","// 变量含义：visible 为显示开关。","void onlineForms(bool visible) {","    ShowWindow(ipEdit,visible && netStage==2?SW_SHOW:SW_HIDE);","    // IP 框只在「加入房间」这一步显示","    ShowWindow(portEdit,visible?SW_SHOW:SW_HIDE);","    // 端口框在创建和加入两步都显示","    if(visible) {","        SetFocus(netStage==2?ipEdit:portEdit);","    }","}","// 【函数 onlineStop】停止连接并回收本机启动的服务进程。","// 处理步骤：停 netClient；清连接与待确认；服务进程等50毫秒未退就终止；关进程/事件句柄；隐藏表单。","// 变量含义：不负责完整重置所有联网字段，完整重置由 onlineEnter 处理。","void onlineStop() {","    netClient.stop();","    netConnected=false;","    netPending=false;","    // 断开后台连接线程，并清掉等待标记","    if(serverProcess) {","        if(WaitForSingleObject(serverProcess,50)==WAIT_TIMEOUT) {","            TerminateProcess(serverProcess,0);","        }      // 还在运行就强行结束；WAIT_TIMEOUT 说明它没自己退出","        CloseHandle(serverProcess);","        serverProcess=NULL;","        // 收掉句柄并置空，避免重复使用已失效的句柄","    }","    if(serverReady) {","        CloseHandle(serverReady);","        serverReady=NULL;","    }      // 就绪事件句柄同样要释放","    onlineForms(false);","    // 收起输入框","}","// 【函数 onlineHome】完成联网清理后回主菜单。","// 处理步骤：onlineStop、hideName；复位保存阶段/开局标志/游戏模式；mainMenu；若 closeAfterOnline 则","// 停止程序。","void onlineHome() {","    onlineStop();","    hideName();","    archiveStage=0;","    netStarted=false;","    gameMode=\"LOCAL_TWO\";","    mainMenu();","    if(closeAfterOnline) {","        running=false;","        closeAfterOnline=false;","    }","}","// 【函数 onlineEnter】从零进入联网菜单。","// 处理步骤：停止旧连接、取消AI、隐藏命名；重新构造 NetState；重置身份、连接页面、保存流程、离开标","// 志、提示与延迟；page=NETWORK_PAGE。","void onlineEnter() {","    onlineStop();","    cancelAI();","    hideName();","    netState=NetState();","    netRole=-1;","    netStage=0;","    // 先把一切停掉，再重置状态对象，等于「从零开始」","    archiveStage=0;","    archiveRound=-1;","    netLost=false;","    netStarted=false;","    lobbyExit=false;","    // 复位各个标志","    netLeaving=netExitAck=netMovePending=false;","    netSeenExit=0;","    netLatency=-1;","    netAutoHomeAt=0;","    netEndNotice.clear();","    // 复位与「离开」相关的标志、延迟显示和自动返回时刻","    netError.clear();","    page=NETWORK_PAGE;","    dialog=NO_DIALOG;","    // 清掉错误文字，切到联网页面，关掉询问弹窗","}","// 【函数 localAddresses】枚举本机活动IPv4地址，返回显示文本，并设置 copyAddress。","// 处理步骤：GetAdaptersAddresses，缓冲不足则扩容重试；遍历启用网卡和单播地址；排除回环；优先收集","// 100.64..100.127段；否则取首个普通地址。","// 变量含义：size/bytes 为缓冲长度和字节数组；list 为链表头；rc 为API结果；tailscale/other 为","// 候选文本；a 是网卡节点；u 是地址节点；b 为IPv4四字节指针；value 为格式化地址缓冲。","// 注意：这里按地址段按棋形和经验打分的标记“Tailscale”，没有验证网卡确实属于Tailscale。界面也提示人工核","// 对；识别成功不等于网络已经连通。","std::wstring localAddresses() {","    ULONG size=16384;","    std::vector<unsigned char> bytes(size);","    // size 既是缓冲区大小，也是调用后系统回报的需要大小","    IP_ADAPTER_ADDRESSES* list=reinterpret_cast<IP_ADAPTER_ADDRESSES*>(&bytes[0]);","    // 把字节缓冲区当结构体链表来用","    ULONG rc=GetAdaptersAddresses(AF_INET,0,NULL,list,&size);","    if(rc==ERROR_BUFFER_OVERFLOW) {","        bytes.resize(size);","        list=reinterpret_cast<IP_ADAPTER_ADDRESSES*>(&bytes[0]);","        rc=GetAdaptersAddresses(AF_INET,0,NULL,list,&size);","    }","    std::wstring tailscale,other;","    // tailscale收集100.64.0.0/10段候选；other留首个其他非回环IPv4。","    if(rc==NO_ERROR) {","        for(IP_ADAPTER_ADDRESSES* a=list;a;a=a->Next) {","            // a 遍历网卡链表","            if(a->OperStatus!=IfOperStatusUp) {","                continue;","            }","            for(IP_ADAPTER_UNICAST_ADDRESS* u=a->FirstUnicastAddress;u;u=u->Next) {","                // u 遍历这块网卡上的每一个 IP","                if(u->Address.lpSockaddr->sa_family!=AF_INET) {","                    continue;","                }","                const unsigned char* b=reinterpret_cast<const unsigned char*>(&reinterpret_cast<sockaddr_in*>(u->Address.lpSockaddr)->sin_addr);","                if(b[0]==127) {","                    continue;","                }","                wchar_t value[64];","                std::swprintf(value,64,L\"%u.%u.%u.%u\",b[0],b[1],b[2],b[3]);","                // 格式化成常见的点分十进制文字","                if(b[0]==100 && b[1]>=64 && b[1]<=127) {","                    if(!tailscale.empty()) {","                        tailscale+=L\" / \";","                    }","                    tailscale+=value;","                }      // 按100.64.0.0/10按棋形和经验打分的筛选；本代码未核实网卡归属，不能仅凭该段确认是Tailscale。","                else if(other.empty()) {","                    other=value;","                }      // 普通地址只留第一个","            }      // 继续看下一个地址","        }","    }","    if(!tailscale.empty()) {","        copyAddress=tailscale.substr(0,tailscale.find(L\" / \"));","        return L\"Tailscale: \"+tailscale;","    }      // 显示全部优先地址候选；copyAddress仅取第一个供复制。","    copyAddress=other;","    // 没有优先地址候选则使用首个普通地址，界面仍提示用户核对。","    return L\"\\u672c\\u673a: \"+other+L\"\\uff08\\u8bf7\\u6838\\u5bf9Tailscale\\u5730\\u5740\\uff09\";","}","// 【函数 onlineCanMove】联网规则下是否允许本机点棋盘。","// 处理步骤：要求已连接、未丢失、未离开、无待确认、非保存阶段、N_PLAY、座位有效，且 turn==netRole+1。","bool onlineCanMove() {","    return netConnected && !netLost && !netLeaving && !netPending && archiveStage==0 &&","    netState.phase==N_PLAY && netRole>=0 && game.turn==netRole+1;","    // 所有条件必须同时成立；身份有效且轮到本机颜色时才可落子。","}","// 【函数 onlineSend】提交需要等待状态更新的命令 cmd。","// 处理步骤：若仍连接且未lost，sendMessage；设netPending；记录netPendingAt。","// 变量含义：cmd 为完整正文。","// 注意：netPending 只是UI防连点标志，不是TCP送达证明。","void onlineSend(const std::string& cmd) {","    if(netConnected && !netLost) {","        netClient.sendMessage(cmd);","        netPending=true;","        netPendingAt=GetTickCount64();","    }      // 记下发送时刻并标记为等待回复","}","// 【函数 onlineCommand】生成“cmd 当前局号”前缀字符串。","// 处理步骤：ostringstream out 写命令与 netState.round，再返回str。","// 变量含义：cmd 为命令名；out 为输出流。","std::string onlineCommand(const char* cmd) {","    std::ostringstream out;","    out<<cmd<<' '<<netState.round;","    return out.str();","    // 指令格式：指令名 + 空格 + 局号","}","// 【函数 onlineMove】把压平格子编号 cell 变成 MOVE 请求。","// 处理步骤：检查可下与空格；设netMovePending；拼命令、已有手数、cell/15、cell%15；onlineSend。","// 变量含义：out 为命令流；cell 来自 boardCell 的合法结果。","// 注意：函数本身不检查cell越界，依赖调用者。不会在这里 game.place。","void onlineMove(int cell) {","    if(!onlineCanMove() || game.cells[cell/15][cell%15]) {","        return;","    }","    netMovePending=true;","    std::ostringstream out;","    out<<onlineCommand(\"MOVE\")<<' '<<game.moves.size()<<' '<<cell/15<<' '<<cell%15;","    onlineSend(out.str());","    // 拼出落子消息并发出去","}","// 【函数 onlineAsk】提出 kind 类型的操作询问。","// 处理步骤：要求已连接、无待确认、N_PLAY；拼ASK、局号、手数、kind；发送。","// 变量含义：kind=1重开、2退出、3悔棋、4认输；out 为消息流。","void onlineAsk(int kind) {","    if(!netConnected || netPending || netState.phase!=N_PLAY) {","        return;","    }","    std::ostringstream out;","    out<<onlineCommand(\"ASK\")<<' '<<game.moves.size()<<' '<<kind;","    onlineSend(out.str());","    // 拼出请求消息并发出","}","// 【函数 onlineAnswer】针对当前 question 答复 yes。","// 处理步骤：拼ANSWER、局号、问答编号、0/1；onlineSend。","// 变量含义：yes 为是否同意；out 为消息流。","void onlineAnswer(bool yes) {","    std::ostringstream out;","    out<<onlineCommand(\"ANSWER\")<<' '<<netState.question<<' '<<(yes?1:0);","    onlineSend(out.str());","    // 拼出答复消息并发出；yes 转成 1 或 0","}","// 【函数 onlineSaveStatus】报告本机保存进度 stage。","// 处理步骤：若连接未lost，直接 sendMessage 发送SAVE，不设置netPending。","// 变量含义：stage=1/2/3；o 为输出流。","// 注意：这是状态通知；为了不锁死本地命名流程，没有走 onlineSend。","void onlineSaveStatus(int stage) {","    if(netConnected && !netLost) {","        std::ostringstream o;","        o<<onlineCommand(\"SAVE\")<<' '<<stage;","        netClient.sendMessage(o.str());","    }      // 直接提交保存状态，不设置netPending；后续仍会收到服务端STATE更新。","}","// 【函数 onlineDeparture】提交离开原因 why，并开始等待退出确认。","// 处理步骤：已netLeaving就返回；置标志；设6秒deadline并取消自动返回；发送CLOSE。","// 变量含义：why 为LeaveReason；o 为命令流。","void onlineDeparture(int why) {","    if(netLeaving) {","        return;","    }","    netLeaving=true;","    netLeaveDeadline=GetTickCount64()+6000;","    netAutoHomeAt=0;","    // 设 6 秒备用时限；离开流程期间不再自动回主菜单","    std::ostringstream o;","    o<<onlineCommand(\"CLOSE\")<<' '<<why;","    onlineSend(o.str());","    // 拼出离开消息，附上原因","}","// 【函数 onlineRequestHome】根据当前阶段选择正确退出方式。","// 处理步骤：已离开则不重复；丢失/已关房直接onlineHome；未开局走等待室离开；终局按是否已提交再战选","// 取消或拒绝；重开等待选取消。","// 变量含义：它不处理正在正常下棋时直接退出；那条路径先 onlineAsk(2)。","void onlineRequestHome() {","    if(netLeaving) {","        return;","    }      // 已经在离开流程里就不重复触发","    if(netLost || netState.phase==N_CLOSED) {","        onlineHome();","        return;","    }      // 断线或房间已关，直接回主菜单","    if(!netStarted) {","        onlineDeparture(LEAVE_LOBBY);","        return;","    }      // 还没开局，按等待室离开处理","    if(netState.phase==N_FINISH) {","        onlineDeparture(archiveStage==4?LEAVE_CANCEL:LEAVE_DECLINE);","    }      // 一局结束时，区分「取消再战」和「拒绝再战」","    else if(netState.phase==N_RESTART) {","        onlineDeparture(LEAVE_CANCEL);","    }      // 正在协商重开时离开，记为取消","}","// 【函数 onlineArchiveDone】本机保存选择完成后的分流。","// 处理步骤：隐藏命名；报告SAVE 3；若连接结束，进入阶段5并等ACK或2秒返回；重开则阶段4并发送DONE；普","// 通终局则阶段3让用户选再战；需关程序则继续请求退出。","// 变量含义：没有另建棋谱；它只推进保存后的交互。","void onlineArchiveDone() {","    hideName();","    onlineSaveStatus(3);","    // 隐藏命名框，并告诉对方我这一步做完了","    if(netLost || netState.phase==N_CLOSED) {","        // 连接已失效或房间已关闭；与“对方的进程已退出”不是同一保证。","        archiveStage=5;","        // 进入第 5 阶段：对方已离开，本机也处理完了","        if(netState.leaver==netRole && netState.leaveReason!=LEAVE_DROP) {","            // 区分「正常通知离开」和「意外掉线」","            if(netExitAck) {","                onlineHome();","            }","            else {","                netLeaving=true;","                netLeaveDeadline=GetTickCount64()+4000;","            }","        } else {","            netAutoHomeAt=GetTickCount64()+2000;","        }      // 别人的离开：两秒后自动回主菜单","        return;","    }","    if(netState.phase==N_RESTART) {","        archiveStage=4;","        onlineSend(onlineCommand(\"DONE\"));","    }      // 重开流程：进入等待双方阶段，并通知服务端我已完成","    else {","        archiveStage=3;","    }","    if(closeAfterOnline) {","        onlineRequestHome();","    }      // 如果本来就要关程序，那就顺势走离开流程","}","// 【函数 onlineSave】以 raw 名称把权威历史存为本机联网复盘。","// 处理步骤：修剪/校验名称；枚举已有合法复盘名称；重名附加(2)、(3)...且截断基名控制长度；组装ONLINE","// 记录及本机颜色/结果原因/开局时间；writeRecord。","// 变量含义：first/last 为首尾位置；name 清理后的名称；names 已有名数组；info/find 为文件枚举；","// r 为读回记录；base 为原名；i 为重名序号；suffix 为编号缓冲；record 为待写记录。","// 注意：联网未完也 replay=true；只保存已收到确认的 game，不记录尚未获确认的落子请求。","bool onlineSave(const std::wstring& raw) {","    size_t first=raw.find_first_not_of(L\" \\t\\r\\n\"),last=raw.find_last_not_of(L\" \\t\\r\\n\");","    if(first==std::wstring::npos) {","        toast(L\"\\u8bf7\\u8f93\\u5165\\u68cb\\u5c40\\u540d\\u79f0\");","        return false;","    }","    std::wstring name=raw.substr(first,last-first+1);","    // 修剪首尾空白后的候选显示名；后面再检查长度、换行和重名。","    if(name.size()>24 || name.find_first_of(L\"\\r\\n\\t\")!=std::wstring::npos) {","        toast(L\"\\u540d\\u79f0\\u6700\\u591a24\\u5b57\\uff0c\\u4e0d\\u80fd\\u5305\\u542b\\u6362\\u884c\");","        return false;","    }","    std::vector<std::wstring> names;","    WIN32_FIND_DATAW info;","    HANDLE find=FindFirstFileW(L\"data\\\\replays\\\\*.greplay\",&info);","    if(find!=INVALID_HANDLE_VALUE) {","        do {","            if(info.dwFileAttributes&(FILE_ATTRIBUTE_DIRECTORY|FILE_ATTRIBUTE_REPARSE_POINT)) {","                continue;","            }","            GameRecord r;","            if(readRecord(std::wstring(L\"data\\\\replays\\\\\")+info.cFileName,true,r)) {","                names.push_back(r.name);","            }","        } while(FindNextFileW(find,&info));","        FindClose(find);","    }","    std::wstring base=name;","    // base 保存原始名字，追加编号时要在它基础上截断","    for(int i=2;std::find(names.begin(),names.end(),name)!=names.end();++i) {","        wchar_t suffix[32];","        std::swprintf(suffix,32,L\"(%d)\",i);","        name=base.substr(0,24-std::wcslen(suffix))+suffix;","        // 给后缀留出宽字符代码单元数，最终name.size不超过24。","    }","    GameRecord record;","    record.name=name;","    record.mode=\"ONLINE\";","    record.human=netRole+1;","    // human 记录本机当时执的颜色，复盘时才能正确显示「本机当时执黑/白」","    record.replay=true;","    record.game=game;","    record.reason=netState.reason;","    record.started=netState.started;","    // 结束原因和开局时间也一并记下","    if(!writeRecord(record)) {","        toast(L\"\\u4fdd\\u5b58\\u5931\\u8d25\\uff0c\\u8bf7\\u91cd\\u8bd5\\u6216\\u53d6\\u6d88\");","        return false;","    }","    toast(L\"\\u590d\\u76d8\\u5df2\\u4fdd\\u5b58\\u5230\\u672c\\u673a\");","    return true;","    // 保存成功提示","}","// 【函数 onlineName】打开联网命名框并生成默认名字。","// 处理步骤：archiveStage=2；报告SAVE 2；取本地时间组成“联网年月日_时分秒”；显示并聚焦nameEdit。","// 变量含义：t 为SYSTEMTIME；value 为名称缓冲。","void onlineName() {","    archiveStage=2;","    onlineSaveStatus(2);","    SYSTEMTIME t;","    GetLocalTime(&t);","    wchar_t value[64];","    // 用当前时间生成一个默认名字，玩家不改也能直接保存","    std::swprintf(value,64,L\"\\u8054\\u7f51%04d%02d%02d_%02d%02d%02d\",t.wYear,t.wMonth,t.wDay,t.wHour,t.wMinute,t.wSecond);","    SetWindowTextW(nameEdit,value);","    ShowWindow(nameEdit,SW_SHOW);","    SetFocus(nameEdit);","}","// 【函数 onlineConnect】验证表单，必要时启动服务端，并进入异步连接阶段。","// 处理步骤：端口纯数字且1..65535；选择本地回环/填写IP并校验IPv4；记住有效表单；朋友准备HELLO 2","// GUEST；房主生成GUID口令、建就绪事件、隐藏启动服务器；隐藏表单并设10秒总deadline。","// 变量含义：portText/ipText 是输入缓冲；p 是端口字符串；number 为解析整数；a/b/c/d 为IPv4四段，","// extra 检测尾随字符；id 为GUID；token 为口令文本；eventName 为事件名；directory/exe 为目录与服务","// exe路径；line 为宽输出流；args 为可修改命令行；si 为启动信息；pi 为进程/线程句柄结果。","// 注意：CreateProcess 参数包含端口、口令和父PID。这里没有立即连接：updateOnline 等","// serverReady亮起，避免服务端还没listen就连接失败。","void onlineConnect() {","    wchar_t portText[32],ipText[128];","    GetWindowTextW(portEdit,portText,32);","    GetWindowTextW(ipEdit,ipText,128);","    // 取回玩家填的端口和地址","    std::wstring p=portText;","    if(p.empty() || p.find_first_not_of(L\"0123456789\")!=std::wstring::npos) {","        netError=L\"\\u7aef\\u53e3\\u5fc5\\u987b\\u662f1\\u81f365535\\u7684\\u6574\\u6570\";","        return;","    }","    long number=std::wcstol(portText,NULL,10);","    if(number<1 || number>65535) {","        netError=L\"\\u7aef\\u53e3\\u5fc5\\u987b\\u662f1\\u81f365535\\u7684\\u6574\\u6570\";","        return;","    }","    netPort=static_cast<int>(number);","    netHosting=netStage==1;","    // 记录这次到底是房主还是朋友","    netAddress=netHosting?\"127.0.0.1\":toUtf8(ipText);","    // 房主连自己，朋友连填进来的地址","    unsigned a,b,c,d;","    char extra;","    if(std::sscanf(netAddress.c_str(),\"%u.%u.%u.%u%c\",&a,&b,&c,&d,&extra)!=4 || a>255 || b>255 || c>255 || d>255 || a==0 || a>=224) {","        netError=L\"\\u8bf7\\u586b\\u5199\\u6709\\u6548\\u7684IPv4\\u5730\\u5740\";","        return;","        // 格式不对就提示并中止，保留玩家已填的内容","    }","    recordDirectories();","    WritePrivateProfileStringW(L\"network\",netHosting?L\"host_port\":L\"port\",portText,L\".\\\\data\\\\network.ini\");","    // 分别保存创建/加入端口；只有下一行的非房主分支才保存加入地址。","    if(!netHosting) {","        WritePrivateProfileStringW(L\"network\",L\"address\",ipText,L\".\\\\data\\\\network.ini\");","    }","    netGreeting=\"HELLO 2 GUEST\";","    // 默认先按朋友端准备问候语","    // 【阅读提示】房主启动独立服务器后也作为客户端连接127.0.0.1；两边落子都经过同一个裁判。","    if(netHosting) {","        GUID id;","        if(FAILED(CoCreateGuid(&id))) {","            netError=L\"\\u65e0\\u6cd5\\u751f\\u6210\\u623f\\u95f4\\u6807\\u8bc6\\uff0c\\u8bf7\\u91cd\\u8bd5\";","            return;","        }      // GUID格式化为房主座位口令，同时传给本机服务进程；不是网络加密机制。","        char token[64];","        std::sprintf(token,\"%08lx%04x%04x%02x%02x%02x%02x%02x%02x%02x%02x\",id.Data1,id.Data2,id.Data3,","        id.Data4[0],id.Data4[1],id.Data4[2],id.Data4[3],id.Data4[4],id.Data4[5],id.Data4[6],id.Data4[7]);","        netGreeting=std::string(\"HELLO 2 HOST \")+token;","        // 房主的问候语要带上这个口令","        std::string eventName=std::string(\"Local\\\\GomokuReady-\")+token;","        serverReady=CreateEventA(NULL,TRUE,FALSE,eventName.c_str());","        // 创建与子进程约定的就绪事件","        if(!serverReady) {","            netError=L\"\\u521b\\u5efa\\u623f\\u95f4\\u5931\\u8d25\\uff0c\\u8bf7\\u91cd\\u8bd5\";","            return;","        }","        wchar_t directory[32768];","        GetCurrentDirectoryW(32768,directory);","        std::wstring exe=std::wstring(directory)+L\"\\\\GomokuServer.exe\";","        // 服务端程序就在本程序旁边，用当前目录拼出完整路径","        std::wostringstream line;","        line<<L'\"'<<exe<<L\"\\\" \"<<netPort<<L' '<<fromUtf8(token)<<L' '<<GetCurrentProcessId();","        // 参数依次是端口、口令、本进程编号","        std::wstring args=line.str();","        STARTUPINFOW si;","        ZeroMemory(&si,sizeof(si));","        si.cb=sizeof(si);","        si.dwFlags=STARTF_USESHOWWINDOW;","        si.wShowWindow=SW_HIDE;","        PROCESS_INFORMATION pi;","        ZeroMemory(&pi,sizeof(pi));","        if(!CreateProcessW(exe.c_str(),&args[0],NULL,NULL,FALSE,CREATE_NO_WINDOW,NULL,NULL,&si,&pi)) {","            CloseHandle(serverReady);","            serverReady=NULL;","            netError=L\"\\u542f\\u52a8\\u5931\\u8d25\\uff0c\\u8bf7\\u68c0\\u67e5GomokuServer.exe\";","            return;","            // 创建失败时清理句柄并提示玩家检查文件是否齐全","        }","        serverProcess=pi.hProcess;","        CloseHandle(pi.hThread);","        // serverProcess 记下句柄，之后要负责收尾","    }","    onlineForms(false);","    netStage=3;","    netError.clear();","    netRole=-1;","    netConnected=false;","    netLost=false;","    // 进入「连接中」这一步","    // 语句说明：房主还需等serverReady；netConnectAt只设最早时刻，netDeadline给整个阶段10秒上限。","    netConnectAt=GetTickCount64()+1;","    netDeadline=GetTickCount64()+10000;","}","// 【函数 onlineLobbyLeave】打开等待室离开询问。","// 处理步骤：lobbyExit=true；若本机已准备，先发送READY 0取消准备。","// 变量含义：此时还没真正CLOSE；用户随后可选择否。","void onlineLobbyLeave() {","    lobbyExit=true;","    if(netRole>=0 && netState.ready[netRole]) {","        onlineSend(\"READY 0\");","    }","}      // 这里只发取消准备并弹询问；确认离开后才由onlineDeparture提交CLOSE。","// 【函数 onlineAction】处理所有 NetAction 按钮。","// 处理步骤：创建/加入设置表单并恢复INI；连接/取消转相应函数；准备/询问/保存/再战按按钮分流；复制按","// 钮组装IP端口并写系统剪贴板。","// 变量含义：id 动作；value 在不同分支分别是INI/命名缓冲或复制输出流；content 为复制正文；ok","// 成功标志；memory 为可移动全局内存；pointer 为GlobalLock后地址。","// 注意：A_NET_AGAIN为同意再战；剪贴板内存仅在交付失败时自行释放，交付成功后由系统管理。","void onlineAction(int id) {","    switch(id) {","        case A_ONLINE:","        onlineEnter();","        break;","        case A_NET_HOST:","        case A_NET_JOIN:","        netStage=id==A_NET_HOST?1:2;","        netError.clear();","        hostAddresses=localAddresses();","        // 进入创建或加入的页面，并查询本机地址","        {","            wchar_t value[128];","            GetPrivateProfileStringW(L\"network\",netStage==1?L\"host_port\":L\"port\",L\"5000\",value,128,L\".\\\\data\\\\network.ini\");","            SetWindowTextW(portEdit,value);","            if(netStage==2) {","                GetPrivateProfileStringW(L\"network\",L\"address\",L\"\",value,128,L\".\\\\data\\\\network.ini\");","                SetWindowTextW(ipEdit,value);","            }","        }","        onlineForms(true);","        break;","        case A_NET_BACK:","        onlineForms(false);","        netError.clear();","        if(netStage==0) {","            page=MODE_MENU;","        }","        else {","            netStage=0;","        }","        break;","        // 连接页和联网菜单的「返回」去向不同","        case A_NET_CONNECT:","        onlineConnect();","        break;","        case A_NET_CANCEL:","        onlineStop();","        netStage=netHosting?1:2;","        netError=L\"\\u5df2\\u53d6\\u6d88\\u8fde\\u63a5\";","        onlineForms(true);","        break;","        case A_NET_READY:","        if(!netPending && netRole>=0) {","            onlineSend(netState.ready[netRole]?\"READY 0\":\"READY 1\");","        }","        break;","        // 等待室里点准备或取消准备","        case A_NET_LEAVE:","        onlineLobbyLeave();","        break;","        case A_NET_YES:","        if(lobbyExit) {","            onlineDeparture(LEAVE_LOBBY);","        }      // 确认离开等待室时发送CLOSE；不同于先前只撤销READY。","        else {","            onlineAnswer(true);","        }","        break;","        case A_NET_NO:","        closeAfterOnline=false;","        if(lobbyExit) {","            lobbyExit=false;","        }","        else {","            onlineAnswer(false);","        }","        break;","        // 取消关闭程序或拒绝对方请求","        case A_NET_RESTART:","        onlineAsk(1);","        break;","        // 申请重开","        case A_NET_EXIT:","        onlineAsk(2);","        break;","        case A_NET_UNDO:","        onlineAsk(3);","        break;","        case A_NET_RESIGN:","        onlineAsk(4);","        break;","        case A_NET_SAVE_YES:","        onlineName();","        break;","        case A_NET_SAVE_NO:","        onlineArchiveDone();","        break;","        // 不保存，直接进入下一步","        case A_NET_WRITE:","        {","            wchar_t value[128];","            GetWindowTextW(nameEdit,value,128);","            if(onlineSave(value)) {","                onlineArchiveDone();","            }","            break;","        }      // 取回命名框内容，保存成功后进入下一步","        case A_NET_NAME_CANCEL:","        hideName();","        archiveStage=1;","        onlineSaveStatus(1);","        break;","        case A_NET_AGAIN:","        // 同意再战；有效连接下设置等待阶段并发送AGAIN。","        if(netLost || netState.phase==N_CLOSED) {","            onlineHome();","        }","        else {","            archiveStage=4;","            onlineSend(onlineCommand(\"AGAIN\"));","        }","        break;","        // 同意再战；如果对方已不在就直接回去","        case A_NET_HOME:","        onlineRequestHome();","        break;","        // 其余情况都走「请求回主菜单」","        // 【阅读提示】剪贴板：成功SetClipboardData后系统接管memory；失败才由本函数GlobalFree。","        case A_NET_COPY:","        {","            if(copyAddress.empty()) {","                toast(L\"\\u672a\\u8bc6\\u522b\\u5730\\u5740\\uff0c\\u8bf7\\u4eceTailscale\\u590d\\u5236\");","                break;","            }","            std::wostringstream value;","            value<<L\"IP: \"<<copyAddress<<L\"\\r\\n\\u7aef\\u53e3: \"<<netPort;","            // 拼出要复制的文字：地址加换行加端口","            std::wstring content=value.str();","            bool ok=false;","            if(OpenClipboard(getHWnd())) {","                HGLOBAL memory=GlobalAlloc(GMEM_MOVEABLE,(content.size()+1)*sizeof(wchar_t));","                // GMEM_MOVEABLE 是剪贴板要求的内存类型","                if(memory) {","                    void* pointer=GlobalLock(memory);","                    if(pointer) {","                        std::memcpy(pointer,content.c_str(),(content.size()+1)*sizeof(wchar_t));","                        GlobalUnlock(memory);","                        // 把文字拷进这块内存","                        if(EmptyClipboard() && SetClipboardData(CF_UNICODETEXT,memory)) {","                            ok=true;","                        }","                    } if(!ok) {","                        GlobalFree(memory);","                    }","                }      // 失败时才需要自己释放这块内存","                CloseClipboard();","                // 用完必须关闭剪贴板，否则别的程序无法使用","            }","            toast(ok?L\"\\u8fde\\u63a5\\u4fe1\\u606f\\u5df2\\u590d\\u5236\":L\"\\u590d\\u5236\\u5931\\u8d25\\uff0c\\u8bf7\\u91cd\\u8bd5\");","            break;","        }","    }","}","// 【函数 onlineLeaveText】按 why 和是否自己 mine 生成离开提示。","// 处理步骤：自己主动离开统一显示已通知；其他情况switch映射朋友离开、房主关房、退出、拒绝、取消、断","// 线。","// 变量含义：why 为LeaveReason；mine 表示离开者是否本机。","std::wstring onlineLeaveText(int why,bool mine) {","    if(mine && why!=LEAVE_DROP) {","        return L\"\\u5df2\\u901a\\u77e5\\u5bf9\\u65b9\\uff0c\\u672c\\u6b21\\u8fde\\u63a5\\u7ed3\\u675f\";","    }      // 自己主动离开且原因不是掉线，就统一显示这句","    switch(why) {","        case LEAVE_LOBBY:","        return L\"\\u5bf9\\u65b9\\u5df2\\u79bb\\u5f00\\u623f\\u95f4\\uff0c\\u7b49\\u5f85\\u5176\\u4ed6\\u73a9\\u5bb6\\u52a0\\u5165\";","        // 下面按不同原因给出对方视角的说明","        case LEAVE_HOST:","        return L\"\\u623f\\u4e3b\\u5df2\\u5173\\u95ed\\u623f\\u95f4\";","        case LEAVE_QUIT:","        return L\"\\u5bf9\\u624b\\u9000\\u51fa\\u4e86\\u5bf9\\u5c40\\uff0c\\u672c\\u5c40\\u5df2\\u4e2d\\u6b62\";","        case LEAVE_DECLINE:","        return L\"\\u5bf9\\u624b\\u62d2\\u7edd\\u4e86\\u518d\\u6765\\u4e00\\u5c40\";","        case LEAVE_CANCEL:","        return L\"\\u5bf9\\u624b\\u53d6\\u6d88\\u4e86\\u518d\\u6765\\u4e00\\u5c40\";","        default:return L\"\\u4e0e\\u5bf9\\u624b\\u7684\\u8fde\\u63a5\\u5df2\\u4e2d\\u65ad\";","        // 其余(含掉线)统一显示为连接中断","    }","}","// 【函数 onlineDisconnected】处理连接失败/丢失。","// 处理步骤：清连接及待确认；本来正在离开就回首页；尚未开局则退表单重试；已开局保留明确结束原因，否","// 则补断线；未处理保存就询问，已处理则安排返回。","// 变量含义：不是重连功能：本局断线后只能保存复盘，不能继续原联网对局。","void onlineDisconnected() {","    netConnected=false;","    netLost=true;","    netPending=false;","    netMovePending=false;","    if(netLeaving) {","        onlineHome();","        return;","    }      // 本来就在离开流程里，断线只是顺理成章的结果","    if(!netStarted) {","        onlineStop();","        netStage=netHosting?1:2;","        page=NETWORK_PAGE;","        onlineForms(true);","        // 还没开局就断线，退回填写页面","        if(netError.empty()) {","            netError=L\"\\u8fde\\u63a5\\u5931\\u8d25\\uff0c\\u8bf7\\u68c0\\u67e5\\u5730\\u5740\\u4e0e\\u7f51\\u7edc\";","        }      // 给出连接失败提示","        lobbyExit=false;","        return;","        // 清掉「要离开」的标记，让玩家可以重新填","    }","    if(netEndNotice.empty()) {","        netState.leaveReason=LEAVE_DROP;","        netState.leaver=1-netRole;","        netState.phase=N_CLOSED;","        // 让界面把这次离开的原因显示出来","        netEndNotice=L\"\\u4e0e\\u5bf9\\u624b\\u7684\\u8fde\\u63a5\\u5df2\\u4e2d\\u65ad\\uff0c\\u672c\\u5c40\\u65e0\\u6cd5\\u7ee7\\u7eed\";","        if(!game.result && netState.reason!=END_RESTART) {","            netState.reason=END_DISCONNECT;","        }      // 未完的棋局记为「连接中断」结束","    }","    if(archiveStage==0) {","        archiveStage=1;","        archiveRound=netState.round;","    }","    else if(archiveStage>=3) {","        archiveStage=5;","        if(!netAutoHomeAt) {","            netAutoHomeAt=GetTickCount64()+2000;","        }","    }","}","// 【函数 updateOnline】每帧处理联网计时、收消息、更新棋局和保存UI。","// 处理步骤：无关页面直接返回；处理自动返回/离开超时；连接中等就绪再start；循环take，分别处理延迟、","// ACK、WELCOME、事件、错误、STATE；合法STATE更新netState及game；新局清旧UI；新exitSerial回SEEN；终","// 局每个round只启动一次保存。","// 变量含义：message 当前正文；value 解析LATENCY的流；closing 临时保留关闭窗口意图；state 临时","// 解码当时状态的副本；oldRound 原局号；leaveOnStart 记录等待室退出与开局竞争；seen 为SEEN输出流。","// 注意：收到STATE时整体覆盖game；不要在UI保留未被服务端确认的“预测棋子”。一条普通STATE也会","// 清netPending，不是靠每条请求独立ACK配对。","// 仅联网 STATE：校验 -> 替换由服务器确认的游戏状态 -> 同步棋盘 -> 处理离开通知 -> 开始保存询问。失败时断开，返回 false。","bool applyOnlineStateMessage(const std::string& message) {","    // 【阅读提示】只有成功解码的STATE才整体替换netState；已开局后再将其game复制到显示用game。","    NetState state;","    if(netRole<0 || !netDecode(message,state)) {","        netError=L\"\\u6536\\u5230\\u5f02\\u5e38\\u7f51\\u7edc\\u6570\\u636e\\uff0c\\u8fde\\u63a5\\u5df2\\u505c\\u6b62\";","        onlineDisconnected();","        return false;","    }","    netPending=false;","    netMovePending=false;","    int oldRound=netState.round;","    netState=state;","    bool leaveOnStart=false;","    // 每次合法STATE都解除待确认标志；oldRound用于识别是否进入新局。","    if(netState.round>0) {","        if(oldRound!=netState.round || !netStarted) {","            leaveOnStart=lobbyExit;","            lobbyExit=false;","            // 新局开始，清掉上一局的界面残留","            hideName();","            archiveStage=0;","            archiveRound=-1;","            currentName.clear();","            loadedPath.clear();","            netEndNotice.clear();","            netAutoHomeAt=0;","            netExitAck=false;","            // 清空棋局名称与路径，新的这一局要重新命名","        }      // 各种与结束相关的提示和标记也一并复位","        netStarted=true;","        game=netState.game;","        gameMode=\"ONLINE\";","        page=GAME_PAGE;","        dialog=NO_DIALOG;","        // 用服务端的棋盘刷新本机显示的棋局","    }","    if(leaveOnStart && netState.phase==N_PLAY) {","        onlineAsk(2);","    }","    // 【阅读提示】每个新的exitSerial只处理一次并回SEEN，让服务端知道离开通知已到达本机。","    if(netState.exitSerial>netSeenExit) {","        netSeenExit=netState.exitSerial;","        std::ostringstream seen;","        seen<<\"SEEN \"<<netSeenExit;","        netClient.sendMessage(seen.str());","        if(netState.phase==N_LOBBY) {","            // 等待室里有人离开：直接提示即可","            if(netState.leaver!=netRole) {","                toast(onlineLeaveText(netState.leaveReason,false));","            }      // 还没开始对局时的离开提示","        } else {","            netEndNotice=onlineLeaveText(netState.leaveReason,netState.leaver==netRole);","            // 记录明确离开原因；下行netLost也用于正常关房后的交互锁定，不仅表示故障掉线。","            netLost=true;","            netPending=false;","            // 不允许再落子","            if(!netStarted) {","                netStage=5;","                onlineForms(false);","                if(!netLeaving) {","                    netAutoHomeAt=GetTickCount64()+2000;","                }","            }","            else if(archiveStage==0) {","                archiveStage=1;","                archiveRound=netState.round;","            }","            else if(archiveStage>=3 && !netLeaving) {","                archiveStage=5;","                netAutoHomeAt=GetTickCount64()+2000;","            }","        }","    }      // 一局结束或进入重开协商时，开始本机的保存询问","    if((netState.phase==N_FINISH || netState.phase==N_RESTART) && archiveRound!=netState.round) {","        archiveRound=netState.round;","        archiveStage=1;","        // 每个局号只触发一次","    }","    return true;","}","// 联网更新入口：检查连接/离开超时，读取消息；STATE 交给上面的状态处理函数。","void updateOnline() {","    if(page!=NETWORK_PAGE && !(page==GAME_PAGE && gameMode==\"ONLINE\")) {","        return;","    }","    if(netAutoHomeAt && GetTickCount64()>=netAutoHomeAt) {","        if(netStarted) {","            onlineHome();","        }","        else {","            onlineEnter();","            if(closeAfterOnline) {","                running=false;","                closeAfterOnline=false;","            }","        }      // 该自动返回了","        return;","    }","    if(netLeaving && GetTickCount64()>=netLeaveDeadline) {","        onlineHome();","        return;","    }","    // 【阅读提示】整体连接UI最多等待10秒；房主必须观察就绪事件后再启动网络线程。","    if(netStage==3 && !netConnected) {","        if(serverProcess && WaitForSingleObject(serverProcess,0)==WAIT_OBJECT_0) {","            netError=L\"\\u670d\\u52a1\\u7aef\\u542f\\u52a8\\u5931\\u8d25\\uff0c\\u7aef\\u53e3\\u53ef\\u80fd\\u5df2\\u88ab\\u5360\\u7528\";","            onlineDisconnected();","            return;","            // 提示可能是端口被占用","        }","        if(netConnectAt && GetTickCount64()>=netConnectAt && (!netHosting || (serverReady && WaitForSingleObject(serverReady,0)==WAIT_OBJECT_0))) {","            netConnectAt=0;","            if(!netClient.start(netAddress,netPort,netGreeting)) {","                netError=L\"\\u7f51\\u7edc\\u7ebf\\u7a0b\\u542f\\u52a8\\u5931\\u8d25\";","                onlineDisconnected();","                return;","            }","        }      // 连接线程启动逻辑结束；下一判断单独处理整体连接超时。","        if(GetTickCount64()>netDeadline) {","            netError=L\"\\u8fde\\u63a5\\u8d85\\u65f6\\uff0c\\u8bf7\\u68c0\\u67e5\\u5730\\u5740\\u3001\\u9632\\u706b\\u5899\\u548cTailscale\";","            onlineDisconnected();","            return;","        }","    }","    std::string message;","    while(netClient.take(message)) {","        if(message==\"PING\") {","            netClient.sendMessage(\"PONG\");","            continue;","        }","        if(message.compare(0,8,\"LATENCY \")==0) {","            std::istringstream value(message.substr(8));","            value>>netLatency;","            continue;","        }      // 延迟数据单独处理","        if(message==\"CLOSE_ACK\") {","            netExitAck=true;","            // 收到确认","            if(netLeaving) {","                if(!netStarted) {","                    bool closing=closeAfterOnline;","                    onlineEnter();","                    if(closing) {","                        running=false;","                    }","                }","                else {","                    onlineHome();","                }      // 已开局走onlineHome；上方未开局分支回到联网菜单，并保留关窗口意图。","                return;","            }","            continue;","        }","        if(message==\"WELCOME 0\" || message==\"WELCOME 1\") {","            netRole=message.back()-'0';","            netConnected=true;","            netStage=4;","            netPending=false;","            netError.clear();","            continue;","        }","        if(message==\"EVENT REFUSED\") {","            toast(L\"\\u5bf9\\u65b9\\u62d2\\u7edd\\u4e86\\u4f60\\u7684\\u91cd\\u5f00\\u8bf7\\u6c42\");","            continue;","        }      // 服务端通知重开请求被对方拒绝；短提示不改变棋盘。","        if(message==\"EVENT UNDO_REFUSED\") {","            toast(L\"\\u5bf9\\u624b\\u62d2\\u7edd\\u4e86\\u4f60\\u7684\\u6094\\u68cb\\u8bf7\\u6c42\");","            continue;","        }      // 服务端通知悔棋请求被对方拒绝。","        // 语句说明：服务端通知悔棋已完成，随后以STATE中的历史为准。","        if(message==\"EVENT UNDO_ACCEPTED\") {","            toast(L\"\\u6094\\u68cb\\u5df2\\u5b8c\\u6210\\uff0c\\u8bf7\\u91cd\\u65b0\\u843d\\u5b50\");","            continue;","        }","        if(message==\"EVENT INVALID\") {","            netPending=false;","            netMovePending=false;","            if(netLeaving) {","                netLeaving=false;","                closeAfterOnline=false;","            }","            toast(L\"\\u72b6\\u6001\\u5df2\\u66f4\\u65b0\\uff0c\\u8bf7\\u91cd\\u65b0\\u64cd\\u4f5c\");","            continue;","            // 提示玩家重新操作","        }","        if(message.compare(0,6,\"ERROR \")==0 || message==\"LOST\") {","            if(netState.phase==N_CLOSED && !netEndNotice.empty()) {","                if(netLeaving) {","                    onlineHome();","                    return;","                }","                netConnected=false;","                continue;","                // 房间已正常关闭，安静处理","            }","            if(message==\"ERROR FULL\") {","                netError=L\"\\u623f\\u95f4\\u5df2\\u6ee1\";","            }      // 房间已满","            else if(message==\"ERROR STARTED\") {","                netError=L\"\\u5bf9\\u65b9\\u6b63\\u5728\\u5bf9\\u5c40\\uff0c\\u4e0d\\u80fd\\u4e2d\\u9014\\u52a0\\u5165\";","            }      // 对方正在对局，不能中途加入","            else if(message==\"ERROR VERSION\") {","                netError=L\"\\u53cc\\u65b9\\u7248\\u672c\\u4e0d\\u517c\\u5bb9\\uff0c\\u8bf7\\u540c\\u65f6\\u66f4\\u65b0\\u6e38\\u620f\\u548c\\u670d\\u52a1\\u7aef\";","            }      // 双方版本不一致","            else if(message!=\"LOST\") {","                netError=L\"\\u8fde\\u63a5\\u5931\\u8d25\\uff0c\\u8bf7\\u68c0\\u67e5\\u5730\\u5740\\u3001\\u7aef\\u53e3\\u548c\\u7f51\\u7edc\";","            }      // 其它连接问题","            onlineDisconnected();","            break;","            // 断线处理","        }","        if (!applyOnlineStateMessage(message)) {","            break;","        }","    }","}","// 【函数 opponentProgress】给出对方保存/再战的进度文字。","// 处理步骤：身份无效或lost返回空；按again、done、saveStage顺序选提示。","// 变量含义：other=1-netRole 是对方座位。","std::wstring opponentProgress() {","    if(netRole<0 || netLost) {","        return L\"\";","    }","    int other=1-netRole;","    if(netState.again[other]) {","        return L\"\\u5bf9\\u65b9\\u5df2\\u540c\\u610f\\u518d\\u6765\\u4e00\\u5c40\\uff0c\\u7b49\\u5f85\\u4f60\\u9009\\u62e9\";","    }      // 对方已同意再来一局","    if(netState.done[other]) {","        return L\"\\u5bf9\\u65b9\\u5df2\\u5904\\u7406\\u4fdd\\u5b58\\uff0c\\u7b49\\u5f85\\u4f60\\u5b8c\\u6210\";","    }      // 对方已处理完保存，正在等我","    if(netState.saveStage[other]==1) {","        return L\"\\u5bf9\\u65b9\\u6b63\\u5728\\u9009\\u62e9\\u662f\\u5426\\u4fdd\\u5b58\";","    }      // 对方正在选择是否保存","    if(netState.saveStage[other]==2) {","        return L\"\\u5bf9\\u65b9\\u6b63\\u5728\\u547d\\u540d\\u4fdd\\u5b58\";","    }      // 对方正在命名","    if(netState.saveStage[other]==3) {","        return netState.phase==N_RESTART?L\"\\u5bf9\\u65b9\\u5df2\\u5904\\u7406\\u4fdd\\u5b58\":L\"\\u5bf9\\u65b9\\u6b63\\u5728\\u51b3\\u5b9a\\u662f\\u5426\\u518d\\u6765\\u4e00\\u5c40\";","    }      // 对方在决定要不要再来一局，或已经处理完","    return L\"\";","}","// 【函数 drawOnlinePage】绘制联网菜单、表单、连接中、等待室和开局前关闭提示。","// 处理步骤：根据netStage分支；登记能用的按钮；等待室显示双方present/ready；退出询问时清buttons只保","// 留是/否。","// 变量含义：value 为端口说明缓冲；i 为两方索引。","// 注意：绘图之外还登记按钮，实际执行仍在onlineAction。输入框本体由Win32控件绘制。","// 联网菜单：创建房间、加入房间、返回。","void drawOnlineMenu() {","    addButton(A_NET_HOST,680,420,440,90,L\"\\u521b\\u5efa\\u623f\\u95f4\");","    addButton(A_NET_JOIN,680,550,440,90,L\"\\u52a0\\u5165\\u623f\\u95f4\");","    // 创建房间 / 加入房间 / 返回","    addButton(A_NET_BACK,680,750,440,90,L\"\\u8fd4\\u56de\");","    text(510,960,L\"\\u53cc\\u65b9\\u5148\\u8fde\\u63a5Tailscale\\uff0c\\u623f\\u4e3b\\u4fdd\\u6301\\u5728\\u7ebf\\u3002\",32);","    // 提醒玩家双方都要先连上 Tailscale","}","// 连接表单：创建房间填写端口；加入房间填写地址和端口。","void drawOnlineConnectionForm() {","    text(620,320,netStage==1?L\"\\u521b\\u5efa\\u623f\\u95f4 \\u00b7 \\u623f\\u4e3b\\u6267\\u9ed1\":L\"\\u52a0\\u5165\\u623f\\u95f4 \\u00b7 \\u4f60\\u5c06\\u6267\\u767d\",40);","    // 页面标题说明本机将执黑还是执白","    if(netStage==1) {","        text(420,450,hostAddresses,28);","        text(430,520,L\"\\u628aTailscale\\u5730\\u5740\\u548c\\u7aef\\u53e3\\u544a\\u8bc9\\u670b\\u53cb\\u3002\",30);","    }      // 房主端显示本机地址，并把端口告诉朋友","    else {","        text(460,425,L\"\\u623f\\u4e3bIPv4\\u5730\\u5740\",32);","    }      // 朋友端显示输入标签","    text(460,600,L\"\\u7aef\\u53e3\",32);","    // 端口输入标签","    addButton(A_NET_CONNECT,510,790,320,80,netError.empty()?(netStage==1?L\"\\u521b\\u5efa\":L\"\\u8fde\\u63a5\"):L\"\\u91cd\\u8bd5\");","    addButton(A_NET_BACK,970,790,320,80,L\"\\u8fd4\\u56de\");","    // 连接按钮；失败过就显示「重试」","    text(420,980,netError,28);","    // 错误提示文字","}","// 连接过程：显示等待及取消连接。","void drawOnlineConnecting() {","    text(610,460,netHosting?L\"\\u6b63\\u5728\\u521b\\u5efa\\u623f\\u95f4\\u2026\\u2026\":L\"\\u6b63\\u5728\\u8fde\\u63a5\\u623f\\u4e3b\\u2026\\u2026\",40);","    // 正在创建或正在连接","    addButton(A_NET_CANCEL,690,700,420,80,L\"\\u53d6\\u6d88\\u8fde\\u63a5\");","    // 取消按钮","}","// 连接结束：显示离开/断线原因，等待自动返回。","void drawOnlineEndNotice() {","    text(500,520,netEndNotice,36);","    text(630,650,L\"\\u5373\\u5c06\\u8fd4\\u56de\\u8054\\u7f51\\u83dc\\u5355\",32);","}","// 等待室：显示双方准备情况、执棋颜色和离开确认。","void drawOnlineLobby() {","    text(470,335,hostAddresses.empty()?L\"\\u623f\\u4e3b\\u5730\\u5740\\uff1a\"+fromUtf8(netAddress):netHosting?hostAddresses:L\"\\u623f\\u4e3b\\u5730\\u5740\\uff1a\"+fromUtf8(netAddress),30);","    // 房主显示自己的地址，朋友显示房主地址","    wchar_t value[80];","    std::swprintf(value,80,L\"\\u7aef\\u53e3 %d \\u00b7 \\u9ed1\\u68cb\\u5148\\u4e0b\",netPort);","    text(600,395,value,32);","    // 端口和先手说明","    for(int i=0;i<2;++i) {","        text(540,500+i*100,(i==0?std::wstring(L\"\\u623f\\u4e3b \\u00b7 \\u9ed1\\u68cb\\uff1a\"):std::wstring(L\"\\u670b\\u53cb \\u00b7 \\u767d\\u68cb\\uff1a\"))+","        (!netState.present[i]?L\"\\u7b49\\u5f85\\u52a0\\u5165\":netState.ready[i]?L\"\\u5df2\\u51c6\\u5907\":L\"\\u672a\\u51c6\\u5907\"),36);","    }      // 房主一栏、朋友一栏","    text(520,785,netRole>=0 && netState.ready[netRole]?L\"\\u4f60\\u5df2\\u51c6\\u5907\\uff0c\\u7b49\\u5f85\\u5bf9\\u65b9\\u51c6\\u5907\":L\"\\u4f60\\u5c1a\\u672a\\u51c6\\u5907\\uff0c\\u8bf7\\u70b9\\u51fb\\u51c6\\u5907\",30);","    // 本机准备状态提示","    text(650,720,netRole==0?L\"\\u4f60\\u6267\\u9ed1\\uff0c\\u9ed1\\u68cb\\u5148\\u4e0b\":L\"\\u4f60\\u6267\\u767d\\uff0c\\u7b49\\u5f85\\u9ed1\\u68cb\\u5148\\u4e0b\",32);","    // 说明本机执什么颜色","    if(netHosting) {","        addButton(A_NET_COPY,1010,380,320,75,L\"\\u590d\\u5236\\u8fde\\u63a5\\u4fe1\\u606f\",!lobbyExit && !netLeaving);","    }","    addButton(A_NET_READY,510,850,320,80,netRole>=0 && netState.ready[netRole]?L\"\\u53d6\\u6d88\\u51c6\\u5907\":L\"\\u51c6\\u5907\",!lobbyExit && !netPending && !netLeaving);","    // 准备 / 取消准备","    addButton(A_NET_LEAVE,970,850,320,80,L\"\\u79bb\\u5f00\\u623f\\u95f4\",!lobbyExit && !netLeaving);","    // 离开房间","    if(lobbyExit) {","        buttons.clear();","        text(690,1000,L\"\\u662f\\u5426\\u79bb\\u5f00\\u623f\\u95f4\\uff1f\",36);","        // 确认是否离开","        addButton(A_NET_YES,570,1090,260,75,L\"\\u662f\",!netLeaving);","        addButton(A_NET_NO,970,1090,260,75,L\"\\u5426\",!netLeaving);","        // 是 / 否","    }","}","// 房间页面入口：共同底板后，按 netStage 选择唯一一个页面内容。","void drawOnlinePage() {","    putimage(0,0,background);","    setfillcolor(EGERGB(246,241,224));","    solidroundrect(350,140,1450,1220,28);","    // 联网页面的背景和一个大圆角面板","    text(680,190,L\"\\u8054\\u7f51\\u5bf9\\u5f08\",58);","    if (netStage == 0) {","        drawOnlineMenu();","    } else if (netStage == 1 || netStage == 2) {","        drawOnlineConnectionForm();","    } else if (netStage == 3) {","        drawOnlineConnecting();","    } else if (netStage == 5) {","        drawOnlineEndNotice();","    } else {","        drawOnlineLobby();","    }","}","// 【函数 drawOnlineSidebar】绘制对局右侧联网控制区。","// 处理步骤：先画状态/颜色/步数/RTT；离开中只提示等待；archiveStage非0则画保存流程并return；否则登","// 记悔棋/重开/认输/退出，再按N_SELF/N_PEER显示相应人的询问按钮。","// 变量含义：step 步数缓冲；latency 为RTT输出流；free 表示N_PLAY且非pending；mine 是否为owner；","// prompt 为请求类型对应文字。","// 注意：不是每个玩家在N_SELF都能回答；只有owner能回答。N_PEER则只有另一方能回答，界面启用","// 条件与apply权限一致。","// 仅联网：显示连接、胜负/回合、身份、步数和延迟。","void drawOnlineStatus() {","    text(1270,150,netLost?L\"\\u8fde\\u63a5\\u5df2\\u7ed3\\u675f\":game.result==3?L\"\\u672c\\u5c40\\u5e73\\u5c40\":game.result?      // 顶部大字：连接状态、胜负、该谁落子","    (game.result==netRole+1?L\"\\u4f60\\u83b7\\u80dc\\u4e86\\uff01\":L\"\\u5bf9\\u65b9\\u83b7\\u80dc\\uff01\"):netState.phase==N_PLAY?","    (game.turn==netRole+1?L\"\\u8f6e\\u5230\\u4f60\\u843d\\u5b50\":L\"\\u7b49\\u5f85\\u5bf9\\u65b9\\u843d\\u5b50\"):L\"\\u68cb\\u5c40\\u5df2\\u6682\\u505c\",42);","    text(1270,210,netRole==0?L\"\\u4f60\\u6267\\u9ed1 \\u00b7 \\u623f\\u4e3b\":L\"\\u4f60\\u6267\\u767d \\u00b7 \\u670b\\u53cb\",30);","    // 本机身份说明","    wchar_t step[80];","    std::swprintf(step,80,L\"\\u5df2\\u4e0b %u \\u6b65\",static_cast<unsigned>(game.moves.size()));","    text(1270,260,step,28);","    // 已下多少手","    std::wostringstream latency;","    latency<<L\"\\u5ef6\\u8fdf\\uff1a\";","    if(netLatency<0) {","        latency<<L\"\\u6d4b\\u91cf\\u4e2d\";","    }","    else {","        latency<<netLatency<<L\" ms\";","    }      // 延迟文字","    text(1500,260,netLost?L\"\\u5df2\\u65ad\\u5f00\":latency.str(),26);","    // 断线时就显示已断开，否则显示延迟","}","// 仅联网结束保存流程：是否保存 -> 命名 -> 再来一局/等待/返回。","void drawOnlineArchivePanel() {","    text(1250,340,game.result?reasonText(netState.reason):L\"\\u672a\\u5b8c\\u590d\\u76d8\\uff0c\\u4e0d\\u53ef\\u7ee7\\u7eed\\u5bf9\\u5c40\",30);","    // 这一局的结果原因，或者「未完不可继续」的说明","    if(!netEndNotice.empty()) {","        text(1250,405,netEndNotice,26);","        text(1250,455,L\"\\u5b8c\\u6210\\u672c\\u673a\\u4fdd\\u5b58\\u9009\\u62e9\\u540e\\u8fd4\\u56de\",26);","        // 对方已经离开时的提示","    } else {","        text(1250,405,opponentProgress(),26);","    }      // 否则显示对方正在进行到哪一步","    if(archiveStage==1) {","        text(1250,610,L\"\\u662f\\u5426\\u4fdd\\u5b58\\u5230\\u672c\\u673a\\u4f9b\\u4ee5\\u540e\\u590d\\u76d8\\uff1f\",30);","        // 询问是否保存","        addButton(A_NET_SAVE_YES,1260,900,220,75,L\"\\u662f\");","        addButton(A_NET_SAVE_NO,1500,900,220,75,L\"\\u5426\");","    } else if(archiveStage==2) {","        text(1260,650,L\"\\u8bf7\\u4e3a\\u672c\\u68cb\\u5c40\\u547d\\u540d\\uff1a\",32);","        text(1260,800,L\"\\u6700\\u591a24\\u5b57\\uff0c\\u652f\\u6301\\u4e2d\\u6587\",28);","        // 命名提示与字数限制说明","        addButton(A_NET_WRITE,1260,900,220,75,L\"\\u4fdd\\u5b58\");","        addButton(A_NET_NAME_CANCEL,1500,900,220,75,L\"\\u53d6\\u6d88\");","    } else if(archiveStage==3) {","        text(1290,620,L\"\\u8981\\u4e0d\\u8981\\u518d\\u6765\\u4e00\\u5c40\\uff1f\",36);","        // 询问要不要再来一局","        addButton(A_NET_AGAIN,1260,900,220,75,L\"\\u662f\");","        addButton(A_NET_HOME,1500,900,220,75,L\"\\u5426\");","    } else if(archiveStage==4) {","        text(1250,600,L\"\\u4f60\\u7684\\u9009\\u62e9\\u5df2\\u63d0\\u4ea4\\uff0c\\u7b49\\u5f85\\u5bf9\\u65b9\",30);","        // 等待对方","        addButton(A_NET_HOME,1290,850,400,80,L\"\\u53d6\\u6d88\\u5e76\\u9000\\u51fa\");","    } else {","        text(1280,650,L\"\\u4e24\\u79d2\\u540e\\u8fd4\\u56de\\u4e3b\\u754c\\u9762\",32);","    }      // 两秒后返回主界面","}","// 仅联网对局：登记请求按钮、等待提示和双方确认。","void drawOnlinePlayPanel() {","    bool free=netState.phase==N_PLAY && !netPending;","    addButton(A_NET_UNDO,1290,325,400,70,L\"\\u8bf7\\u6c42\\u6094\\u68cb\\uff08\\u4e00\\u56de\\u5408\\uff09\",free && netState.lastMove(netRole)>=0);","    addButton(A_NET_RESTART,1290,410,400,70,L\"\\u8bf7\\u6c42\\u91cd\\u5f00\",free);","    // 请求重开","    addButton(A_NET_RESIGN,1290,495,400,70,L\"\\u8ba4\\u8f93\",free);","    // 认输","    addButton(A_NET_EXIT,1290,580,400,70,L\"\\u9000\\u51fa\\u5bf9\\u5c40\",free);","    // 退出对局","    if(netPending) {","        text(1250,1050,netMovePending?L\"\\u843d\\u5b50\\u786e\\u8ba4\\u4e2d\\u2026\\u2026\":L\"\\u7b49\\u5f85\\u670d\\u52a1\\u7aef\\u786e\\u8ba4\\u2026\\u2026\",28);","    }","    if(netLatency>500 || (netPending && GetTickCount64()-netPendingAt>1500)) {","        text(1250,1100,L\"\\u7f51\\u7edc\\u8f83\\u6162\\uff0c\\u6b63\\u5728\\u7b49\\u5f85\\u786e\\u8ba4\",26);","    }","    if(netState.phase==N_SELF || netState.phase==N_PEER) {","        bool mine=netState.owner==netRole;","        if(netState.phase==N_SELF && mine) {","            const wchar_t* prompt;","            if (netState.kind==1) {","                prompt = L\"\\u662f\\u5426\\u5411\\u5bf9\\u65b9\\u53d1\\u8d77\\u91cd\\u5f00\\u8bf7\\u6c42\\uff1f\";","            } else {","                if (netState.kind==2) {","                    prompt = L\"\\u9000\\u51fa\\u540e\\u4e0d\\u80fd\\u6062\\u590d\\uff0c\\u662f\\u5426\\u9000\\u51fa\\uff1f\";","                } else {","                    if (netState.kind==3) {","                        prompt = L\"\\u662f\\u5426\\u7533\\u8bf7\\u64a4\\u56de\\u81ea\\u5df1\\u6700\\u8fd1\\u4e00\\u56de\\u5408\\uff1f\";","                    } else {","                        prompt = L\"\\u786e\\u5b9a\\u8ba4\\u8f93\\u5417\\uff1f\";","                    }","                }","            }","            // kind=3显示悔棋确认；其他剩余类型kind=4显示认输确认。","            text(1250,730,prompt,28);","            // 询问玩家是否同意","        } else if(netState.phase==N_PEER && !mine) {","            text(1250,730,netState.kind==3?L\"\\u5bf9\\u65b9\\u8bf7\\u6c42\\u6094\\u68cb\\uff0c\\u662f\\u5426\\u540c\\u610f\\uff1f\":L\"\\u5bf9\\u65b9\\u8bf7\\u6c42\\u91cd\\u5f00\\uff0c\\u662f\\u5426\\u540c\\u610f\\uff1f\",28);","        }","        else {","            text(1250,730,netState.phase==N_PEER?L\"\\u7b49\\u5f85\\u5bf9\\u65b9\\u786e\\u8ba4\\u8bf7\\u6c42\\u2026\\u2026\":L\"\\u5bf9\\u65b9\\u6b63\\u5728\\u786e\\u8ba4\\u64cd\\u4f5c\\u2026\\u2026\",28);","        }      // 等待对方确认或对方正在确认","        if((netState.phase==N_SELF && mine) || (netState.phase==N_PEER && !mine)) {","            addButton(A_NET_YES,1260,900,220,75,L\"\\u662f\",!netPending);","            addButton(A_NET_NO,1500,900,220,75,L\"\\u5426\",!netPending);","            // 是 / 否","        }","    }","}","// 联网侧栏入口：公共状态后，明确选择离开中、保存中、对局中。","void drawOnlineSidebar() {","    drawOnlineStatus();","    if (netLeaving) {","        text(1250,1050,L\"\\u6b63\\u5728\\u901a\\u77e5\\u5bf9\\u65b9\\uff0c\\u8bf7\\u7a0d\\u5019\\u2026\\u2026\",28);","    } else if (archiveStage != 0) {","        drawOnlineArchivePanel();","    } else {","        drawOnlinePlayPanel();","    }","}","#endif"],"server_main.cpp":["// 【本文件阅读路线】仅服务器：启动监听、处理连接和消息、更新权威棋局；游戏窗口入口是 main.cpp。","// 【建议阅读 09 / 独立服务端入口】server_main.cpp","// main初始化 -> Peer连接槽 -> HELLO握手 -> NetState::apply -> STATE广播 -> 退出确认。","// 本文件与客户端main.cpp各有一个main，分别生成GomokuServer.exe与Gomoku.exe。","// 外部接口声明位置：标准库对应的头文件；Win32/Winsock系统头；EGE的graphics.h。","#define NOMINMAX","#define _WIN32_WINNT 0x0601      // 指定目标系统版本；不定义它，Windows 的一些较新接口会取不到","#include \"network_transport.h\"","#include \"network_protocol.h\"","#include <cstdlib>","#include <cstdio>","// 【函数 main（服务端）】独立服务进程入口；管理监听、握手、由服务器确认的游戏状态和广播。","// 处理步骤：验证参数；OpenProcess观察父进程；初始化Winsock并绑定监听；通知就绪事件；循环accept、","// pump、握手或apply、检测断线、确认离开、广播与心跳；最后关闭全部资源。","// 变量含义：全部局部量在下面对应声明处说明；返回2为参数错误、3为Winsock失败、4为绑定/监听失败、","// 0为循环正常结束。","// 注意：这个 main 与客户端 main 属于两个不同exe。房主客户端退出后服务端观察父句柄退出，避","// 免留下后台房间。","int main(int argc,char** argv) {","    // 语句说明：argc必须为4：程序名也算一项；缺少端口、口令或父进程PID即退出。","    if(argc!=4) {","        return 2;","    }","    // 语句说明：argv[1]端口；argv[2]房主口令；argv[3]父进程PID；argc包含exe本身。","    int port=std::atoi(argv[1]);","    std::string token=argv[2];","    DWORD parent=static_cast<DWORD>(std::strtoul(argv[3],NULL,10));","    if(port<1 || port>65535 || token.empty()) {","        return 2;","    }","    HANDLE parentProcess=OpenProcess(SYNCHRONIZE,FALSE,parent);","    // 用父进程编号打开它的句柄，只申请「等待它结束」这一项权限","    // 语句说明：data接收Winsock信息；MAKEWORD(2,2)请求Winsock 2.2，非零返回值表示初始化失败。","    WSADATA data;","    if(WSAStartup(MAKEWORD(2,2),&data)) {","        return 3;","    }","    // 语句说明：listener只用于接受新连接；实际读写交给accept返回的连接socket。","    SOCKET listener=socket(AF_INET,SOCK_STREAM,IPPROTO_TCP);","    // 语句说明：独占监听端口；按此Windows选项避免其他socket共享同一绑定。","    BOOL exclusive=TRUE;","    setsockopt(listener,SOL_SOCKET,SO_EXCLUSIVEADDRUSE,reinterpret_cast<const char*>(&exclusive),sizeof(exclusive));","    // 语句说明：address为IPv4监听地址；INADDR_ANY表示所有本机网卡，端口用htons转为网络序。","    sockaddr_in address;","    ZeroMemory(&address,sizeof(address));","    address.sin_family=AF_INET;","    address.sin_addr.s_addr=htonl(INADDR_ANY);","    address.sin_port=htons(static_cast<u_short>(port));","    // 语句说明：先bind绑定地址，再listen监听；任一步失败则清理资源并返回4。","    if(bind(listener,reinterpret_cast<sockaddr*>(&address),sizeof(address)) || listen(listener,8)) {","        closesocket(listener);","        WSACleanup();","        if(parentProcess) {","            CloseHandle(parentProcess);","        }","        return 4;","    }","    // 语句说明：eventName必须与房主创建的就绪事件名相同，使客户端知道何时可以connect。","    std::string eventName=\"Local\\\\GomokuReady-\"+token;","    // 语句说明：readyEvent是父进程创建的事件句柄；服务端申请将它置为有信号的权限。","    HANDLE readyEvent=OpenEventA(EVENT_MODIFY_STATE,FALSE,eventName.c_str());","    // 语句说明：只有bind/listen成功后才通知就绪；通知后关闭本进程持有的事件句柄。","    if(readyEvent) {","        SetEvent(readyEvent);","        CloseHandle(readyEvent);","    }","    // 语句说明：mode=1使listener非阻塞；accept暂时没人接入时直接返回，不冻结整个循环。","    u_long mode=1;","    ioctlsocket(listener,FIONBIO,&mode);","    // player=-1未握手，0/1为座位；reject表示等待错误包发出后关闭；accepted为接入毫秒。peers[8]容纳握手","    // 中的连接，并不代表8人游戏。","    // 【函数 Peer::Peer】初始化尚未握手的连接槽。","    // 处理步骤：player=-1，reject=false，accepted=0；内含 socket 自行构造。","    // 变量含义：它是定义在 main 函数内部的局部结构体，仅在该函数作用域可用。","    struct Peer {","        NetSocket socket;","        int player;","        bool reject;","        ULONGLONG accepted;","        Peer():player(-1),reject(false),accepted(0) {","        }","    } peers[8];","    NetState state;","    bool hadHost=false;","    ULONGLONG created=GetTickCount64(),closedAt=0,ping=0;","    // state权威房间；hadHost是否曾有房主；created/closedAt/ping均为毫秒时刻。","    int watchedExit=0,ackSlot=-1;","    bool seen[2]= {","        false,false","    };","    ULONGLONG ackAt=0;","    // watchedExit已处理离开流水；ackSlot待回ACK槽；seen双方回执；ackAt等待起点。","    bool run=true;","    // run 是整个服务端的运行开关","    while(run) {","        // 语句说明：parentProcess有效且父进程已退出时停止；句柄为空则没有这一退出检测。","        if(parentProcess && WaitForSingleObject(parentProcess,0)==WAIT_OBJECT_0) {","            break;","        }","        // 语句说明：服务启动后约15秒仍没有房主完成握手就退出，避免空房间进程长期残留。","        if(!hadHost && GetTickCount64()-created>15000) {","            break;","        }","        // 语句说明：incoming为本轮新接入socket；INVALID_SOCKET可能只是此刻没有新连接。","        SOCKET incoming=accept(listener,NULL,NULL);","        if(incoming!=INVALID_SOCKET) {","            // 语句说明：slot为第一个空闲连接槽下标，-1表示8个槽全占用；i用于扫描槽数组。","            int slot=-1;","            for(int i=0;i<8;++i) {","                if(peers[i].socket.fd==INVALID_SOCKET) {","                    slot=i;","                    break;","                }","            }","            if(slot<0) {","                closesocket(incoming);","            }      // 8 个位置都满了，只能把新连接直接关掉","            else {","                peers[slot].socket.attach(incoming);","                peers[slot].player=-1;","                peers[slot].reject=false;","                peers[slot].accepted=GetTickCount64();","            }","        }","        // 语句说明：changed记录本轮是否改变房间状态；为true时在循环末尾向已握手双方广播。","        bool changed=false;","        for(int i=0;i<8;++i) {","            Peer& p=peers[i];","            if(p.socket.fd==INVALID_SOCKET) {","                continue;","            }      // 这个位置是空的，跳过","            // 语句说明：messages收完整正文；alive是pump返回的连接可用性，不等于某条业务命令是否合法。","            std::vector<std::string> messages;","            bool alive=p.socket.pump(messages);","            // 语句说明：未完成HELLO的连接最多等待约5秒，避免长期占用连接槽。","            if(p.player<0 && GetTickCount64()-p.accepted>5000) {","                alive=false;","            }","            // 语句说明：j遍历这一连接收到的正文；已经reject后不再执行后续业务消息。","            for(size_t j=0;j<messages.size() && !p.reject;++j) {","                const std::string& msg=messages[j];","                // 简写一下，后面反复要用到这条消息","                if(msg.compare(0,5,\"PING \")==0 && msg.size()<40) {","                    p.socket.queue(\"PONG \"+msg.substr(5));","                    continue;","                }","                if(msg.compare(0,5,\"SEEN \")==0 && p.player>=0) {","                    std::istringstream response(msg.substr(5));","                    int serial=0;","                    std::string extra;","                    // 把流水号那部分单独取出来解析","                    // 语句说明：serial必须与当前exitSerial一致；extra检测多余字段，避免旧回执误确认新离开。","                    if((response>>serial) && !(response>>extra) && serial==state.exitSerial) {","                        seen[p.player]=true;","                    }","                    continue;","                    // 处理完毕，看下一条","                }","                if(msg==\"PING\") {","                    p.socket.queue(\"PONG\");","                    continue;","                }","                if(msg==\"PONG\") {","                    continue;","                }      // 心跳的回应本身不需要再处理","                // 【阅读提示】HELLO 2 HOST token或HELLO 2 GUEST；身份槽只有两个，握手中的TCP槽可以多于两个。","                if(p.player<0) {","                    // 语句说明：input为HELLO解析流；cmd指令、version协议版本、role身份、key口令、extra尾随字段。","                    std::istringstream input(msg);","                    std::string cmd,version,role,key,extra;","                    input>>cmd>>version>>role;","                    // 按空格把问候消息切开","                    // 语句说明：host表示请求HOST座位；只有房主格式才读取key口令。","                    bool host=role==\"HOST\";","                    if(host) {","                        input>>key;","                    }","                    std::string error;","                    // error 为空表示通过；非空就是要发给对方的错误原因","                    // 语句说明：检查协议版本2及HELLO格式；未知身份或尾随字段也归入VERSION错误。","                    if(cmd!=\"HELLO\" || version!=\"2\" || (role!=\"HOST\" && role!=\"GUEST\") || (input>>extra)) {","                        error=\"VERSION\";","                    }","                    // 语句说明：房主口令不匹配则AUTH；朋友端不提交房主口令。","                    else if(host && key!=token) {","                        error=\"AUTH\";","                    }","                    // 语句说明：不在等待室则拒绝新玩家，当前协议不支持对局中途重连。","                    else if(state.phase!=N_LOBBY) {","                        error=\"STARTED\";","                    }","                    // 语句说明：host对应0号座位，朋友对应1号；目标座位已有人则FULL。","                    else if(state.present[host?0:1]) {","                        error=\"FULL\";","                    }","                    // \\u8bed\\u53e5\\u8bf4\\u660e\\uff1a\\u670b\\u53cb\\u52a0\\u5165\\u524d\\u8981\\u6c42\\u623f\\u4e3b\\u5df2\\u7ecf\\u5b8c\\u6210\\u63e1\\u624b\\uff0c\\u907f\\u514d\\u623f\\u4e3b\\u672a\\u5230\\u65f6\\u5f62\\u6210\\u60ac\\u7a7a\\u623f\\u95f4\\u3002","                    else if(!host && !state.present[0]) {","                        error=\"WAIT_HOST\";","                    }","                    // 语句说明：拒绝时先把ERROR排入待发缓冲，reject使后续逻辑等待发完再关闭。","                    if(!error.empty()) {","                        p.socket.queue(\"ERROR \"+error);","                        p.reject=true;","                        continue;","                    }","                    // 语句说明：player从-1转为正式座位；present置true；hadHost只在房主握手成功时置true。","                    p.player=host?0:1;","                    state.present[p.player]=true;","                    if(host) {","                        hadHost=true;","                    }","                    // 语句说明：WELCOME告诉客户端本机座位；changed使本轮末尾再同步完整STATE。","                    p.socket.queue(host?\"WELCOME 0\":\"WELCOME 1\");","                    changed=true;","                } else if(msg==\"LEAVE\") {","                    alive=false;","                    break;","                }","                else {","                    std::string event;","                    // 事件字符串由 apply 填出来，用来做额外通知","                    if(state.apply(p.player,msg,event)) {","                        changed=true;","                        // 指令合法且状态已更新，需要广播","                        // 语句说明：k扫描连接槽，拒绝提示只发给state.owner对应的申请者。","                        if(event==\"REFUSED\" || event==\"UNDO_REFUSED\") {","                            for(int k=0;k<8;++k)","                            {","                                if(peers[k].player==state.owner && peers[k].socket.fd!=INVALID_SOCKET) {","                                    peers[k].socket.queue(\"EVENT \"+event);","                                }","                            }","                        }      // 只发给发起者本人，不必让另一方看到这条拒绝提示","                        if(event==\"UNDO_ACCEPTED\") {","                            for(int k=0;k<8;++k) {","                                if(peers[k].player>=0) {","                                    peers[k].socket.queue(\"EVENT UNDO_ACCEPTED\");","
