:"fn:record_store.h:recordDirectories","label":"recordDirectories","name":"recordDirectories","owner":"","file":"record_store.h","line":69,"end":84,"kind":"function","signature":"inline bool recordDirectories()","mode":"存档 / 复盘","desc":"【函数 recordDirectories】确保 data、unfinished、replays 三个目录存在。 处理步骤：创建失败但“已存在”可接受；再查询属性确认实际是目录。 变量含义：dirs 为三个路径；i 为索引；a 为属性位集合。"},{"id":"fn:record_store.h:numberLine","label":"numberLine","name":"numberLine","owner":"","file":"record_store.h","line":89,"end":97,"kind":"function","signature":"inline bool numberLine(std::istream& input,const char* key,int& value)","mode":"存档 / 复盘","desc":"处理步骤：getline 读整行；istringstream 拆字段；必须 k==key，并且不存在 extra。 变量含义：input 输入流；key 期望关键字；value 输出整数引用；line 原行；row 行解析流；k 读到 的键；extra 检测多余字段。"},{"id":"fn:record_store.h:parseRecord","label":"parseRecord","name":"parseRecord","owner":"","file":"record_store.h","line":107,"end":205,"kind":"function","signature":"inline bool parseRecord(const std::string& bytes,bool replay,GameRecord& output)","mode":"存档 / 复盘","desc":"是第 i 手与它的字段。 注意：v4 只允许 ONLINE 复盘；v1 不能是 HUMAN_AI。只接受非零结果的本地复盘；v3/v4 ONLINE 允许 result=0。不应误读成所有版本都允许任意模式。"},{"id":"fn:record_store.h:readRecord","label":"readRecord","name":"readRecord","owner":"","file":"record_store.h","line":210,"end":232,"kind":"function","signature":"inline bool readRecord(const std::wstring& path,bool replay,GameRecord& output)","mode":"存档 / 复盘","desc":"处理步骤：CreateFileW 打开；检查长度；一次读取且要求实读长度相等；关闭句柄；交 parseRecord。 变量含义：replay 为期望类型；f 文件句柄；size 为 LARGE_INTEGER；data 为字节缓冲；got 为实读 字节数；ok 汇总成功状态。"},{"id":"fn:record_store.h:encodeRecord","label":"encodeRecord","name":"encodeRecord","owner":"","file":"record_store.h","line":238,"end":260,"kind":"function","signature":"inline std::string encodeRecord(const GameRecord& r)","mode":"存档 / 复盘","desc":"写 MOVE；最后 END。 变量含义：out 为字符串输出流；i 为手序下标；m 是这一手的 const 引用。 注意：本地写 v2；联网写 v4。它只把数据转成可保存或发送的文本，真正写盘前还要由 writeRecord 调 parseRecord 自检。"},{"id":"fn:record_store.h:writeRecord","label":"writeRecord","name":"writeRecord","owner":"","file":"record_store.h","line":269,"end":320,"kind":"function","signature":"inline bool writeRecord(GameRecord& r,const std::wstring& overwrite=L\"\")","mode":"存档 / 复盘","desc":"状态。 注意：新记录不会因显示名相同覆盖旧文件；只有显式 overwrite 才替换指定路径。先临时写再替 换可避免直接把原档写到一半；仍可能因权限或 I/O 错误失败。"},{"id":"fn:replay_logic.h:ReplayPlayer::ReplayPlayer","label":"ReplayPlayer::ReplayPlayer","name":"ReplayPlayer","owner":"ReplayPlayer","file":"replay_logic.h","line":29,"end":30,"kind":"function","signature":"ReplayPlayer():cursor(0),started(false),playing(false),interval(3000),finalResult(0),deadline(0),remaining(3000)","mode":"复盘","desc":"【函数 ReplayPlayer::ReplayPlayer】初始化暂停的空播放器。 处理步骤：cursor=0，started/playing=false，interval/remaining=3000，finalResult/deadline=0； board 自动初始化。"},{"id":"fn:replay_logic.h:ReplayPlayer::open","label":"ReplayPlayer::open","name":"open","owner":"ReplayPlayer","file":"replay_logic.h","line":35,"end":47,"kind":"function","signature":"void open(const LocalGame& source)","mode":"复盘","desc":"处理步骤：复制结果和历史；复位游标/播放标志/速度；清空展示盘；若历史为空，立刻显示 finalResult。 变量含义：source 是只读棋局引用。 注意：零步认输也有终局结果，所以不能要求“至少落一子才显示结果”。"},{"id":"fn:replay_logic.h:ReplayPlayer::seek","label":"ReplayPlayer::seek","name":"seek","owner":"ReplayPlayer","file":"replay_logic.h","line":53,"end":65,"kind":"function","signature":"void seek(size_t position)","mode":"复盘","desc":"变量含义：position 是目标手数；i 为重放下标。 注意：重放最多 225 手，简单可靠；不会删除 source 的历史。seek 自己不改 playing/deadline， 上层只在暂停单步，tick 则会重新设 deadline。"},{"id":"fn:replay_logic.h:ReplayPlayer::pause","label":"ReplayPlayer::pause","name":"pause","owner":"ReplayPlayer","file":"replay_logic.h","line":69,"end":75,"kind":"function","signature":"void pause(ULONGLONG now)","mode":"复盘","desc":"【函数 ReplayPlayer::pause】暂停并保留还需等待的时间。 处理步骤：若正在播，remaining=max(deadline-now,0)；playing=false。 变量含义：now 为调用者传入的当前毫秒。"},{"id":"fn:replay_logic.h:ReplayPlayer::play","label":"ReplayPlayer::play","name":"play","owner":"ReplayPlayer","file":"replay_logic.h","line":79,"end":87,"kind":"function","signature":"void play(ULONGLONG now)","mode":"复盘","desc":"【函数 ReplayPlayer::play】从剩余倒计时开始/继续自动播放。 处理步骤：已到末尾就返回；否则 started/playing=true；deadline=now+remaining。 变量含义：now 为当前毫秒。"},{"id":"fn:replay_logic.h:ReplayPlayer::speed","label":"ReplayPlayer::speed","name":"speed","owner":"ReplayPlayer","file":"replay_logic.h","line":93,"end":103,"kind":"function","signature":"void speed(int milliseconds,ULONGLONG now)","mode":"复盘","desc":"恢复。 变量含义：active 保存原 playing；now 当前毫秒。 注意：调用者只传 3000 或 1500；函数本身没有检查零或负间隔。"},{"id":"fn:replay_logic.h:ReplayPlayer::tick","label":"ReplayPlayer::tick","name":"tick","owner":"ReplayPlayer","file":"replay_logic.h","line":109,"end":118,"kind":"function","signature":"void tick(ULONGLONG now)","mode":"复盘","desc":"到末尾停止。 变量含义：now 当前毫秒。 注意：每次 tick 最多一手；卡顿后不会 while 循环补播所有错过的手。"},{"id":"fn:ai_engine.h:higherPointScoreFirst","label":"higherPointScoreFirst","name":"higherPointScoreFirst","owner":"","file":"ai_engine.h","line":21,"end":23,"kind":"function","signature":"inline bool higherPointScoreFirst(const AIPoint& a, const AIPoint& b)","mode":"人机","desc":"inline bool higherPointScoreFirst(const AIPoint& a, const AIPoint& b)"},{"id":"fn:ai_engine.h:AIEntry::AIEntry","label":"AIEntry::AIEntry","name":"AIEntry","owner":"AIEntry","file":"ai_engine.h","line":34,"end":35,"kind":"function","signature":"AIEntry():key(0),score(0),depth(-1),flag(0),point(-1)","mode":"人机","desc":"【函数 AIEntry::AIEntry】初始化一个未使用的已计算局面的记录表槽。 处理步骤：key/score/flag=0，depth=-1，point=-1。 变量含义：depth=-1 使默认条目不能满足正常深度命中条件。"},{"id":"fn:ai_engine.h:AISearch::stopped","label":"AISearch::stopped","name":"stopped","owner":"AISearch","file":"ai_engine.h","line":65,"end":70,"kind":"function","signature":"bool stopped()","mode":"人机","desc":"检查取消标志和时间：用户取消或超过时间预算，就把 interrupted 设为 true。 cancel 指向取消标志；deadline 是截止时间。InterlockedCompareExchange 用来安全读取其他线程可能修改的标志。"},{"id":"fn:ai_engine.h:AISearch::random","label":"AISearch::random","name":"random","owner":"AISearch","file":"ai_engine.h","line":76,"end":82,"kind":"function","signature":"unsigned int random()","mode":"人机","desc":"按固定公式更新 randomState，得到一个随机数；简单难度用它从几个接近的好位置中选一个。"},{"id":"fn:ai_engine.h:AISearch::put","label":"AISearch::put","name":"put","owner":"AISearch","file":"ai_engine.h","line":88,"end":99,"kind":"function","signature":"void put(int r,int c,int stone)","mode":"人机","desc":"在 AI 自己的棋盘副本上试着放棋子；stone=0 表示撤掉。真实游戏棋盘不会改变。 同时更新 hash（棋盘识别码），方便困难难度查找算过的局面；不修改 turn、moves、result。"},{"id":"fn:ai_engine.h:AISearch::pointScore","label":"AISearch::pointScore","name":"pointScore","owner":"AISearch","file":"ai_engine.h","line":107,"end":173,"kind":"function","signature":"long long pointScore(int r,int c,int stone)","mode":"人机","desc":"假设在 (r,c) 放 stone 色棋子，检查横、竖、两条斜线，每条线看前后各5格。 X 表示同色棋子，. 表示空格，# 表示对方或边界。每条线取匹配到的最强棋形分，再把4条线相加。 五连1亿、活四100万、冲四10万、活三1万、眠三1000、活二100、普通二连10；这是经验分，不是胜率。"},{"id":"fn:ai_engine.h:AISearch::candidates","label":"AISearch::candidates","name":"candidates","owner":"AISearch","file":"ai_engine.h","line":181,"end":265,"kind":"function","signature":"std::vector<AIPoint> candidates(int stone,int preferred=-1)","mode":"人机","desc":"选出当前值得试下的位置：能直接赢的位置优先；否则优先堵住对方下一手能赢的位置。 普通位置必须在已有棋子周围2格以内，按 自己棋形分*10+对方棋形分*11 排序。 普通候选点简单/中等最多12个，困难最多16个；直接赢和必须堵的位置不受这个数量限制。空棋盘选中心(7,7)。 preferred 是以前计算推荐的位置编号，-1表示没有推荐；困难还用 history 调整试下顺序。"},{"id":"fn:ai_engine.h:AISearch::evaluate","label":"AISearch::evaluate","name":"evaluate","owner":"AISearch","file":"ai_engine.h","line":270,"end":283,"kind":"function","signature":"long long evaluate(int stone)","mode":"人机","desc":"搜索到最后一层时，遍历棋盘，计算 自己已有棋子的棋形分总和-对方的棋形分总和。 同一棋形可能被多颗棋子重复计分，所以它只是比较局面好坏的经验分。stone 是本次评分站在哪一方看。"},{"id":"fn:ai_engine.h:AISearch::search","label":"AISearch::search","name":"search","owner":"AISearch","file":"ai_engine.h","line":293,"end":372,"kind":"function","signature":"long long search(int stone,int depth,long long alpha,long long beta,int ply)","mode":"人机","desc":"在棋盘副本上轮流模拟双方下棋：试放一颗→判断五连→继续算对方的应对→撤掉这一颗。 depth 是还要模拟几层；一层代表落一颗。depth=0 时调用 evaluate 给局面打分。 对方的好局面对自己是坏局面，所以递归返回值前取负号；3-stone 在黑1和白2之间切换。 alpha 是本层已找到的较好分数；beta 是上层给的停止界限。alpha>=beta 时，这条路线不必再算。 ply 是从开始搜索起已经走了几层。获胜分 WIN-ply 让更快获胜的路线分数更高。困难会记录算过的局面，减少重复计算。"},{"id":"fn:ai_engine.h:AISearch::AISearch","label":"AISearch::AISearch","name":"AISearch","owner":"AISearch","file":"ai_engine.h","line":383,"end":403,"kind":"function","signature":"AISearch(const LocalGame& source,int difficulty,volatile LONG* stop,unsigned int seed=1234567):\n    board(source),level(difficulty),limit(difficulty==2?16:12),cancel(stop),\n    deadline(GetTickCount64()+(difficulty==2?2000:500)),interrupted(false),randomState(seed?seed:1),hash(0),completedDepth(0)","mode":"人机","desc":"建立一次AI思考任务：复制真实棋盘，并设置难度、候选数量和截止时间。 difficulty=0简单、1中等、2困难。普通候选上限12/12/16，时间预算500/500/2000毫秒。 history 先清零；给每个位置和颜色生成识别数字，用它们算出棋盘识别码。困难另准备65536条局面记录。"},{"id":"fn:ai_engine.h:AISearch::choose","label":"AISearch::choose","name":"choose","owner":"AISearch","file":"ai_engine.h","line":412,"end":502,"kind":"function","signature":"AIPoint choose()","mode":"人机","desc":"AI选位置的总入口：先准备备用空位，再调用 candidates 选出值得考虑的位置。 直接能赢或只剩一个候选位置时立即返回。简单难度从最多3个达到最高分90%的正分候选位置中随机选。 中等从1层算到最多4层，困难从1层算到最多8层；每层用 search 比较所有候选位置。 时间不足或被取消时，使用上一次完整算完的结果；completedDepth 记录完整算完的层数。"},{"id":"fn:ai_engine.h:AIWorker::AIWorker","label":"AIWorker::AIWorker","name":"AIWorker","owner":"AIWorker","file":"ai_engine.h","line":517,"end":518,"kind":"function","signature":"AIWorker():thread(NULL),cancelled(0),difficulty(0),generation(0)","mode":"人机","desc":"【函数 AIWorker::AIWorker】建立尚未启动的工作器。 处理步骤：thread=NULL，cancelled=0，difficulty/generation=0；snapshot 自动初始化。 变量含义：answer 未显式初始化，但只在成功创建的线程结束并写出结果后由 take 使用。"},{"id":"fn:ai_engine.h:AIWorker::run","label":"AIWorker::run","name":"run","owner":"AIWorker","file":"ai_engine.h","line":523,"end":531,"kind":"function","signature":"static DWORD        run(void* context)","mode":"人机","desc":"处理步骤：把 context 转为 self；用当时状态的副本、难度、取消地址、时钟种子建 AISearch search；choose 结果 写入 answer。 变量含义：context 是传入的 this；self 为 AIWorker*；search 为本次搜索对象。"},{"id":"fn:ai_engine.h:AIWorker::cancel","label":"AIWorker::cancel","name":"cancel","owner":"AIWorker","file":"ai_engine.h","line":534,"end":536,"kind":"function","signature":"void cancel()","mode":"人机","desc":"【函数 AIWorker::cancel】发出定期检查是否应该停止的取消请求。 处理步骤：InterlockedExchange 把 cancelled 设1；不强制杀线程，也不立即关闭句柄。"},{"id":"fn:ai_engine.h:AIWorker::start","label":"AIWorker::start","name":"start","owner":"AIWorker","file":"ai_engine.h","line":540,"end":552,"kind":"function","signature":"bool start(const LocalGame& game,int level,int gen)","mode":"人机","desc":"【函数 AIWorker::start】为 game 启动 level 难度、gen 版本的任务；返回创建是否成功。 处理步骤：已有 thread 就失败；复制 game；存参数；原子清取消标志；CreateThread(run,this)。 变量含义：game 是输入只读引用；level/gen 为任务参数。"},{"id":"fn:ai_engine.h:AIWorker::take","label":"AIWorker::take","name":"take","owner":"AIWorker","file":"ai_engine.h","line":558,"end":568,"kind":"function","signature":"bool take(AIPoint& point,int& gen)","mode":"人机","desc":"NULL。 变量含义：point/gen 是输出引用。 注意：线程已经完成也仍可能是被取消或旧棋局的结果；接受与否由 updateAI 的额外条件决定。"},{"id":"fn:ai_engine.h:AIWorker::shutdown","label":"AIWorker::shutdown","name":"shutdown","owner":"AIWorker","file":"ai_engine.h","line":572,"end":579,"kind":"function","signature":"void shutdown()","mode":"人机","desc":"【函数 AIWorker::shutdown】程序退出时彻底收尾。 处理步骤：cancel；若有线程则无限等待实际结束，再关句柄清NULL。 变量含义：等待期间不会继续该调用者的正常工作，适合退出清理。"},{"id":"fn:network_protocol.h:NetState::NetState","label":"NetState::NetState","name":"NetState","owner":"NetState","file":"network_protocol.h","line":40,"end":46,"kind":"function","signature":"NetState():round(0),phase(N_LOBBY),owner(0),kind(0),question(0),reason(END_UNKNOWN),\n    leaveReason(0),leaver(0),exitSerial(0),started(0)","mode":"联网","desc":"【函数 NetState::NetState】构造等待室状态。 处理步骤：round=0、phase=N_LOBBY；标量流水和原因复位；两方数组全false，saveStage=0；game 自动创 建空盘。"},{"id":"fn:network_protocol.h:NetState::start","label":"NetState::start","name":"start","owner":"NetState","file":"network_protocol.h","line":52,"end":66,"kind":"function","signature":"void start()","mode":"联网","desc":"变量含义：i 为双方座位数组下标。 注意：present 保留；question、exitSerial 也不归零，流水号继续递增。owner=0 只表示默认值， 不代表正在询问房主。"},{"id":"fn:network_protocol.h:NetState::finish","label":"NetState::finish","name":"finish","owner":"NetState","file":"network_protocol.h","line":71,"end":75,"kind":"function","signature":"void finish(int why)","mode":"联网","desc":"处理步骤：reason=why；phase=N_FINISH；双方 saveStage=1。 变量含义：why 为 END_FIVE、END_DRAW 或 END_RESIGN。 注意：它不计算胜者；连五由 place 设置 result，认输由 apply 设置 result。"},{"id":"fn:network_protocol.h:NetState::lastMove","label":"NetState::lastMove","name":"lastMove","owner":"NetState","file":"network_protocol.h","line":79,"end":86,"kind":"function","signature":"int lastMove(int player) const","mode":"联网","desc":"【函数 NetState::lastMove】寻找 player 座位最近一手下标，无则 -1。 处理步骤：从历史末尾找 stone==player+1。 变量含义：player 为0/1座位；i 为有符号历史下标。"},{"id":"fn:network_protocol.h:NetState::closeRoom","label":"NetState::closeRoom","name":"closeRoom","owner":"NetState","file":"network_protocol.h","line":93,"end":108,"kind":"function","signature":"void closeRoom(int p,int why)","mode":"联网","desc":"变量含义：p 为离开者0/1；why 为 LeaveReason。 注意：对已结束局或重开阶段保留原棋局 reason。该函数不总清 present，真正连接断开由 leave 清理。"},{"id":"fn:network_protocol.h:NetState::leave","label":"NetState::leave","name":"leave","owner":"NetState","file":"network_protocol.h","line":113,"end":122,"kind":"function","signature":"void leave(int p)","mode":"联网","desc":"处理步骤：若已不在房就返回；清 present/ready；尚未关闭的房间交 closeRoom(...,LEAVE_DROP)。 变量含义：p 为失联座位。 注意：房间已关闭时不重写离开原因，防止“拒绝再战”被随后断线覆盖。"},{"id":"fn:network_protocol.h:NetState::apply","label":"NetState::apply","name":"apply","owner":"NetState","file":"network_protocol.h","line":130,"end":263,"kind":"function","signature":"bool apply(int p,const std::string& message,std::string& event)","mode":"联网","desc":"是悔棋目标历史下标。 注意：N_SELF由申请者自己确认，N_PEER由另一方回答。MOVE没有棋色字段；根据座位和game.turn 判权限。"},{"id":"fn:network_protocol.h:netEncode","label":"netEncode","name":"netEncode","owner":"","file":"network_protocol.h","line":270,"end":286,"kind":"function","signature":"inline std::string netEncode(const NetState& s)","mode":"联网","desc":"度和离开信息。 变量含义：o 为输出流；i 为座位或手序索引。 注意：消息只传每手行列；颜色由黑白交替重放恢复。当时状态的副本不是把结构体内存 memcpy 到网络上。"},{"id":"fn:network_protocol.h:netDecode","label":"netDecode","name":"netDecode","owner":"","file":"network_protocol.h","line":294,"end":327,"kind":"function","signature":"inline bool netDecode(const std::string& message,NetState& result)","mode":"联网","desc":"果；i/r/c 是重放下标与行列。 注意：这里做了多项格式和规则校验，但不是对所有字段组合做完整根据当前阶段决定下一步的流程证明。不要把它描述为能 够识别一切恶意状态；权威性主要来自服务器执行 apply。"},{"id":"fn:network_transport.h:NetSocket::NetSocket","label":"NetSocket::NetSocket","name":"NetSocket","owner":"NetSocket","file":"network_transport.h","line":27,"end":28,"kind":"function","signature":"NetSocket():fd(INVALID_SOCKET),received(GetTickCount64()),sent(0),failed(false)","mode":"联网","desc":"fd套接字；input待拆接收字节、output待发送字节；received/sent最近收发毫秒；failed为缓冲错误。 【函数 NetSocket::NetSocket】构造尚未连接的流缓冲对象。 处理步骤：fd=INVALID_SOCKET；received=当前毫秒；sent=0；failed=false；字符串自动为空。"},{"id":"fn:network_transport.h:NetSocket::close","label":"NetSocket::close","name":"close","owner":"NetSocket","file":"network_transport.h","line":32,"end":39,"kind":"function","signature":"void close()","mode":"联网","desc":"【函数 NetSocket::close】关闭套接字并清空收发字节。 处理步骤：若 fd 有效调用 closesocket；设无效；清 input/output。 变量含义：它不自动重置 failed/received，下一次 attach 会重置必要状态。"},{"id":"fn:network_transport.h:NetSocket::attach","label":"NetSocket::attach","name":"attach","owner":"NetSocket","file":"network_transport.h","line":44,"end":51,"kind":"function","signature":"void attach(SOCKET s)","mode":"联网","desc":"处理步骤：先关闭旧连接；清 failed；保存 s；ioctlsocket(FIONBIO)；重设 received。 变量含义：s 是接管的句柄；mode=1 代表非阻塞。 注意：后续由此对象负责 close。当前代码没有检查 ioctlsocket 的返回值。"},{"id":"fn:network_transport.h:NetSocket::queue","label":"NetSocket::queue","name":"queue","owner":"NetSocket","file":"network_transport.h","line":57,"end":69,"kind":"function","signature":"bool queue(const std::string& message)","mode":"联网","desc":"变量含义：n 为网络序正文长度。 注意：queue 只入缓冲，不表示已经送达。Windows 中 unsigned long 为4字节，这段实现依赖当前 平台。"},{"id":"fn:network_transport.h:NetSocket::pump","label":"NetSocket::pump","name":"pump","owner":"NetSocket","file":"network_transport.h","line":78,"end":133,"kind":"function","signature":"bool pump(std::vector<std::string>& messages)","mode":"联网","desc":"iteration 限制本轮读取次数；length 为从包头取出的正文长度。 注意：send 可能只发一部分。recv 返回0是有序关闭；<0才检查错误码。messages 超256也失败； 这些界限防止缓冲无限增长。"},{"id":"fn:network_transport.h:NetClient::push","label":"NetClient::push","name":"push","owner":"NetClient","file":"network_transport.h","line":150,"end":159,"kind":"function","signature":"void push(const std::string& s)","mode":"联网","desc":"【函数 NetClient::push】网络线程把字符串 s 放入 incoming。 处理步骤：进锁；未满256则追加；否则置 stopFlag；离锁。 变量含义：s 是交给UI的完整消息或内部通知。"},{"id":"fn:network_transport.h:NetClient::entry","label":"NetClient::entry","name":"entry","owner":"NetClient","file":"network_transport.h","line":163,"end":166,"kind":"function","signature":"static DWORD        entry(LPVOID p)","mode":"联网","desc":"【函数 NetClient::entry】Win32线程静态入口。 处理步骤：将 LPVOID p 转回 NetClient*，调用成员 run，再返回0。 变量含义：p 是 CreateThread 传来的 this。"},{"id":"fn:network_transport.h:NetClient::run","label":"NetClient::run","name":"run","owner":"NetClient","file":"network_transport.h","line":177,"end":290,"kind":"function","signature":"void run()","mode":"联网","desc":"索引；stamp/value 为PONG时间解析流与值；latency 为内部LATENCY通知流。 注意：ping 时间由本机生成并由服务器原样回传，因此测的是往返时间，不需要两台机器时钟一致。 线程每轮 Sleep(10)，没有进行图形绘制。"},{"id":"fn:network_transport.h:NetClient::NetClient","label":"NetClient::NetClient","name":"NetClient","owner":"NetClient","file":"network_transport.h","line":294,"end":296,"kind":"function","signature":"NetClient():thread(NULL),stopFlag(0),port(0)","mode":"联网","desc":"【函数 NetClient::NetClient】构造客户端通信对象。 处理步骤：thread=NULL，stopFlag=0，port=0；InitializeCriticalSection 建锁。"},{"id":"fn:network_transport.h:NetClient::~NetClient","label":"NetClient::~NetClient","name":"~NetClient","owner":"NetClient","file":"network_transport.h","line":300,"end":303,"kind":"function","signature":"~NetClient()","mode":"联网","desc":"【函数 NetClient::~NetClient】对象销毁时释放线程和锁。 处理步骤：先 stop 等线程退出，再 DeleteCriticalSection。 变量含义：析构函数名以 ~ 开头，随对象生命周期自动调用。"},{"id":"fn:network_transport.h:NetClient::stop","label":"NetClient::stop","name":"stop","owner":"NetClient","file":"network_transport.h","line":306,"end":319,"kind":"function","signature":"void stop()","mode":"联网","desc":"【函数 NetClient::stop】停止并回收后台线程，再清队列。 处理步骤：原子置 stopFlag；有线程则等待结束、关句柄、清NULL；在锁保护下清 incoming/outgoing。"},{"id":"fn:network_transport.h:NetClient::start","label":"NetClient::start","name":"start","owner":"NetClient","file":"network_transport.h","line":324,"end":333,"kind":"function","signature":"bool start(const std::string& ip,int p,const std::string& greeting)","mode":"联网","desc":"处理步骤：先 stop 旧任务；保存地址、端口、握手；清停止标志；CreateThread(entry,this)。 变量含义：ip 为点分十进制IPv4；p 是端口，不是座位；greeting 为HELLO正文。 注意：true 只表示线程建成，不表示已连接成功；连接成功需UI收到 WELCOME。"},{"id":"fn:network_transport.h:NetClient::sendMessage","label":"NetClient::sendMessage","name":"sendMessage","owner":"NetClient","file":"network_transport.h","line":338,"end":344,"kind":"function","signature":"void sendMessage(const std::string& message)","mode":"联网","desc":"处理步骤：在临界区内，outgoing 未满256就追加。 变量含义：当前实现队列满时静默丢弃，没有返回失败；不要理解成每次调用都确保消息入队。 语句说明：出站队列最多256条；当前实现满时不追加，且没有返回值报告丢弃。"},{"id":"fn:network_transport.h:NetClient::take","label":"NetClient::take","name":"take","owner":"NetClient","file":"network_transport.h","line":349,"end":359,"kind":"function","signature":"bool take(std::string& message)","mode":"联网","desc":"处理步骤：进锁检查 found；有消息取front并pop_front；离锁，返回 found。 变量含义：found 为队列非空判断。 注意：此处“不阻塞等待消息”不等于完全不等待：争用临界区时仍可能短暂等待锁。"},{"id":"fn:online_ui.h:onlineForms","label":"onlineForms","name":"onlineForms","owner":"","file":"online_ui.h","line":58,"end":66,"kind":"function","signature":"void onlineForms(bool visible)","mode":"联网","desc":"【函数 onlineForms】按 visible 控制联网表单输入框。 处理步骤：IP仅在 netStage=2 时显示；端口在 visible 时显示；焦点放到适合的框。 变量含义：visible 为显示开关。"},{"id":"fn:online_ui.h:onlineStop","label":"onlineStop","name":"onlineStop","owner":"","file":"online_ui.h","line":70,"end":89,"kind":"function","signature":"void onlineStop()","mode":"联网","desc":"【函数 onlineStop】停止连接并回收本机启动的服务进程。 处理步骤：停 netClient；清连接与待确认；服务进程等50毫秒未退就终止；关进程/事件句柄；隐藏表单。 变量含义：不负责完整重置所有联网字段，完整重置由 onlineEnter 处理。"},{"id":"fn:online_ui.h:onlineHome","label":"onlineHome","name":"onlineHome","owner":"","file":"online_ui.h","line":93,"end":104,"kind":"function","signature":"void onlineHome()","mode":"联网","desc":"【函数 onlineHome】完成联网清理后回主菜单。 处理步骤：onlineStop、hideName；复位保存阶段/开局标志/游戏模式；mainMenu；若 closeAfterOnline 则 停止程序。"},{"id":"fn:online_ui.h:onlineEnter","label":"onlineEnter","name":"onlineEnter","owner":"","file":"online_ui.h","line":108,"end":132,"kind":"function","signature":"void onlineEnter()","mode":"联网","desc":"【函数 onlineEnter】从零进入联网菜单。 处理步骤：停止旧连接、取消AI、隐藏命名；重新构造 NetState；重置身份、连接页面、保存流程、离开标 志、提示与延迟；page=NETWORK_PAGE。"},{"id":"fn:online_ui.h:localAddresses","label":"localAddresses","name":"localAddresses","owner":"","file":"online_ui.h","line":140,"end":191,"kind":"function","signature":"std::wstring localAddresses()","mode":"联网","desc":"候选文本；a 是网卡节点；u 是地址节点；b 为IPv4四字节指针；value 为格式化地址缓冲。 注意：这里按地址段按棋形和经验打分的标记“Tailscale”，没有验证网卡确实属于Tailscale。界面也提示人工核 对；识别成功不等于网络已经连通。"},{"id":"fn:online_ui.h:onlineCanMove","label":"onlineCanMove","name":"onlineCanMove","owner":"","file":"online_ui.h","line":194,"end":198,"kind":"function","signature":"bool onlineCanMove()","mode":"联网","desc":"【函数 onlineCanMove】联网规则下是否允许本机点棋盘。 处理步骤：要求已连接、未丢失、未离开、无待确认、非保存阶段、N_PLAY、座位有效，且 turn==netRole+1。"},{"id":"fn:online_ui.h:onlineSend","label":"onlineSend","name":"onlineSend","owner":"","file":"online_ui.h","line":203,"end":209,"kind":"function","signature":"void onlineSend(const std::string& cmd)","mode":"联网","desc":"处理步骤：若仍连接且未lost，sendMessage；设netPending；记录netPendingAt。 变量含义：cmd 为完整正文。 注意：netPending 只是UI防连点标志，不是TCP送达证明。"},{"id":"fn:online_ui.h:onlineCommand","label":"onlineCommand","name":"onlineCommand","owner":"","file":"online_ui.h","line":213,"end":218,"kind":"function","signature":"std::string onlineCommand(const char* cmd)","mode":"联网","desc":"【函数 onlineCommand】生成“cmd 当前局号”前缀字符串。 处理步骤：ostringstream out 写命令与 netState.round，再返回str。 变量含义：cmd 为命令名；out 为输出流。"},{"id":"fn:online_ui.h:onlineMove","label":"onlineMove","name":"onlineMove","owner":"","file":"online_ui.h","line":223,"end":232,"kind":"function","signature":"void onlineMove(int cell)","mode":"联网","desc":"处理步骤：检查可下与空格；设netMovePending；拼命令、已有手数、cell/15、cell%15；onlineSend。 变量含义：out 为命令流；cell 来自 boardCell 的合法结果。 注意：函数本身不检查cell越界，依赖调用者。不会在这里 game.place。"},{"id":"fn:online_ui.h:onlineAsk","label":"onlineAsk","name":"onlineAsk","owner":"","file":"online_ui.h","line":236,"end":244,"kind":"function","signature":"void onlineAsk(int kind)","mode":"联网","desc":"【函数 onlineAsk】提出 kind 类型的操作询问。 处理步骤：要求已连接、无待确认、N_PLAY；拼ASK、局号、手数、kind；发送。 变量含义：kind=1重开、2退出、3悔棋、4认输；out 为消息流。"},{"id":"fn:online_ui.h:onlineAnswer","label":"onlineAnswer","name":"onlineAnswer","owner":"","file":"online_ui.h","line":248,"end":253,"kind":"function","signature":"void onlineAnswer(bool yes)","mode":"联网","desc":"【函数 onlineAnswer】针对当前 question 答复 yes。 处理步骤：拼ANSWER、局号、问答编号、0/1；onlineSend。 变量含义：yes 为是否同意；out 为消息流。"},{"id":"fn:online_ui.h:onlineSaveStatus","label":"onlineSaveStatus","name":"onlineSaveStatus","owner":"","file":"online_ui.h","line":258,"end":264,"kind":"function","signature":"void onlineSaveStatus(int stage)","mode":"联网","desc":"处理步骤：若连接未lost，直接 sendMessage 发送SAVE，不设置netPending。 变量含义：stage=1/2/3；o 为输出流。 注意：这是状态通知；为了不锁死本地命名流程，没有走 onlineSend。"},{"id":"fn:online_ui.h:onlineDeparture","label":"onlineDeparture","name":"onlineDeparture","owner":"","file":"online_ui.h","line":268,"end":280,"kind":"function","signature":"void onlineDeparture(int why)","mode":"联网","desc":"【函数 onlineDeparture】提交离开原因 why，并开始等待退出确认。 处理步骤：已netLeaving就返回；置标志；设6秒deadline并取消自动返回；发送CLOSE。 变量含义：why 为LeaveReason；o 为命令流。"},{"id":"fn:online_ui.h:onlineRequestHome","label":"onlineRequestHome","name":"onlineRequestHome","owner":"","file":"online_ui.h","line":285,"end":303,"kind":"function","signature":"void onlineRequestHome()","mode":"联网","desc":"处理步骤：已离开则不重复；丢失/已关房直接onlineHome；未开局走等待室离开；终局按是否已提交再战选 取消或拒绝；重开等待选取消。 变量含义：它不处理正在正常下棋时直接退出；那条路径先 onlineAsk(2)。"},{"id":"fn:online_ui.h:onlineArchiveDone","label":"onlineArchiveDone","name":"onlineArchiveDone","owner":"","file":"online_ui.h","line":308,"end":340,"kind":"function","signature":"void onlineArchiveDone()","mode":"联网","desc":"处理步骤：隐藏命名；报告SAVE 3；若连接结束，进入阶段5并等ACK或2秒返回；重开则阶段4并发送DONE；普 通终局则阶段3让用户选再战；需关程序则继续请求退出。 变量含义：没有另建棋谱；它只推进保存后的交互。"},{"id":"fn:online_ui.h:onlineSave","label":"onlineSave","name":"onlineSave","owner":"","file":"online_ui.h","line":347,"end":399,"kind":"function","signature":"bool onlineSave(const std::wstring& raw)","mode":"联网","desc":"变量含义：first/last 为首尾位置；name 清理后的名称；names 已有名数组；info/find 为文件枚举； r 为读回记录；base 为原名；i 为重名序号；suffix 为编号缓冲；record 为待写记录。 注意：联网未完也 replay=true；只保存已收到确认的 game，不记录尚未获确认的落子请求。"},{"id":"fn:online_ui.h:onlineName","label":"onlineName","name":"onlineName","owner":"","file":"online_ui.h","line":403,"end":414,"kind":"function","signature":"void onlineName()","mode":"联网","desc":"【函数 onlineName】打开联网命名框并生成默认名字。 处理步骤：archiveStage=2；报告SAVE 2；取本地时间组成“联网年月日_时分秒”；显示并聚焦nameEdit。 变量含义：t 为SYSTEMTIME；value 为名称缓冲。"},{"id":"fn:online_ui.h:onlineConnect","label":"onlineConnect","name":"onlineConnect","owner":"","file":"online_ui.h","line":423,"end":513,"kind":"function","signature":"void onlineConnect()","mode":"联网","desc":"exe路径；line 为宽输出流；args 为可修改命令行；si 为启动信息；pi 为进程/线程句柄结果。 注意：CreateProcess 参数包含端口、口令和父PID。这里没有立即连接：updateOnline 等 serverReady亮起，避免服务端还没listen就连接失败。"},{"id":"fn:online_ui.h:onlineLobbyLeave","label":"onlineLobbyLeave","name":"onlineLobbyLeave","owner":"","file":"online_ui.h","line":517,"end":522,"kind":"function","signature":"void onlineLobbyLeave()","mode":"联网","desc":"【函数 onlineLobbyLeave】打开等待室离开询问。 处理步骤：lobbyExit=true；若本机已准备，先发送READY 0取消准备。 变量含义：此时还没真正CLOSE；用户随后可选择否。"},{"id":"fn:online_ui.h:onlineAction","label":"onlineAction","name":"onlineAction","owner":"","file":"online_ui.h","line":529,"end":682,"kind":"function","signature":"void onlineAction(int id)","mode":"联网","desc":"变量含义：id 动作；value 在不同分支分别是INI/命名缓冲或复制输出流；content 为复制正文；ok 成功标志；memory 为可移动全局内存；pointer 为GlobalLock后地址。 注意：A_NET_AGAIN为同意再战；剪贴板内存仅在交付失败时自行释放，交付成功后由系统管理。"},{"id":"fn:online_ui.h:onlineLeaveText","label":"onlineLeaveText","name":"onlineLeaveText","owner":"","file":"online_ui.h","line":687,"end":706,"kind":"function","signature":"std::wstring onlineLeaveText(int why,bool mine)","mode":"联网","desc":"处理步骤：自己主动离开统一显示已通知；其他情况switch映射朋友离开、房主关房、退出、拒绝、取消、断 线。 变量含义：why 为LeaveReason；mine 表示离开者是否本机。"},{"id":"fn:online_ui.h:onlineDisconnected","label":"onlineDisconnected","name":"onlineDisconnected","owner":"","file":"online_ui.h","line":711,"end":753,"kind":"function","signature":"void onlineDisconnected()","mode":"联网","desc":"处理步骤：清连接及待确认；本来正在离开就回首页；尚未开局则退表单重试；已开局保留明确结束原因，否 则补断线；未处理保存就询问，已处理则安排返回。 变量含义：不是重连功能：本局断线后只能保存复盘，不能继续原联网对局。"},{"id":"fn:online_ui.h:applyOnlineStateMessage","label":"applyOnlineStateMessage","name":"applyOnlineStateMessage","owner":"","file":"online_ui.h","line":763,"end":842,"kind":"function","signature":"bool applyOnlineStateMessage(const std::string& message)","mode":"联网","desc":"校验 STATE、更新棋盘、处理离开和一次性保存询问。"},{"id":"fn:online_ui.h:updateOnline","label":"updateOnline","name":"updateOnline","owner":"","file":"online_ui.h","line":844,"end":978,"kind":"function","signature":"void updateOnline()","mode":"联网","desc":"检查超时、读网络消息；STATE 交给状态同步函数。"},{"id":"fn:online_ui.h:opponentProgress","label":"opponentProgress","name":"opponentProgress","owner":"","file":"online_ui.h","line":982,"end":1003,"kind":"function","signature":"std::wstring opponentProgress()","mode":"联网","desc":"【函数 opponentProgress】给出对方保存/再战的进度文字。 处理步骤：身份无效或lost返回空；按again、done、saveStage顺序选提示。 变量含义：other=1-netRole 是对方座位。"},{"id":"fn:online_ui.h:drawOnlineMenu","label":"drawOnlineMenu","name":"drawOnlineMenu","owner":"","file":"online_ui.h","line":1010,"end":1017,"kind":"function","signature":"void drawOnlineMenu()","mode":"联网","desc":"变量含义：value 为端口说明缓冲；i 为两方索引。 注意：绘图之外还登记按钮，实际执行仍在onlineAction。输入框本体由Win32控件绘制。 联网菜单：创建房间、加入房间、返回。"},{"id":"fn:online_ui.h:drawOnlineConnectionForm","label":"drawOnlineConnectionForm","name":"drawOnlineConnectionForm","owner":"","file":"online_ui.h","line":1019,"end":1036,"kind":"function","signature":"void drawOnlineConnectionForm()","mode":"联网","desc":"连接表单：创建房间填写端口；加入房间填写地址和端口。"},{"id":"fn:online_ui.h:drawOnlineConnecting","label":"drawOnlineConnecting","name":"drawOnlineConnecting","owner":"","file":"online_ui.h","line":1038,"end":1043,"kind":"function","signature":"void drawOnlineConnecting()","mode":"联网","desc":"连接过程：显示等待及取消连接。"},{"id":"fn:online_ui.h:drawOnlineEndNotice","label":"drawOnlineEndNotice","name":"drawOnlineEndNotice","owner":"","file":"online_ui.h","line":1045,"end":1048,"kind":"function","signature":"void drawOnlineEndNotice()","mode":"联网","desc":"连接结束：显示离开/断线原因，等待自动返回。"},{"id":"fn:online_ui.h:drawOnlineLobby","label":"drawOnlineLobby","name":"drawOnlineLobby","owner":"","file":"online_ui.h","line":1050,"end":1080,"kind":"function","signature":"void drawOnlineLobby()","mode":"联网","desc":"等待室：显示双方准备情况、执棋颜色和离开确认。"},{"id":"fn:online_ui.h:drawOnlinePage","label":"drawOnlinePage","name":"drawOnlinePage","owner":"","file":"online_ui.h","line":1082,"end":1099,"kind":"function","signature":"void drawOnlinePage()","mode":"联网","desc":"房间页面入口：共同底板后，按 netStage 选择唯一一个页面内容。"},{"id":"fn:online_ui.h:drawOnlineStatus","label":"drawOnlineStatus","name":"drawOnlineStatus","owner":"","file":"online_ui.h","line":1108,"end":1128,"kind":"function","signature":"void drawOnlineStatus()","mode":"联网","desc":"注意：不是每个玩家在N_SELF都能回答；只有owner能回答。N_PEER则只有另一方能回答，界面启用 条件与apply权限一致。 仅联网：显示连接、胜负/回合、身份、步数和延迟。"},{"id":"fn:online_ui.h:drawOnlineArchivePanel","label":"drawOnlineArchivePanel","name":"drawOnlineArchivePanel","owner":"","file":"online_ui.h","line":1130,"end":1163,"kind":"function","signature":"void drawOnlineArchivePanel()","mode":"联网","desc":"仅联网结束保存流程：是否保存 -> 命名 -> 再来一局/等待/返回。"},{"id":"fn:online_ui.h:drawOnlinePlayPanel","label":"drawOnlinePlayPanel","name":"drawOnlinePlayPanel","owner":"","file":"online_ui.h","line":1165,"end":1212,"kind":"function","signature":"void drawOnlinePlayPanel()","mode":"联网","desc":"仅联网对局：登记请求按钮、等待提示和双方确认。"},{"id":"fn:online_ui.h:drawOnlineSidebar","label":"drawOnlineSidebar","name":"drawOnlineSidebar","owner":"","file":"online_ui.h","line":1214,"end":1223,"kind":"function","signature":"void drawOnlineSidebar()","mode":"联网","desc":"联网侧栏入口：公共状态后，明确选择离开中、保存中、对局中。"},{"id":"fn:server_main.cpp:main","label":"main","name":"main","owner":"","file":"server_main.cpp","line":19,"end":319,"kind":"function","signature":"int main(int argc,char** argv)","mode":"联网服务器","desc":"启动、主循环、清理；每轮处理输入和业务更新再绘图。"},{"id":"type:Button","label":"Button","kind":"type","file":"ui_common.h","line":44,"end":48,"desc":"结构体"},{"id":"type:SavedEntry","label":"SavedEntry","kind":"type","file":"ui_common.h","line":49,"end":54,"desc":"结构体"},{"id":"type:Move","label":"Move","kind":"type","file":"game_logic.h","line":13,"end":15,"desc":"结构体"},{"id":"type:LocalGame","label":"LocalGame","kind":"type","file":"game_logic.h","line":18,"end":141,"desc":"结构体"},{"id":"type:GameRecord","label":"GameRecord","kind":"type","file":"record_store.h","line":16,"end":36,"desc":"结构体"},{"id":"type:ReplayPlayer","label":"ReplayPlayer","kind":"type","file":"replay_logic.h","line":13,"end":119,"desc":"结构体"},{"id":"type:AIPoint","label":"AIPoint","kind":"type","file":"ai_engine.h","line":17,"end":20,"desc":"结构体"},{"id":"type:AIEntry","label":"AIEntry","kind":"type","file":"ai_engine.h","line":26,"end":36,"desc":"结构体"},{"id":"type:AISearch","label":"AISearch","kind":"type","file":"ai_engine.h","line":39,"end":503,"desc":"建立一次AI思考任务：复制真 ","target":"type:NetState","kind":"typeuse","file":"server_main.cpp","line":83,"evidence":"NetState","confidence":"EXTRACTED"}],"sources":{"main.cpp":["// 【本文件阅读路线】程序入口：初始化 -> 循环处理输入/联网/AI/复盘并绘图 -> 清理资源。函数内的分支条件决定何时执行。","// Gomoku2 初学者入口：每一轮按固定顺序处理输入、业务更新和绘图。","// 先读本文件，再沿函数名进入 game_input.h / game_actions.h / game_logic.h。","#include \"game_input.h\"","int main() {","    bool loaded = initializeProgram();","    ULONGLONG started = GetTickCount64();","    if (loaded && is_run()) {","        render(started);","    }","    while (loaded && running && is_run()) {","        processWindowMessages();","        updateOnline();","        handleWindowCloseRequest();","        if (running && is_run()) {","            render(started);","        }","        processMouseMessages(started);","        while (kbhit()) {","            getkey();","        }","        if (!running || !is_run()) {","            break;","        }","        updateAI();","        if (page == REPLAY_PAGE && dialog == NO_DIALOG) {","            replayPlayer.tick(GetTickCount64());","        }","        render(started);","        delay_fps(60);","    }","    releaseProgramResources();","    if (!loaded && windowCreated) {","        MessageBoxW(NULL,L\"\\u7d20\\u6750\\u6216\\u8f93\\u5165\\u6846\\u52a0\\u8f7d\\u5931\\u8d25\\uff0c\\u8bf7\\u68c0\\u67e5assets\\u76ee\\u5f55\\u3002\",L\"\\u542f\\u52a8\\u5931\\u8d25\",MB_OK|MB_ICONERROR);","    }","    if (loaded) {","        return 0;","    }","    return 1;","}"],"ui_common.h":["// 【本文件阅读路线】所有页面共用：状态变量和 Button；addButton 登记 -> drawButtons 绘制 -> hitButton 判断点击。","// 客户端共享区：页面枚举、棋局对象、按钮数据和基础绘图函数。","// 本文件只保存大家共同使用的状态；业务动作在 game_actions.h。","#ifndef GOMOKU_UI_COMMON_H","#define GOMOKU_UI_COMMON_H","#define NOMINMAX","#define _WIN32_WINNT 0x0601","#define WINVER 0x0601","#include \"network_transport.h\"","#include <windows.h>","#include <graphics.h>","#include <cstdio>","#include <cwchar>","#include <string>","#include <vector>","#include <sstream>","#include <algorithm>","#include \"game_logic.h\"","#include \"record_store.h\"","#include \"replay_logic.h\"","#include \"ai_engine.h\"","const int BOARD_X = 100, BOARD_Y = 200, FIRST_X = 178, FIRST_Y = 278, SPACING = 66;","// BOARD_X/Y图片左上角；FIRST_X/Y第一个交点；SPACING相邻交点像素距，勿混用。","const wchar_t* MAIN_LABELS[] = {","    L\"\\u5f00\\u59cb\\u6e38\\u620f\", L\"\\u7ee7\\u7eed\\u6e38\\u620f\", L\"\\u590d\\u76d8\", L\"\\u9000\\u51fa\"","};","// 开始游戏；继续游戏；复盘；退出","const wchar_t* MODE_LABELS[] = {","    L\"\\u5355\\u673a\\u5bf9\\u5f08\", L\"\\u4eba\\u673a\\u5bf9\\u5f08\", L\"\\u8054\\u7f51\\u5bf9\\u5f08\", L\"\\u7b97\\u4e86\\u4e0d\\u73a9\\u4e86\"","};","// 单机对弈；人机对弈；联网对弈；算了不玩了","enum Page {","    MAIN_MENU, MODE_MENU, GAME_PAGE, SAVE_LIST, REPLAY_LIST, REPLAY_PAGE, DIFFICULTY_PAGE, NETWORK_PAGE","};","enum Dialog {","    NO_DIALOG, EXIT_SAVE, RESTART_CONFIRM, FINISHED_SAVE, NAME_SAVE, AGAIN, DELETE_CONFIRM, REPLAY_EXIT, CHOOSE_COLOR","};","enum Action {","    A_START=1, A_CONTINUE, A_REPLAY, A_QUIT, A_LOCAL, A_BACK,","    A_UNDO, A_EXIT_GAME, A_RESTART, A_YES, A_NO, A_SAVE, A_CANCEL, A_AI, A_EASY, A_MEDIUM, A_HARD,","    A_BLACK, A_WHITE, A_PLAY, A_SPEED1, A_SPEED2, A_PAUSE, A_RESUME,","    A_PREVIOUS, A_NEXT, A_REPLAY_EXIT","};","struct Button {","    int id, x, y, w, h;","    std::wstring text;","    bool enabled, menu;","};","struct SavedEntry {","    std::wstring name,path;","    std::string mode;","    bool valid;","    int result;","};","Page page = MAIN_MENU;","// 当前页面，决定render绘制哪一类界面。","Dialog dialog = NO_DIALOG;","LocalGame game;","// 本地/人机真实棋盘；联网模式下从收到的NetState.game复制更新。","ReplayPlayer replayPlayer;","// 复盘播放器对象，内部有独立的展示棋盘与完整历史。","GameRecord replayRecord;","// 当前复盘的完整记录元数据，供时间、结束原因和本机颜色等展示使用。","AIWorker aiWorker;","// 后台AI工作器；只在主线程采用结果时才改变全局game。","std::string gameMode=\"LOCAL_TWO\";","// 当前模式：LOCAL_TWO同机双人，HUMAN_AI人机，ONLINE联网。","int difficulty=0, humanStone=1, generation=0, deleteIndex=-1;","// difficulty=0/1/2；humanStone=1/2；generation是AI有效任务版本；deleteIndex待删列表下标。","std::wstring currentName, loadedPath, replayName;","bool onlineCanMove();","std::vector<Button> buttons;","// 当前页面的按钮，每帧重建","std::vector<SavedEntry> entries;","// 存档/复盘列表的内容","PIMAGE frames[90] = {","}, background = NULL, boardImage = NULL;","// frames为90帧菜单动画；background为背景；boardImage为棋盘图。","PIMAGE blackImage = NULL, whiteImage = NULL, buttonImage = NULL;","HWND nameEdit = NULL;","HFONT editFont = NULL;","bool running = true, savingFinished = false;","// running 主循环开关；savingFinished 记住这局是否已结束","int pressed = 0, pressedCell = -1, listOffset = 0;","// 当前按下的按钮编号、按下的交点、列表滚动位置","std::wstring notice;","// 当前短提示文本；到期时刻单独存于noticeUntil。","ULONGLONG noticeUntil = 0;","// cancelAI：共享辅助函数。","void cancelAI() {","    ++generation;","    aiWorker.cancel();","}","// toast：共享辅助函数。","void toast(const std::wstring& text) {","    notice = text;","    noticeUntil = GetTickCount64() + 2000;","}","// font：共享辅助函数。","void font(int size) {","    LOGFONTW f;","    ZeroMemory(&f, sizeof(f));","    f.lfHeight = -size;","    f.lfQuality = ANTIALIASED_QUALITY;","    std::wcscpy(f.lfFaceName, L\"\\u6977\\u4f53\");","    setfont(&f);","    setbkmode(TRANSPARENT);","    // 楷体；老式的字符串拷贝写法，把「楷体」写进字体名","}","// text：共享辅助函数。","void text(int x, int y, const std::wstring& value, int size=32) {","    // 默认用 32 号字，颜色是深棕色","    font(size);","    setcolor(EGERGB(58,46,31));","    outtextxy(x,y,value.c_str());","    // outtextxy 把文字画在指定位置","}","// addButton：共享辅助函数。","void addButton(int id, int x, int y, int w, int h, const std::wstring& label,","bool enabled=true, bool menu=false) {","    Button b = {","        id,x,y,w,h,label,enabled,menu","    };","    buttons.push_back(b);","    // 用大括号一次性构造一个 Button 并追加到列表","}","// contains：共享辅助函数。","bool contains(const Button& b, int x, int y) {","    if (x < b.x || x >= b.x + b.w) {","        return false;","    }","    if (y < b.y || y >= b.y + b.h) {","        return false;","    }","    int radius = 21;","    int localX = x - b.x;","    int localY = y - b.y;","    int nearestX = localX;","    int nearestY = localY;","    if (nearestX > b.w - radius) {","        nearestX = b.w - radius;","    }","    if (nearestX < radius) {","        nearestX = radius;","    }","    if (nearestY > b.h - radius) {","        nearestY = b.h - radius;","    }","    if (nearestY < radius) {","        nearestY = radius;","    }","    int dx = localX - nearestX;","    int dy = localY - nearestY;","    return dx * dx + dy * dy <= radius * radius;","}","// hitButton：共享辅助函数。","int hitButton(int x,int y) {","    // 从buttons[0]向后找；首个可用命中项优先。","    for (size_t i=0;i<buttons.size();++i)","    {","        if (buttons[i].enabled && contains(buttons[i],x,y)) {","            return buttons[i].id;","        }","    }      // 只认「可点」的按钮；没点中返回 0","    return 0;","}","// drawButtons：共享辅助函数。","void drawButtons(int mouseX,int mouseY) {","    for (size_t i=0;i<buttons.size();++i) {","        const Button& b=buttons[i];","        if (!b.menu) {","            putimage_withalpha(NULL,buttonImage,b.x,b.y,b.w,b.h,0,0,320,80,true);","        }      // 菜单大按钮不贴素材底板，只用透明背景画文字","        if (b.enabled && pressed==b.id && contains(b,mouseX,mouseY)) {","            setfillcolor(EGERGB(220,220,220));","            solidroundrect(b.x,b.y,b.x+b.w,b.y+b.h,21);","        }","        if (b.menu) {","            font(48);","        }","        else {","            font(32);","        }","        if (b.enabled) {","            setcolor(EGERGB(58,46,31));","        }","        else {","            setcolor(EGERGB(125,125,115));","        }","        outtextxy(b.x+(b.w-textwidth(b.text.c_str()))/2,      // 让文字在按钮里居中显示","        b.y+(b.h-textheight(b.text.c_str()))/2,b.text.c_str());","        // 可点的是深色，不可点的是浅灰色，一眼能分辨","    }","}","// hideName：共享辅助函数。","void hideName() {","    ShowWindow(nameEdit,SW_HIDE);","    SetFocus(getHWnd());","}","// mainMenu：共享辅助函数。","void mainMenu() {","    cancelAI();","    hideName();","    page=MAIN_MENU;","    dialog=NO_DIALOG;","    pressed=0;","}","#endif"],"game_logic.h":["// 【本文件阅读路线】所有模式共用的规则层：reset 清盘 -> place 落子 -> wins 判胜 -> undo 悔棋。没有绘图或网络收发。","// 【建议阅读 01 / 棋盘规则】game_logic.h","// 从 Move、LocalGame 开始，再读 reset -> place -> wins -> undo。","// 这是单机、人机、复盘和网络共用的规则层；不负责图形、文件或线程。","// 外部接口声明位置：标准库对应的头文件；Win32/Winsock系统头；EGE的graphics.h。","// 头文件保护：首次包含时定义下面的宏，再次包含会跳过本文件，避免同一一次编译处理的源文件及其包含的头文件重复定义。","#ifndef GOMOKU_GAME_LOGIC_H","#define GOMOKU_GAME_LOGIC_H","#include <vector>","#include <cstring>","// 【类型 Move】一手落子的记录，不是棋盘。row/col是0..14行列，stone是1黑或2白；按时间顺序存入","// LocalGame::moves。","struct Move {","    int row, col, stone;","};","// 【类型 LocalGame】一盘棋的当前状态与规则操作。cells便于按格查询，moves保留落子顺序；正式落子/悔","// 棋同时维护二者。turn是执棋方，不是步数；result是结束结果，不是布尔胜负。","struct LocalGame {","    int cells[15][15];","    // 当前盘面：cells[row][col]，row向下、col向右；0空、1黑、2白。","    int turn, result;","    // turn=1/2；result=0未完、1黑胜、2白胜、3平局。终局分支不翻转turn。","    std::vector<Move> moves;","    // 落子历史，按先后顺序记下每一手；悔棋和复盘都要靠它","    // 【函数 LocalGame::LocalGame】默认构造空棋局。","    // 处理步骤：直接调用 reset；所有需要空棋盘的地方复用同一初始化逻辑。","    LocalGame() {","        reset();","    }      // 构造函数：这个对象一被创建就自动执行一次，把棋盘摆成开局状态","    // 【函数 LocalGame::reset】无参数、无返回值；恢复空棋盘。","    // 处理步骤：两层for循环把cells的每格置零；清空 moves；turn=1，result=0。","    // row和col分别遍历15行、15列。","    // 注意：只清空 cells 而不清 moves，会使屏幕绘制、手数与存档互相矛盾。","    void reset() {","        for (int row = 0; row < 15; ++row) {","            for (int col = 0; col < 15; ++col) {","                cells[row][col] = 0;","            }","        }     // 两层循环依次清空15×15个格子","        moves.clear();","        turn = 1;","        result = 0;","        // 清空历史；轮到黑棋(1)先下；result=0 表示对局尚未结束","    }","    // 【函数 LocalGame::wins】输入最后落点 row、col；返回这一点所在的线上是否有至少五颗同色子。","    // 处理步骤：先取当前格颜色；空格返回 false；对四个方向逐一从中心向两端走，遇到边界、空位或异色停止；","    // 累计>=5 返回 true。","    // 变量含义：directions[4][2] 是方向增量；d 是方向下标；stone 是本格颜色；count 从 1 算自身；","    // sign=-1/+1 是两端；r、c 是扫描中的坐标。","    // 注意：调用者必须先保证row/col在0..14；本函数入口不检查越界。方向(1,0)竖直、(0,1)水平；","    // >=5允许长连，无禁手规则。","    bool wins(int row, int col) const {","        const int directions[4][2] = {","            {","                1,0","            }, {","                0,1","            }, {","                1,1","            }, {","                1,-1","            }","        };","        // 每项是(行增量,列增量)：竖直、水平、右下斜线、左下斜线；sign同时扫描反向。","        int stone = cells[row][col];","        // 取出这一格的颜色，后面用它判断同色","        if (!stone) {","            return false;","        }         // 这一格是空的，当然谈不上赢","        for (int d = 0; d < 4; ++d) {","            // 依次检查四个方向","            int count = 1;","            // 先算上刚落的这一子自己，所以从 1 开始数","            for (int sign = -1; sign <= 1; sign += 2) {","                int r = row + sign * directions[d][0];","                // 从紧邻的那一格开始","                int c = col + sign * directions[d][1];","                while (r >= 0 && r < 15 && c >= 0 && c < 15 && cells[r][c] == stone) {","                    ++count;","                    r += sign * directions[d][0];","                    c += sign * directions[d][1];","                    // 同色棋子数加一，坐标前进一步","                }","            }","            if (count >= 5) {","                return true;","            }     // 这条线上同色棋子达到 5 颗及以上，判定获胜","        }","        return false;","        // 四个方向都没凑够，本子不构成胜负","    }","    // 【函数 LocalGame::place】输入 row、col；true 表示落子成功，false 表示状态没有被正常落子流程更新。","    // 处理步骤：拒绝已结束、越界、占用；写 cells；构造 move 并追加历史；先判胜，再判满盘，最后才交换","    // turn。","    // 变量含义：move 是当前这一步 {row,col,turn}；225=15×15。","    // 注意：胜利与满盘同时发生时，先判胜。wins 不会改 result，place 才负责落地终局状态。","    bool place(int row, int col) {","        if (result || row < 0 || row >= 15 || col < 0 || col >= 15 || cells[row][col]) {","            return false;","        }     // ||从左到右短路；越界时不会继续访问cells[row][col]。","        cells[row][col] = turn;","        // 把当前该下的人的颜色写进棋盘","        Move move;","        move.row=row;","        move.col=col;","        move.stone=turn;","        moves.push_back(move);","        // 先把本手颜色存入历史；此时turn尚未切换。Move类型见上方定义。","        if (wins(row, col)) {","            result = turn;","        }            // 这手凑成五连，落子方获胜","        else if (moves.size() == 225) {","            result = 3;","        }     // 否则如果 225 格全下满还没人赢，判平局(3)","        else {","            if(turn==1) {","                turn=2;","            } else {","                turn=1;","            }","        }                         // 都没发生，就把下子权交给对方：1 变 2，2 变 1","        // 语句说明：true只表示成功落子；是否结束需另外检查result。","        return true;","    }","    // 【函数 LocalGame::undo】撤掉最后一手；终局或无历史时返回 false。","    // 处理步骤：复制 moves.back；pop_back 删除历史；将原落点置 0；turn 恢复为这手的颜色。","    // 变量含义：move 是被撤回的一手。","    // 注意：不支持撤销已经结束的棋局。AI 回合悔棋由上层多次调用这里实现。","    bool undo() {","        if (result || moves.empty()) {","            return false;","        }     // empty() 判断历史是否为空","        Move move = moves.back();","        moves.pop_back();","        // back() 取出最后一手，pop_back() 把它从历史中删掉","        cells[move.row][move.col] = 0;","        turn = move.stone;","        // 清格并恢复到被撤销一手的执棋方；终局在入口已拒绝，故此处不需重算result。","        return true;","    }","};","#endif"],"game_input.h":["// 【本文件阅读路线】输入主线：initializeProgram 初始化 -> processMouseMessages 处理输入 -> releaseProgramResources 清理。","// 输入与窗口区：接收系统消息、鼠标输入，再调用业务动作或绘图。","#ifndef GOMOKU_GAME_INPUT_H","#define GOMOKU_GAME_INPUT_H","#include \"game_draw.h\"","volatile LONG windowCloseRequested=0;","WNDPROC originalWindowProc=NULL;","bool windowCreated=false;","LRESULT CALLBACK gameWindowProc(HWND hwnd,UINT msg,WPARAM wp,LPARAM lp) {","    if(msg==WM_CLOSE) {","        InterlockedExchange(&windowCloseRequested,1);","        return 0;","    }      // 收到关闭消息时只记个标志，先不真的退出","    return CallWindowProcW(originalWindowProc,hwnd,msg,wp,lp);","    // 其它消息交回给原来的处理函数，保证窗口功能正常","}","PIMAGE loadImage(const char* path) {","    PIMAGE im=newimage();","    // 创建一个新的图像对象","    if(!im || getimage(im,path)!=0) {","        if(im) {","            delimage(im);","        } return NULL;","    }      // getimage 从文件读入图片","    return im;","}","// 启动资源放在这里，main只看是否准备成功。","// 所有模式：把工作目录设为 exe 所在目录，资源相对路径才可靠。","bool setProgramDirectory() {","    wchar_t path[32768];","    DWORD n=GetModuleFileNameW(NULL,path,32768);","    // 取得本程序 exe 的完整路径","    if(!n || n>=32768) {","        return false;","    }      // 路径异常就直接失败退出","    wchar_t* slash=std::wcsrchr(path,L'\\\\');","    if(!slash) {","        return false;","    }      // 找到最后一个反斜杠，把文件名部分截掉，剩下目录","    *slash=0;","    if(!SetCurrentDirectoryW(path)) {","        return false;","    }      // 把工作目录切到 exe 所在目录，后续的相对路径就都对了","    return true;","}","// 所有模式：设置缩放、创建图形窗口并设置手动绘制。","void createGameWindow() {","    typedef BOOL (WINAPI *DpiFunction)();","    DpiFunction dpi=reinterpret_cast<DpiFunction>(GetProcAddress(GetModuleHandleW(L\"user32.dll\"),\"SetProcessDPIAware\"));","    // 取得系统函数地址；老系统上可能没有，所以要先判断","    if(dpi) {","        dpi();","    }      // 有就调用它","    setinitmode(INIT_ANIMATION);","    initgraph(1800,1350);","    windowCreated=true;","    setcaption(L\"\\u4e94\\u5b50\\u68cb\");","    // 五子棋","    setrendermode(RENDER_MANUAL);","    SetWindowLongPtrW(getHWnd(),GWL_STYLE,GetWindowLongPtrW(getHWnd(),GWL_STYLE)|WS_CLIPCHILDREN);","}","// 所有模式：读取棋盘/棋子/按钮图片和九十帧菜单背景；失败返回 false。","bool loadGameImages() {","    background=loadImage(\"assets/backgrounds/bg_a.png\");","    // 背景图","    boardImage=loadImage(\"assets/board/board.png\");","    // 棋盘图","    blackImage=loadImage(\"assets/pieces/black.png\");","    whiteImage=loadImage(\"assets/pieces/white.png\");","    // 黑白棋子","    buttonImage=loadImage(\"assets/ui/button_320x80.png\");","    // 按钮底板素材","    bool loaded=background && boardImage && blackImage && whiteImage && buttonImage;","    // loaded 为假表示上面有任何一张图没加载成功","    for(int i=0;i<90 && loaded && is_run();++i) {","        char file[80];","        std::sprintf(file,\"assets/menu/frames/frame_%03d.png\",i);","        // 90 帧的文件名是 frame_000.png 到 frame_089.png","        frames[i]=loadImage(file);","        loaded=frames[i]!=NULL;","        // 任何一帧失败就整体判为失败","        if(i==0 && loaded) {","            putimage(0,0,frames[0]);","        }","        delay_ms(1);","        // 每帧之间稍微歇一下，避免启动时界面完全没反应","    }","    return loaded;","}","// 创建隐藏的命名框及联网地址/端口框；相应流程再显示它们。","bool createInputControls() {","    editFont=CreateFontW(-32,0,0,0,FW_NORMAL,FALSE,FALSE,FALSE,DEFAULT_CHARSET,","    OUT_DEFAULT_PRECIS,CLIP_DEFAULT_PRECIS,ANTIALIASED_QUALITY,DEFAULT_PITCH,L\"\\u6977\\u4f53\");","    // 楷体；创建楷体字体，负高度表示按字号大小算","    nameEdit=CreateWindowExW(WS_EX_CLIENTEDGE,L\"EDIT\",L\"\",WS_CHILD|ES_AUTOHSCROLL,","    1260,710,460,60,getHWnd(),NULL,GetModuleHandleW(NULL),NULL);","    // 创建子编辑框；字体在后续WM_SETFONT消息中设置。","    if(nameEdit) {","        SendMessageW(nameEdit,WM_SETFONT,reinterpret_cast<WPARAM>(editFont),TRUE);","        SendMessageW(nameEdit,EM_SETLIMITTEXT,24,0);","        // 编辑控件限制24个UTF-16代码单元，不是所有Unicode字符都严格按24个计。","    }","    bool loaded = nameEdit != NULL;","    // 素材或输入框有一个没成功，整体就算失败","    ipEdit=CreateWindowExW(WS_EX_CLIENTEDGE,L\"EDIT\",L\"\",WS_CHILD|ES_AUTOHSCROLL,","    720,420,600,60,getHWnd(),NULL,GetModuleHandleW(NULL),NULL);","    // 创建IPv4地址输入框；后面的EM_SETLIMITTEXT才设置15字符上限。","    portEdit=CreateWindowExW(WS_EX_CLIENTEDGE,L\"EDIT\",L\"5000\",WS_CHILD|ES_AUTOHSCROLL|ES_NUMBER,      // 端口框默认填 5000","    720,590,300,60,getHWnd(),NULL,GetModuleHandleW(NULL),NULL);","    if(ipEdit) {","        SendMessageW(ipEdit,WM_SETFONT,reinterpret_cast<WPARAM>(editFont),TRUE);","        SendMessageW(ipEdit,EM_SETLIMITTEXT,15,0);","    }      // 同样把字体设上，并限制长度","    if(portEdit) {","        SendMessageW(portEdit,WM_SETFONT,reinterpret_cast<WPARAM>(editFont),TRUE);","        SendMessageW(portEdit,EM_SETLIMITTEXT,5,0);","    }","    loaded=loaded && ipEdit && portEdit;","    // 三个控件都创建成功才算通过","    return loaded;","}","// 初始化入口：目录 -> 窗口 -> 图片 -> 输入框 -> 关闭回调和存档目录。","bool initializeProgram() {","    if (!setProgramDirectory()) {","        return false;","    }","    createGameWindow();","    bool imagesLoaded = loadGameImages();","    bool controlsCreated = createInputControls();","    originalWindowProc=reinterpret_cast<WNDPROC>(SetWindowLongPtrW(getHWnd(),GWLP_WNDPROC,reinterpret_cast<LONG_PTR>(gameWindowProc)));","    recordDirectories();","    // 确保存档需要的目录都存在","    return imagesLoaded && controlsCreated;","}","void processWindowMessages() {","    MSG message;","    // message保存Windows窗口消息；取消息时的PM_REMOVE会将它从队列移除。","    while(PeekMessageW(&message,NULL,0,0,PM_REMOVE)) {","        if(message.message==WM_QUIT) {","            running=false;","        }      // 收到退出消息就结束主循环","        TranslateMessage(&message);","        DispatchMessageW(&message);","    }","}","void handleWindowCloseRequest() {","    if(InterlockedExchange(&windowCloseRequested,0)==0) {","        return;","    }","    if(page==GAME_PAGE && gameMode==\"ONLINE\") {","        if(archiveStage==0) {","            // 联网对局中途关窗口，先走联网的退出与保存询问","            if(netState.phase==N_PLAY && !netPending) {","                closeAfterOnline=true;","                onlineAsk(2);","            }","            else {","                toast(L\"\\u8bf7\\u5148\\u5b8c\\u6210\\u5f53\\u524d\\u8be2\\u95ee\\uff0c\\u518d\\u9000\\u51fa\");","            }      // 还有询问没处理完，先提示玩家，不要强行退出","        } else {","            closeAfterOnline=true;","            if(archiveStage>=3) {","                onlineRequestHome();","            }","        }","    } else if(page==NETWORK_PAGE && netStage==4) {","        closeAfterOnline=true;","        onlineLobbyLeave();","    }      // 在联网等待室里关窗口，走等待室离开流程","    else {","        running=false;","    }      // 其余页面直接退出程序","}","// 仅列表页：滚轮改变第一条显示记录的位置。","void scrollRecordList(const mouse_msg& m) {","    if (m.wheel < 0) {","        ++listOffset;","    } else {","        --listOffset;","    }","    limitListOffset();","}","// 单机和人机：立即检查并落子，结束后询问是否保存。","void placeLocalStone(int cell) {","    bool placed = game.place(cell / 15, cell % 15);","    if (placed && game.result != 0) {","        dialog = FINISHED_SAVE;","    }","}","// 按下只记住目标；此时不执行按钮，也不落子。","void rememberMouseDown(const mouse_msg& m) {","    pressed = hitButton(m.x, m.y);","    pressedCell = -1;","    if (humanCanMove()) {","        pressedCell = boardCell(m.x, m.y);","    }","}","// 松开：仍是同一个按钮/交点才执行，防止拖动造成误操作。","void finishMouseClick(const mouse_msg& m) {","    int hit = hitButton(m.x, m.y);","    if (hit && hit == pressed) {","        act(hit);","    } else if (!pressed && pressedCell >= 0 && humanCanMove()) {","        int cell = boardCell(m.x, m.y);","        if (cell == pressedCell) {","            if (gameMode == \"ONLINE\") {","                onlineMove(cell);","                // 联网只发送请求，服务器确认后更新棋盘。","            } else {","                placeLocalStone(cell);","                // 单机/人机立即落子。","            }","        }","    }","    pressed = 0;","    pressedCell = -1;","}","// 输入入口：列表滚轮、左键按下、左键松开三种情况。","void processMouseMessages(ULONGLONG started) {","    while (mousemsg()) {","        mouse_msg m = getmouse();","        if (m.is_wheel() && dialog == NO_DIALOG && (page == SAVE_LIST || page == REPLAY_LIST)) {","            scrollRecordList(m);","            continue;","        }","        if (!m.is_left()) {","            continue;","        }","        if (m.is_down()) {","            rememberMouseDown(m);","        }","        if (m.is_up()) {","            finishMouseClick(m);","            if (running && is_run()) {","                render(started);","            }","        }","    }","}","void releaseProgramResources() {","    if(!windowCreated) {","        return;","    }","    onlineStop();","    aiWorker.shutdown();","    // 停掉 AI 后台线程，等它真正结束","    if(originalWindowProc && is_run()) {","        SetWindowLongPtrW(getHWnd(),GWLP_WNDPROC,reinterpret_cast<LONG_PTR>(originalWindowProc));","    }      // 把窗口处理函数换回原来的","    if(ipEdit) {","        DestroyWindow(ipEdit);","    }      // 销毁输入框控件","    if(portEdit) {","        DestroyWindow(portEdit);","    }","    if(nameEdit) {","        DestroyWindow(nameEdit);","    }","    if(editFont) {","        DeleteObject(editFont);","    }      // 释放字体对象","    for(int i=0;i<90;++i) {","        if(frames[i]) {","            delimage(frames[i]);","        }","    }      // 释放 90 帧动画占用的内存","    PIMAGE images[]= {","        background,boardImage,blackImage,whiteImage,buttonImage","    };","    // 释放其余素材","    for(int i=0;i<5;++i) {","        if(images[i]) {","            delimage(images[i]);","        }","    }","    closegraph();","    // 关闭图形窗口","}","#endif"],"game_actions.h":["// 【本文件阅读路线】业务入口：act 分发按钮；单机/人机开局与保存、复盘操作、列表操作分组；联网操作交给 onlineAction。","// 业务动作区：按钮编号进来，修改page/dialog/game等状态。","// 阅读顺序：newGame -> 落子place -> beginName/saveGame -> mainMenu。","#ifndef GOMOKU_GAME_ACTIONS_H","#define GOMOKU_GAME_ACTIONS_H","#include \"ui_common.h\"","#include \"online_ui.h\"","// 排序规则单独命名，不在sort里写匿名函数。","bool newerEntryFirst(const SavedEntry& a, const SavedEntry& b) {","    return a.path > b.path;","}","// 列表一页最多八项；删除或滚动后都用同一处边界检查。","void limitListOffset() {","    int maximum = static_cast<int>(entries.size()) - 8;","    if (maximum < 0) {","        maximum = 0;","    }","    if (listOffset < 0) {","        listOffset = 0;","    }","    if (listOffset > maximum) {","        listOffset = maximum;","    }","}","// humanCanMove：此处是该业务函数的定义。","bool humanCanMove() {","    if (page != GAME_PAGE) {","        return false;","    }","    if (dialog != NO_DIALOG) {","        return false;","    }","    if (game.result != 0) {","        return false;","    }","    if (gameMode == \"HUMAN_AI\" && game.turn != humanStone) {","        return false;","    }","    if (gameMode == \"ONLINE\" && !onlineCanMove()) {","        return false;","    }","    return true;","}","// lastHumanMove：此处是该业务函数的定义。","int lastHumanMove() {","    for(int i=static_cast<int>(game.moves.size())-1;i>=0;--i)      // 只要有一手是自己的，就返回它的下标","    {","        if(game.moves[i].stone==humanStone) {","            return i;","        }","    }      // 倒序遇到的第一手属于玩家的棋，也就是玩家最近的一手。","    return -1;","}","// newGame：此处是该业务函数的定义。","void newGame(bool keepName=false) {","    cancelAI();","    hideName();","    game.reset();","    page=GAME_PAGE;","    if(!keepName) {","        currentName.clear();","        loadedPath.clear();","    }      // keepName为false才清名称和原残局路径；true用于保留身份的重开。","    if (gameMode == \"HUMAN_AI\") {","        dialog = CHOOSE_COLOR;","    } else {","        dialog = NO_DIALOG;","    }      // 人机模式还要先问玩家执黑还是执白","}","// openList：此处是该业务函数的定义。","void openList(bool isReplay,bool refresh=false) {","    entries.clear();","    // 每次都重建列表内容；是否保留滚动位置由下一行refresh决定。","    if(!refresh) {","        listOffset=0;","    }","    std::wstring dir;","    std::wstring pattern;","    if (isReplay) {","        dir = L\"data\\\\replays\\\\\";","        pattern = L\"*.greplay\";","    } else {","        dir = L\"data\\\\unfinished\\\\\";","        pattern = L\"*.gsave\";","    }","    WIN32_FIND_DATAW info;","    HANDLE find=FindFirstFileW((dir + pattern).c_str(),&info);","    // FindFirstFileW 按通配符找文件","    if(find!=INVALID_HANDLE_VALUE) {","        // 无匹配文件或查找失败时句柄无效；当前界面统一按无结果处理。","        do {","            if(info.dwFileAttributes&(FILE_ATTRIBUTE_DIRECTORY|FILE_ATTRIBUTE_REPARSE_POINT)) {","                continue;","            }","            SavedEntry entry;","            entry.path=dir+info.cFileName;","            // 路径存起来，删除时要用","            GameRecord record;","            entry.valid=readRecord(entry.path,isReplay,record);","            if (entry.valid) {","                entry.name = record.name;","                entry.mode = record.mode;","                entry.result = record.game.result;","            } else {","                entry.name = info.cFileName;","                entry.mode = \"INVALID\";","                entry.result = -1;","            }","            entries.push_back(entry);","        } while(FindNextFileW(find,&info));","        // 一直找到没有下一个文件为止","        FindClose(find);","        // 用完记得关闭查找句柄","    }","    // 语句说明：lambda比较路径，降序排列；文件名含时间信息，但这里没有读取文件修改时间。","    std::sort(entries.begin(),entries.end(),newerEntryFirst);","    limitListOffset();","    if(entries.empty() && !refresh) {","        toast(L\"\\u6682\\u65e0\\u5b58\\u6863\");","        return;","    }     // 暂无存档；列表为空就提示「暂无存档」，并停在原页面","    if (isReplay) {","        page=REPLAY_LIST;","    } else {","        page=SAVE_LIST;","    }","    dialog=NO_DIALOG;","}","// saveGame：此处是该业务函数的定义。","bool saveGame(std::wstring name) {","    size_t first=name.find_first_not_of(L\" \\t\\r\\n\"),last=name.find_last_not_of(L\" \\t\\r\\n\");","    if(first==std::wstring::npos) {","        toast(L\"\\u8bf7\\u8f93\\u5165\\u68cb\\u5c40\\u540d\\u79f0\");","        return false;","    }     // 请输入棋局名称","    name=name.substr(first,last-first+1);","    // 去掉了首尾空白后的名字","    if(name.size()>24 || name.find_first_of(L\"\\r\\n\\t\")!=std::wstring::npos) {","        toast(L\"\\u540d\\u79f0\\u965024\\u5b57\\uff0c\\u4e0d\\u80fd\\u5305\\u542b\\u6362\\u884c\");","        return false;","    }     // 名称限24字，不能包含换行","    GameRecord record;","    record.game=game;","    record.mode=gameMode;","    record.difficulty=difficulty;","    record.human=humanStone;","    record.name=name;","    record.replay=game.result!=0;","    // 已结束的棋局存成复盘，未结束的存成残局","    std::wstring overwritePath;","    if (!record.replay) {","        overwritePath = loadedPath;","    }","    if(!writeRecord(record,overwritePath)) {","        toast(L\"\\u4fdd\\u5b58\\u5931\\u8d25\\uff0c\\u8bf7\\u68c0\\u67e5\\u76ee\\u5f55\\u540e\\u91cd\\u8bd5\");","        return false;","    }     // 保存失败，请检查目录后重试","    currentName=name;","    if(record.replay && !loadedPath.empty()) {","        if(!DeleteFileW(loadedPath.c_str()) && GetLastError()!=ERROR_FILE_NOT_FOUND)","        {","            toast(L\"\\u590d\\u76d8\\u5df2\\u4fdd\\u5b58\\uff0c\\u539f\\u6b8b\\u5c40\\u8bf7\\u624b\\u52a8\\u5220\\u9664\");","        }     // 复盘已保存，原残局请手动删除","        else {","            toast(L\"\\u590d\\u76d8\\u5df2\\u4fdd\\u5b58\");","        }     // 复盘已保存；复盘已保存，原残局可以删掉了","        loadedPath.clear();","    } else {","        if(!record.replay) {","            loadedPath=record.path;","        }","        toast(L\"\\u68cb\\u5c40\\u5df2\\u4fdd\\u5b58\");","    }     // 棋局已保存；残局存好了，记下路径，方便以后续局时覆盖","    return true;","}","// savedSuccessfully：此处是该业务函数的定义。","void savedSuccessfully() {","    hideName();","    if (game.result != 0) {","        dialog = AGAIN;","    } else {","        mainMenu();","    }","}","// beginName：此处是该业务函数的定义。","void beginName() {","    savingFinished=game.result!=0;","    if(!currentName.empty()) {","        if(saveGame(currentName)) {","            savedSuccessfully();","        }","        return;","    }","    dialog=NAME_SAVE;","    SetWindowTextW(nameEdit,L\"\");","    ShowWindow(nameEdit,SW_SHOW);","    SetFocus(nameEdit);","}","// loadEntry：此处是该业务函数的定义。","void loadEntry(int index) {","    if(index<0 || index>=static_cast<int>(entries.size())) {","        return;","    }","    GameRecord record;","    bool isReplay=page==REPLAY_LIST;","    if(!readRecord(entries[index].path,isReplay,record)) {","        toast(L\"\\u5b58\\u6863\\u635f\\u574f\\u6216\\u65e0\\u6cd5\\u8bfb\\u53d6\");","        return;","    }     // 存档损坏或无法读取","    if(!isReplay && record.mode==\"ONLINE\") {","        toast(L\"\\u8054\\u7f51\\u68cb\\u5c40\\u4e0d\\u80fd\\u79bb\\u7ebf\\u7eed\\u5c40\");","        return;","    }     // 联网棋局不能离线续局","    cancelAI();","    hideName();","    dialog=NO_DIALOG;","    if(isReplay) {","        replayRecord=record;","        replayName=record.name;","        replayPlayer.open(record.game);","        page=REPLAY_PAGE;","    }","    else {","        // 恢复出这一局的所有信息","        game=record.game;","        gameMode=record.mode;","        difficulty=record.difficulty;","        humanStone=record.human;","        currentName=record.name;","        loadedPath=record.path;","        page=GAME_PAGE;","        // 记下名字和路径，后续保存时沿用","    }","}","// updateAI：此处是该业务函数的定义。","// 是否轮到电脑：把人机专用的条件集中放在这里。","bool isComputerTurn() {","    return page == GAME_PAGE && dialog == NO_DIALOG && gameMode == \"HUMAN_AI\"","    && game.result == 0 && game.turn != humanStone;","}","// 收回后台计算结果；旧对局结果或非人机页面的结果不能落到当前棋盘。","void receiveAIResult() {","    AIPoint point;","    int resultGeneration = 0;","    if (!aiWorker.take(point, resultGeneration)) {","        return;","    }","    if (resultGeneration != generation || !isComputerTurn()) {","        return;","    }","    if (game.place(point.row, point.col) && game.result != 0) {","        cancelAI();","        dialog = FINISHED_SAVE;","    }","}","// 仅人机且轮到电脑：没有现存线程时，开始计算下一手。","void startAIIfNeeded() {","    if (!isComputerTurn() || aiWorker.thread) {","        return;","    }","    if (!aiWorker.start(game, difficulty, generation)) {","        toast(L\"AI\\u7ebf\\u7a0b\\u542f\\u52a8\\u5931\\u8d25\\uff0c\\u53ef\\u91cd\\u5f00\\u6216\\u9000\\u51fa\");","        dialog = RESTART_CONFIRM;","    }","}","// AI 更新入口：先收结果，再决定是否需要启动下一次计算。","void updateAI() {","    receiveAIResult();","    startAIIfNeeded();","}","// boardCell：此处是该业务函数的定义。","int boardCell(int x,int y) {","    int dx=x-FIRST_X, dy=y-FIRST_Y;","    if(dx < -30 || dy < -30 || dx > 14*SPACING+30 || dy > 14*SPACING+30) {","        return -1;","    }      // 棋盘外太远的点击直接丢弃","    int col=(dx+SPACING/2)/SPACING, row=(dy+SPACING/2)/SPACING;","    // 四舍五入吸附到最近的交点","    dx-=col*SPACING;","    dy-=row*SPACING;","    if(row<0 || row>=15 || col<0 || col>=15 || dx*dx+dy*dy>900) {","        return -1;","    }      // 换算偏移后判断是否真的足够近","    return row*15+col;","    // 把二维坐标压成一维编号返回","}","// 返回true表示这个组已经处理了按钮。","bool handleMenuAction(int id) {","    switch(id) {","        case A_START:","        page=MODE_MENU;","        break;","        // 开始游戏 → 进入模式菜单","        case A_CONTINUE:","        openList(false);","        break;","        case A_REPLAY:","        openList(true);","        break;","        case A_QUIT:","        running=false;","        break;","        case A_LOCAL:","        gameMode=\"LOCAL_TWO\";","        newGame();","        break;","        // 单机双人","        case A_AI:","        page=DIFFICULTY_PAGE;","        break;","        case A_EASY:","        case A_MEDIUM:","        case A_HARD:","        if(id==A_EASY) {","            difficulty=0;","        } else if(id==A_MEDIUM) {","            difficulty=1;","        } else {","            difficulty=2;","        }","        gameMode=\"HUMAN_AI\";","        newGame();","        break;","        // 选了难度后进入人机模式","        case A_BLACK:","        case A_WHITE:","        if(id==A_BLACK) {","            humanStone=1;","        } else {","            humanStone=2;","        }","        dialog=NO_DIALOG;","        break;","        // 记下玩家选的颜色并关闭询问","        case A_BACK:","        mainMenu();","        break;","        // 【阅读提示】人机悔棋以最近一次人类落子为界，一并撤掉后续电脑应答；不是固定撤两手。","        default: return false;","    }","    return true;","}","// 返回true表示这个组已经处理了按钮。","bool handleGameAction(int id) {","    switch(id) {","        case A_UNDO:","        cancelAI();","        if(gameMode==\"HUMAN_AI\") {","            int at=lastHumanMove();","            if(at>=0) {","                while(static_cast<int>(game.moves.size())>at) {","                    game.undo();","                }","            }","        } else {","            game.undo();","        }      // 单机模式直接撤最后一手","        break;","        case A_EXIT_GAME:","        cancelAI();","        if(game.result!=0) {","            dialog=AGAIN;","        } else {","            dialog=EXIT_SAVE;","        }","        break;","        // 棋局已结束就直接问「再来一局」，否则问是否保存","        case A_RESTART:","        if(!game.result) {","            cancelAI();","            dialog=RESTART_CONFIRM;","        }","        break;","        // 重开前先确认，而且只有棋局没结束时才需要","        // 【阅读提示】同一个A_YES按钮按dialog解释；先核对正在询问什么，再看该分支会保存、重开还是删除。","        default: return false;","    }","    return true;","}","// 返回true表示这个组已经处理了按钮。","bool handleDialogAction(int id) {","    switch(id) {","        case A_YES:","        if(dialog==DELETE_CONFIRM) {","            if(deleteIndex>=0 && deleteIndex<static_cast<int>(entries.size()) &&      // 删除成功后刷新列表并提示","            DeleteFileW(entries[deleteIndex].path.c_str())) {","                bool isReplay=page==REPLAY_LIST;","                openList(isReplay,true);","                toast(L\"\\u5df2\\u6c38\\u4e45\\u5220\\u9664\");","                // 已永久删除","            } else {","                toast(L\"\\u5220\\u9664\\u5931\\u8d25\\uff0c\\u8bf7\\u68c0\\u67e5\\u6587\\u4ef6\\u6743\\u9650\");","            }     // 删除失败会提示检查权限；失败原因也可能是文件占用、路径变化等。","        } else if(dialog==REPLAY_EXIT) {","            replayPlayer.pause(GetTickCount64());","            mainMenu();","        }","        else if(dialog==EXIT_SAVE || dialog==FINISHED_SAVE) {","            beginName();","        }      // 要保存就进入命名流程","        else if(dialog==RESTART_CONFIRM) {","            newGame(true);","        }      // 重开：保留名字","        else if(dialog==AGAIN) {","            newGame();","        }      // 再来一局：用全新的棋局","        break;","        case A_NO:","        if(dialog==DELETE_CONFIRM || dialog==REPLAY_EXIT) {","            dialog=NO_DIALOG;","        }      // 删除询问和退出复盘询问都是直接关闭弹窗","        else if(dialog==EXIT_SAVE || dialog==AGAIN) {","            mainMenu();","        }      // 退出对局或不再来一局，都回主菜单","        else if(dialog==RESTART_CONFIRM) {","            dialog=NO_DIALOG;","        }","        else if(dialog==FINISHED_SAVE) {","            dialog=AGAIN;","        }      // 本局已结束时取消保存，回到「再来一局」的询问","        break;","        default: return false;","    }","    return true;","}","// 返回true表示这个组已经处理了按钮。","bool handleSaveAction(int id) {","    switch(id) {","        case A_SAVE:","        {","            wchar_t name[128];","            GetWindowTextW(nameEdit,name,128);","            // 缓冲容量128个wchar_t（含末尾0）；控件此前已设置输入长度24。","            if(saveGame(name)) {","                savedSuccessfully();","            }","            break;","        }","        case A_CANCEL:","        hideName();","        if(savingFinished) {","            dialog=FINISHED_SAVE;","        } else {","            dialog=EXIT_SAVE;","        }","        break;","        default: return false;","    }","    return true;","}","// 返回true表示这个组已经处理了按钮。","bool handleReplayAction(int id) {","    switch(id) {","        case A_PLAY:","        case A_RESUME:","        replayPlayer.play(GetTickCount64());","        break;","        // PLAY与RESUME共用play；PAUSE在下一分支单独处理。","        case A_PAUSE:","        replayPlayer.pause(GetTickCount64());","        break;","        case A_SPEED1:","        replayPlayer.speed(3000,GetTickCount64());","        break;","        // 1x 速度：每手停 3 秒","        case A_SPEED2:","        replayPlayer.speed(1500,GetTickCount64());","        break;","        // 2x 速度：每手停 1.5 秒","        case A_PREVIOUS:","        if(replayPlayer.cursor) {","            replayPlayer.seek(replayPlayer.cursor-1);","        }","        break;","        // 单步回看","        case A_NEXT:","        if(replayPlayer.cursor<replayPlayer.moves.size()) {","            replayPlayer.seek(replayPlayer.cursor+1);","        }","        break;","        case A_REPLAY_EXIT:","        replayPlayer.pause(GetTickCount64());","        dialog=REPLAY_EXIT;","        break;","        // 退出复盘前先暂停，再弹询问","        default: return false;","    }","    return true;","}","// 动态列表按钮：偶数载入，奇数删除；编号规则保持与绘图一致。","bool handleListAction(int id) {","    if (id < 1000) {","        return false;","    }","    if (dialog != NO_DIALOG) {","        return true;","    }","    int index = (id - 1000) / 2;","    if (index < 0 || index >= static_cast<int>(entries.size())) {","        return true;","    }","    if ((id - 1000) % 2 == 1) {","        deleteIndex = index;","        dialog = DELETE_CONFIRM;","    } else {","        loadEntry(index);","    }","    return true;","}","// 所有按钮只从这个入口分发；先定位功能组，再进入具体case。","void act(int id) {","    if (id >= A_ONLINE && id <= A_NET_COPY) {","        onlineAction(id);","        return;","    }","    if (handleListAction(id)) {","        return;","    }","    if (handleMenuAction(id)) {","        return;","    }","    if (handleGameAction(id)) {","        return;","    }","    if (handleDialogAction(id)) {","        return;","    }","    if (handleSaveAction(id)) {","        return;","    }","    handleReplayAction(id);","}","#endif"],"game_draw.h":["// 【本文件阅读路线】绘图主线：render 选页面 -> drawGame 画公共棋盘/结果 -> 按复盘、联网、人机、单机选择操作区。","// 显示区：读取状态画页面，不在这里执行落子、保存或网络请求。","#ifndef GOMOKU_GAME_DRAW_H","#define GOMOKU_GAME_DRAW_H","#include \"game_actions.h\"","// 公共显示：所有模式都画背景、棋盘和已有棋子；只读 shown，不改变棋局。","void drawBoard(const LocalGame& shown, bool replay) {","    putimage(0,0,background);","    // 先铺背景，再叠棋盘","    putimage_withalpha(NULL,boardImage,BOARD_X,BOARD_Y,1080,1080,0,0,720,720,true);","    std::wstring title;","    if (replay) {","        title = L\"\\u68cb\\u5c40\\u590d\\u76d8\";","    } else if (gameMode == \"ONLINE\") {","        title = L\"\\u8054\\u7f51\\u5bf9\\u5f08\";","    } else if (gameMode == \"HUMAN_AI\") {","        title = L\"\\u4eba\\u673a\\u5bf9\\u5f08\";","    } else {","        title = L\"\\u5355\\u673a\\u5bf9\\u5f08\";","    }","    // 棋局复盘；人机对弈；单机对弈；标题：联网、复盘、人机、单机各有说法","    if(!shown.result) {","        text(150,95,title+L\" \\u00b7 \\u9ed1\\u5148\\u767d\\u540e\",48);","    }     // · 黑先白后；棋局结束时顶部不再显示标题和先手说明","    for(size_t i=0;i<shown.moves.size();++i) {","        const Move& m=shown.moves[i];","        // 逐手画出棋子","        putimage_withalpha(NULL,m.stone==1?blackImage:whiteImage,FIRST_X+m.col*SPACING-33,","        FIRST_Y+m.row*SPACING-33,66,66,0,0,44,44,true);","        // 目标棋子图像66×66像素；读取源图的44×44区域，再居中放到交点。","    }","}","// 仅联网：实时对局画落子预览；实时对局和联网复盘标记最后一手。","void drawOnlineBoardExtras(const LocalGame& shown, bool replay) {","    // 【阅读提示】联网悬停预览只是半透明图像，不会写入cells/moves；正式棋子要等权威STATE。","    if(!replay && humanCanMove()) {","        int mx=-1,my=-1;","        mousepos(&mx,&my);","        int cell=boardCell(mx,my);","        if(cell>=0 && !shown.cells[cell/15][cell%15])      // 只有空位才显示预览","        {","            putimage_alphablend(NULL,game.turn==1?blackImage:whiteImage,FIRST_X+(cell%15)*SPACING-33,","            FIRST_Y+(cell/15)*SPACING-33,66,66,110,0,0,44,44,true,COLORTYPE_ARGB32);","        }      // 110 是半透明程度","    }","    if(!shown.moves.empty()) {","        const Move& last=shown.moves.back();","        setcolor(EGERGB(213,74,35));","        setlinewidth(3);","        // 最后一手用小红圈标出来","        circle(FIRST_X+last.col*SPACING,FIRST_Y+last.row*SPACING,7);","        setlinewidth(1);","    }","}","// 公共结果显示：未结束时不画横幅；获胜时圈出连成五颗的棋子。","void drawGameResult(const LocalGame& shown, bool replay) {","    int endReason = END_UNKNOWN;","    if (replay) {","        endReason = replayRecord.reason;","    } else if (gameMode == \"ONLINE\") {","        endReason = netState.reason;","    }","    // reason 来自复盘记录或联网状态","    if(shown.result) {","        setfillcolor(EGERGB(128,48,32));","        solidroundrect(100,65,1180,185,25);","        // 深红色横幅","        font(68);","        setcolor(EGERGB(255,231,151));","        // 金色大字","        const wchar_t* banner;","        if (shown.result==1) {","            banner = L\"\\u9ed1 \\u65b9 \\u83b7 \\u80dc\\uff01\";","        } else {","            if (shown.result==2) {","                banner = L\"\\u767d \\u65b9 \\u83b7 \\u80dc\\uff01\";","            } else {","                banner = L\"\\u672c \\u5c40 \\u5e73 \\u5c40\";","            }","        }","        // 黑 方 获 胜！；白 方 获 胜！；本 局 平 局","        if(endReason==END_RESIGN) {","            banner=shown.result==1?L\"\\u9ed1\\u65b9\\u83b7\\u80dc\\uff08\\u5bf9\\u65b9\\u8ba4\\u8f93\\uff09\":L\"\\u767d\\u65b9\\u83b7\\u80dc\\uff08\\u5bf9\\u65b9\\u8ba4\\u8f93\\uff09\";","        }","        outtextxy(640-textwidth(banner)/2,88,banner);","        // 文字水平居中","        // 【阅读提示】认输有胜者但未必五连，禁止把它画成连五；平局也没有获胜连线。","        if(endReason!=END_RESIGN && shown.result!=3 && !shown.moves.empty()) {","            Move last=shown.moves.back();","            int dirs[4][2]= {","                {","                    1,0","                }, {","                    0,1","                }, {","                    1,1","                }, {","                    1,-1","                }","            };","            // 方向增量按行/列解释：竖直、水平、两条斜线；line用于收集胜线上的棋子。","            setcolor(EGERGB(229,152,28));","            setlinewidth(4);","            // 金色，并加粗线宽","            for(int d=0;d<4;++d) {","                std::vector<Move> line;","                line.push_back(last);","                for(int sign=-1;sign<=1;sign+=2) {","                    // 往两头各延伸一次","                    int r=last.row+sign*dirs[d][0],c=last.col+sign*dirs[d][1];","                    // 从相邻一格开始","                    while(r>=0 && r<15 && c>=0 && c<15 && shown.cells[r][c]==last.stone) {","                        // 同色就继续往前","                        Move m= {","                            r,c,last.stone","                        };","                        line.push_back(m);","                        r+=sign*dirs[d][0];","                        c+=sign*dirs[d][1];","                        // 把这一颗收进连线里","                    }","                }","                if(line.size()>=5) {","                    for(size_t i=0;i<line.size();++i)      // 半径 35 的金圈套住每一颗棋子","                    {","                        circle(FIRST_X+line[i].col*SPACING,FIRST_Y+line[i].row*SPACING,35);","                    }","                }","            }","            setlinewidth(1);","            // 线宽还原","        }","    }","}","// 公共底板：在棋盘右侧画浅米色圆角矩形。","void drawSidebarBase() {","    setfillcolor(EGERGB(246,241,224));","    solidroundrect(1220,120,1760,1250,24);","}","// 仅复盘：播放、暂停、速度、前后步和退出询问。","void drawReplayPanel() {","    text(1270,155,L\"\\u68cb\\u5c40\\u590d\\u76d8\",44);","    // 棋局复盘；面板标题","    text(1250,220,replayName.size()>14?replayName.substr(0,14)+L\"\\u2026\":replayName,30);","    // …；棋局名太长时截断并加省略号","    wchar_t step[80];","    std::swprintf(step,80,L\"%u / %u\",static_cast<unsigned>(replayPlayer.cursor),static_cast<unsigned>(replayPlayer.moves.size()));","    // 当前步数与总步数","    text(1370,275,step,36);","    // 这里只显示播放进度；下面依据started决定是否出现速度按钮。","    bool free=dialog==NO_DIALOG;","    if(!replayPlayer.started) {","        addButton(A_PLAY,1330,340,320,80,L\"\\u81ea\\u52a8\\u64ad\\u653e\",free && !replayPlayer.moves.empty());","    }     // 自动播放","    else {","        // 曾经开始过播放就显示速度按钮；正在播放与暂停状态都可看到。","        addButton(A_SPEED1,1260,340,220,75,replayPlayer.interval==3000?L\"1x\\uff08\\u5f53\\u524d\\uff09\":L\"1x\",free);","        // 1x（当前）；当前速度的按钮会加「（当前）」字样","        addButton(A_SPEED2,1500,340,220,75,replayPlayer.interval==1500?L\"2x\\uff08\\u5f53\\u524d\\uff09\":L\"2x\",free);","        // 2x（当前）","        addButton(replayPlayer.playing?A_PAUSE:A_RESUME,1330,440,320,80,      // 暂停或继续播放","        replayPlayer.playing?L\"\\u6682\\u505c\":L\"\\u7ee7\\u7eed\",free && replayPlayer.cursor<replayPlayer.moves.size());","        // 暂停；继续；播完了就不能再点继续","    }","    if(!replayPlayer.playing) {","        addButton(A_PREVIOUS,1260,560,220,75,L\"\\u4e0a\\u4e00\\u6b65\",free && replayPlayer.cursor>0);","        // 上一步；上一步 / 下一步","        addButton(A_NEXT,1500,560,220,75,L\"\\u4e0b\\u4e00\\u6b65\",free && replayPlayer.cursor<replayPlayer.moves.size());","        // 下一步；到头了按钮会自动变灰","    }","    if(replayPlayer.cursor==replayPlayer.moves.size()) {","        text(1290,665,L\"\\u64ad\\u653e\\u7ed3\\u675f\\uff0c\\u53ef\\u624b\\u52a8\\u56de\\u770b\",28);","    }     // 播放结束，可手动回看","    addButton(A_REPLAY_EXIT,1330,740,320,80,L\"\\u9000\\u51fa\",free);","    // 退出；退出复盘","    if(dialog==NO_DIALOG) {","        text(1250,860,matchTime(replayRecord.started),26);","        // 显示这一局的开始时间","        if(replayRecord.mode==\"ONLINE\") {","            text(1250,905,replayRecord.version<2?L\"\\u672c\\u673a\\u6267\\u68cb\\uff1a\\u65e7\\u8bb0\\u5f55\\u672a\\u8bb0\\u5f55\":","            replayRecord.human==1?L\"\\u672c\\u673a\\u5f53\\u65f6\\u6267\\u9ed1 \\u00b7 \\u623f\\u4e3b\":L\"\\u672c\\u673a\\u5f53\\u65f6\\u6267\\u767d \\u00b7 \\u670b\\u53cb\",28);","        }","        text(1250,950,reasonText(replayRecord.reason),28);","        // 显示结束原因","        if(!replayRecord.game.result) {","            text(1250,995,L\"\\u672a\\u5b8c\\u590d\\u76d8\\uff0c\\u4e0d\\u53ef\\u7ee7\\u7eed\\u5bf9\\u5c40\",28);","        }","    }","    if(dialog==REPLAY_EXIT) {","        text(1260,885,L\"\\u5df2\\u6682\\u505c\\uff0c\\u662f\\u5426\\u9000\\u51fa\\u590d\\u76d8\\uff1f\",32);","        // 已暂停，是否退出复盘？；询问是否退出复盘","        addButton(A_YES,1260,1000,220,75,L\"\\u662f\");","        addButton(A_NO,1500,1000,220,75,L\"\\u5426\");","        // 是；否；是 / 否","    }","}","// 单机和人机共用：显示结果、轮到谁，或电脑思考中。","void drawLocalStatus() {","    const wchar_t* status;","    if (game.result==1) {","        status = L\"\\u9ed1\\u65b9\\u83b7\\u80dc\";","    } else {","        if (game.result==2) {","            status = L\"\\u767d\\u65b9\\u83b7\\u80dc\";","        } else {","            if (game.result==3) {","                status = L\"\\u672c\\u5c40\\u5e73\\u5c40\";","            } else {","                if (gameMode==\"HUMAN_AI\" && game.turn!=humanStone && dialog!=CHOOSE_COLOR) {","                    status = L\"\\u7535\\u8111\\u601d\\u8003\\u4e2d\\u2026\";","                } else {","                    if (game.turn==1) {","                        status = L\"\\u8f6e\\u5230\\u9ed1\\u65b9\\u843d\\u5b50\";","                    } else {","                        status = L\"\\u8f6e\\u5230\\u767d\\u65b9\\u843d\\u5b50\";","                    }","                }","            }","        }","    }","    // 电脑思考中…；轮到黑方落子；轮到白方落子；轮到黑方或白方","    text(1280,150,status,40);","    // 把状态文字画在右侧面板上","}","// 仅人机：显示难度和玩家执棋颜色。","void drawAIDetails() {","    std::wstring level;","    if (difficulty==0) {","        level = L\"\\u7b80\\u5355\";","    } else {","        if (difficulty==1) {","            level = L\"\\u4e00\\u822c\";","        } else {","
