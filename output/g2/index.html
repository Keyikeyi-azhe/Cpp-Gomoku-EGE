          level = L\"\\u56f0\\u96be\";","        }","    }","    // 简单；一般；困难；三个难度名","    text(1260,202,level+(dialog==CHOOSE_COLOR?L\" \\u00b7 \\u7b49\\u5f85\\u9009\\u8272\":humanStone==1?L\" \\u00b7 \\u4f60\\u6267\\u9ed1\":L\" \\u00b7 \\u4f60\\u6267\\u767d\"),25);","    // · 等待选色； · 你执黑； · 你执白","}","// 单机和人机共用：登记悔棋、重开、退出按钮及其可用状态。","void addLocalGameButtons() {","    bool free=dialog==NO_DIALOG && !game.result;","    addButton(A_UNDO,1290,250,400,80,gameMode==\"HUMAN_AI\"?L\"\\u6094\\u68cb\\uff08\\u64a4\\u56de\\u4e00\\u56de\\u5408\\uff09\":L\"\\u6094\\u68cb\",     // 悔棋（撤回一回合）；悔棋；人机模式要撤回一回合，所以提示文字不同","    free && (gameMode==\"HUMAN_AI\"?lastHumanMove()>=0:!game.moves.empty()));","    // 人机模式下必须玩家真的下过子才允许悔棋","    addButton(A_RESTART,1330,350,320,80,L\"\\u91cd\\u5f00\",free);","    // 重开；重开","    addButton(A_EXIT_GAME,1330,450,320,80,L\"\\u9000\\u51fa\",dialog==NO_DIALOG);","    // 退出；退出对局","}","// 单机和人机共用询问；CHOOSE_COLOR 只在人机开局出现。","void drawLocalDialog() {","    if(dialog==CHOOSE_COLOR) {","        buttons.clear();","        // 选色询问只显示黑、白两个可操作按钮。","        setfillcolor(EGERGB(247,237,202));","        solidroundrect(380,440,1420,860,30);","        // 绘制实心米色圆角面板；本调用没有透明混合参数。","        text(590,490,L\"\\u8bf7\\u9009\\u62e9\\u4f60\\u6267\\u9ed1\\u8fd8\\u662f\\u6267\\u767d\",52);","        // 请选择你执黑还是执白；询问文字","        text(670,580,L\"\\u9ed1\\u68cb\\u5148\\u4e0b\\uff0c\\u767d\\u68cb\\u540e\\u4e0b\",40);","        // 黑棋先下，白棋后下；补充说明谁先下","        addButton(A_BLACK,510,700,320,90,L\"\\u6211\\u6267\\u9ed1\");","        addButton(A_WHITE,970,700,320,90,L\"\\u6211\\u6267\\u767d\");","        // 我执黑；我执白；我执黑 / 我执白","    } else if(dialog!=NO_DIALOG) {","        text(1270,580,game.result?L\"\\u672c\\u5c40\\u5df2\\u7ed3\\u675f\":L\"\\u68cb\\u5c40\\u63d0\\u793a\",40);","        // 本局已结束；棋局提示","        if(dialog==EXIT_SAVE) {","            text(1260,650,L\"\\u662f\\u5426\\u4fdd\\u5b58\\u5f53\\u524d\\u8fdb\\u5ea6\\uff1f\");","        }     // 是否保存当前进度？","        if(dialog==FINISHED_SAVE) {","            text(1260,650,L\"\\u662f\\u5426\\u4fdd\\u5b58\\u672c\\u5c40\\u590d\\u76d8\\uff1f\");","        }     // 是否保存本局复盘？","        if(dialog==AGAIN) {","            text(1260,650,L\"\\u8981\\u4e0d\\u8981\\u518d\\u6765\\u4e00\\u5c40\\uff1f\");","        }     // 要不要再来一局？","        if(dialog==RESTART_CONFIRM) {","            text(1260,650,L\"\\u8fdb\\u5ea6\\u4e0d\\u4f1a\\u88ab\\u4fdd\\u5b58\\u3002\");","            text(1260,695,L\"\\u662f\\u5426\\u91cd\\u5f00\\uff1f\");","        }     // 进度不会被保存。；是否重开？","        if(dialog==NAME_SAVE) {","            // 命名框由原生控件实现，这里只画提示文字","            text(1260,650,L\"\\u8bf7\\u4e3a\\u672c\\u68cb\\u5c40\\u547d\\u540d\\uff1a\");","            text(1260,800,L\"\\u6700\\u591a24\\u5b57\\uff0c\\u652f\\u6301\\u4e2d\\u6587\",28);","            // 请为本棋局命名：；最多24字，支持中文；说明字数限制","            addButton(A_SAVE,1260,900,220,75,L\"\\u4fdd\\u5b58\");","            addButton(A_CANCEL,1500,900,220,75,L\"\\u53d6\\u6d88\");","            // 保存；取消；保存 / 取消","        } else {","            addButton(A_YES,1260,900,220,75,L\"\\u662f\");","            addButton(A_NO,1500,900,220,75,L\"\\u5426\");","            // 是；否；是 / 否","        }","    }","}","// 仅单机双人：状态、操作按钮、当前询问。","void drawLocalPanel() {","    drawLocalStatus();","    addLocalGameButtons();","    drawLocalDialog();","}","// 仅人机：比单机多显示难度与执棋颜色。","void drawAIPanel() {","    drawLocalStatus();","    drawAIDetails();","    addLocalGameButtons();","    drawLocalDialog();","}","// 阅读入口：公共棋盘 -> 公共结果 -> 公共底板 -> 按模式选择显示。","// 联网额外标记归入对应模式；drawOnlineSidebar 定义在 online_ui.h。","void drawGame() {","    bool replay = page == REPLAY_PAGE;","    const LocalGame* shown = &game;","    if (replay) {","        shown = &replayPlayer.board;","    }","    drawBoard(*shown, replay);","    drawGameResult(*shown, replay);","    drawSidebarBase();","    if (replay) {","        if (replayRecord.mode == \"ONLINE\") {","            drawOnlineBoardExtras(*shown, true);","        }","        drawReplayPanel();","    } else if (gameMode == \"ONLINE\") {","        drawOnlineBoardExtras(*shown, false);","        drawOnlineSidebar();","    } else if (gameMode == \"HUMAN_AI\") {","        drawAIPanel();","    } else {","        drawLocalPanel();","    }","}","// 仅主菜单、模式菜单、难度菜单：背景动画和四个选项。","void drawMenuPage(ULONGLONG startedAt) {","    int frame=static_cast<int>(((GetTickCount64()-startedAt)%3000)*30/1000);","    // 当前是第几帧(0 到 89)","    putimage(0,0,frames[frame]);","    // 画出这一帧动画","    int ys[]= {","        476,591,705,821","    };","    // 四个按钮的纵坐标","    int ids[]= {","        A_START,A_CONTINUE,A_REPLAY,A_QUIT","    };","    // 主菜单四个按钮的编号","    for(int i=0;i<4;++i) {","        // 依次添加四个按钮","        int id;","        if (page == MAIN_MENU) {","            id = ids[i];","        } else {","            if (i == 0) {","                id = A_LOCAL;","            }","            else if (i == 1) {","                id = A_AI;","            }","            else if (i == 2) {","                id = A_ONLINE;","            }","            else {","                id = A_BACK;","            }","        }","        const wchar_t* levels[]= {","            L\"\\u7b80\\u5355\",L\"\\u4e00\\u822c\",L\"\\u56f0\\u96be\",L\"\\u8fd4\\u56de\\u4e3b\\u754c\\u9762\"","        };","        // 简单；一般；困难；返回主界面；难度菜单的四个按钮文字","        if(page==DIFFICULTY_PAGE) {","            if(i<3) {","                id=A_EASY+i;","            } else {","                id=A_BACK;","            }","        }      // 难度菜单前三个是难度，第四个是返回","        const wchar_t* label;","        if (page == MAIN_MENU) {","            label = MAIN_LABELS[i];","        }","        else if (page == DIFFICULTY_PAGE) {","            label = levels[i];","        }","        else {","            label = MODE_LABELS[i];","        }","        addButton(id,687,ys[i],441,95,label,id!=0,true);","        // 文字随页面变化：难度菜单 / 主菜单 / 模式菜单","    }","}","// 仅存档/复盘列表：最多八行记录，以及删除确认。","void drawRecordListPage() {","    putimage(0,0,background);","    // 列表页也要铺背景","    setfillcolor(EGERGB(246,241,224));","    solidroundrect(380,100,1420,1250,28);","    // 一个大的米色面板","    text(560,150,page==SAVE_LIST?L\"\\u7ee7\\u7eed\\u6e38\\u620f \\u00b7 \\u672a\\u5b8c\\u6210\\u68cb\\u5c40\":L\"\\u590d\\u76d8 \\u00b7 \\u68cb\\u5c40\\u8bb0\\u5f55\",44);","    // 继续游戏 · 未完成棋局；复盘 · 已完成棋局；标题区分「继续游戏」和「复盘」","    text(510,220,L\"\\u68cb\\u5c40\\u540d\\u79f0\",28);","    text(1080,220,L\"\\u6a21\\u5f0f\",28);","    text(1250,220,L\"\\u64cd\\u4f5c\",28);","    // 棋局名称；模式；操作；三个列表表头","    for(int i=0;i<8 && listOffset+i<static_cast<int>(entries.size());++i) {","        int at=listOffset+i;","        const SavedEntry& entry=entries[at];","        // at是entries内真实下标，i才是当前页自上而下第几行。","        std::wstring label;","        if (entry.name.size()>18) {","            label = entry.name.substr(0,18)+L\"\\u2026\";","        } else {","            label = entry.name;","        }","        // 名称超过18个宽字符代码单元时截断并加省略号。","        addButton(1000+at*2,410,290+i*95,640,80,label,dialog==NO_DIALOG);","        text(1080,316+i*95,entry.mode==\"LOCAL_TWO\"?L\"\\u5355\\u673a\":entry.mode==\"HUMAN_AI\"?L\"\\u4eba\\u673a\":     // 单机；人机；模式列","        entry.mode==\"ONLINE\"?L\"\\u8054\\u7f51\":L\"\\u635f\\u574f\",30);","        if(page==REPLAY_LIST) {","            text(1080,351+i*95,entry.result==1?L\"\\u9ed1\\u80dc\":entry.result==2?L\"\\u767d\\u80dc\":entry.result==3?L\"\\u5e73\\u5c40\":L\"\\u672a\\u5b8c\",22);","        }     // 联网；损坏；复盘列表额外显示胜负结果","        addButton(1001+at*2,1200,290+i*95,180,80,L\"\\u5220\\u9664\",dialog==NO_DIALOG);","        // 删除","    }","    if(entries.empty()) {","        text(730,500,L\"\\u6682\\u65e0\\u5b58\\u6863\",48);","    }     // 暂无存档；一条都没有时显示提示","    text(530,1070,L\"\\u53ef\\u6eda\\u52a8\\u9f20\\u6807\\u6eda\\u8f6e\\u67e5\\u770b\\u5176\\u4ed6\\u68cb\\u5c40\",26);","    // 可滚动鼠标滚轮查看其他棋局；操作说明","    addButton(A_BACK,740,1140,320,80,L\"\\u9000\\u51fa\",dialog==NO_DIALOG);","    // 退出；返回","    if(dialog==DELETE_CONFIRM) {","        buttons.clear();","        setfillcolor(EGERGB(249,232,200));","        solidroundrect(450,430,1350,840,30);","        // 清除底层按钮，仅保留删除确认按钮，并绘制实心确认面板。","        text(650,475,L\"\\u662f\\u5426\\u6c38\\u4e45\\u5220\\u9664\\uff1f\",52);","        // 是否永久删除？；询问文字","        std::wstring name=entries[deleteIndex].name;","        // 显示要删除的棋局名","        text(510,570,name.size()>24?name.substr(0,24)+L\"\\u2026\":name,30);","        // …；名字太长同样截断","        text(560,630,L\"\\u5b58\\u6863\\u6587\\u4ef6\\u5c06\\u88ab\\u5220\\u9664\\uff0c\\u65e0\\u6cd5\\u64a4\\u9500\\u3002\",32);","        // 存档文件将被删除，无法撤销。；强调不可撤销","        addButton(A_YES,570,720,260,80,L\"\\u662f\\uff0c\\u6c38\\u4e45\\u5220\\u9664\");","        addButton(A_NO,970,720,260,80,L\"\\u5426\");","        // 是，永久删除；否；是，永久删除 / 否","    }","}","// 公共临时提示：时间未过期才显示 notice，不修改对局。","void drawNotice() {","    if(GetTickCount64()<noticeUntil) {","        // 提示画在页面下方或右侧，避开棋盘","        int left=(page==GAME_PAGE || page==REPLAY_PAGE)?1235:520;","        // 提示的位置随页面不同而不同","        int top=(page==SAVE_LIST || page==REPLAY_LIST)?20:1100;","        // 在列表页显示在顶部，其他页面显示在下方","        setfillcolor(EGERGB(240,234,208));","        solidroundrect(left,top,left+520,top+100,20);","        // 提示底板","        text(left+20,top+32,notice,26);","        // 提示文字","    }","}","// 总绘图入口：先清空旧按钮，画当前页面，再统一画按钮和临时提示。","void render(ULONGLONG startedAt) {","    buttons.clear();","    if (page == MAIN_MENU || page == MODE_MENU || page == DIFFICULTY_PAGE) {","        drawMenuPage(startedAt);","    } else if (page == NETWORK_PAGE) {","        drawOnlinePage();","    } else if (page == GAME_PAGE || page == REPLAY_PAGE) {","        drawGame();","    } else {","        drawRecordListPage();","    }","    int x = -1;","    int y = -1;","    mousepos(&x, &y);","    drawButtons(x, y);","    drawNotice();","}","#endif"],"match_metadata.h":["// 【本文件阅读路线】存档和联网共用：结束原因、结果合法性、时间文字；不执行落子。","// 【建议阅读 03 / 结果与结束原因】match_metadata.h","// 先区分棋盘推导结果与对局声明结果，再看 EndReason -> validResult。","// reasonText、matchTime 只负责展示文字；认输可有胜者而没有五连。","// 外部接口声明位置：标准库对应的头文件；Win32/Winsock系统头；EGE的graphics.h。","// 头文件保护：首次包含时定义下面的宏，再次包含会跳过本文件，避免同一一次编译处理的源文件及其包含的头文件重复定义。","#ifndef GOMOKU_MATCH_METADATA_H","#define GOMOKU_MATCH_METADATA_H","#include <string>","#include <ctime>","#include <cwchar>","// 【类型 EndReason】棋局结束原因：0未知，1连五，2平局，3认输，4主动退出，5断线，6协商重开。与网络","// 连接的LeaveReason不同；例如认输后拒绝再战，两个原因分别保存。","enum EndReason {","    END_UNKNOWN, END_FIVE, END_DRAW, END_RESIGN, END_QUIT, END_DISCONNECT, END_RESTART","};","// 【函数 validResult】检查棋盘推导结果 boardResult 与记录 result、reason 是否相容。","// 处理步骤：先范围检查；认输要求盘面未结束且一方胜；连五和平局要求吻合；退出/断线/重开要求两结果均","// 为 0；未知原因要求相等。","// 变量含义：boardResult 是按历史重放得到的结果；result 是文件/消息声称的结果；reason 是结束原","// 因。","inline bool validResult(int boardResult,int result,int reason) {","    if(reason<END_UNKNOWN || reason>END_RESTART || result<0 || result>3) {","        return false;","    }      // 先做范围检查：原因或结果只要超出合法区间就判非法；符号 || 读作「或者」","    if(reason==END_RESIGN) {","        return boardResult==0 && (result==1 || result==2);","    }      // 认输：棋盘上没有五连(0)，但确实有一方获胜，所以 result 必须是 1 或 2；符号 && 读作「并且」","    if(reason==END_FIVE) {","        return boardResult==result && (result==1 || result==2);","    }      // 连五获胜：棋盘上的五连结果必须与记录的结果完全对得上，而且必须真有一方赢","    if(reason==END_DRAW) {","        return boardResult==3 && result==3;","    }      // 满盘平局：棋盘判平(3)，记录也必须是平(3)","    if(reason>=END_QUIT) {","        return boardResult==0 && result==0;","    }      // 主动退出、连接中断、协商重开这三种：棋盘上无胜负(0)，也没有记录结果(0)","    return boardResult==result;","    // 其余情况(原因未记录)：只要求棋盘结果与记录结果一致","}","// 【函数 reasonText】将 reason 转成中文宽字符串常量。","// 处理步骤：switch 映射六种已知原因；default 提示旧记录未记录。","inline const wchar_t* reasonText(int reason) {","    switch(reason) {","        // switch 按 reason 的值跳到对应的 case 分支","        case END_FIVE:","        return L\"\\u8fde\\u4e94\\u83b7\\u80dc\";","        // 连五获胜","        case END_DRAW:","        return L\"\\u6ee1\\u76d8\\u5e73\\u5c40\";","        // 满盘平局","        case END_RESIGN:","        return L\"\\u8ba4\\u8f93\\u7ed3\\u675f\";","        // 认输结束","        case END_QUIT:","        return L\"\\u4e3b\\u52a8\\u9000\\u51fa\";","        // 主动退出","        case END_DISCONNECT:","        return L\"\\u8fde\\u63a5\\u4e2d\\u65ad\";","        // 连接中断","        case END_RESTART:","        return L\"\\u534f\\u5546\\u91cd\\u5f00\";","        // 协商重开","        default:return L\"\\u65e7\\u8bb0\\u5f55\\uff1a\\u7ed3\\u675f\\u539f\\u56e0\\u672a\\u8bb0\\u5f55\";","        // 旧记录：结束原因未记录（default 是上面都没匹配时走的分支）","    }","}","// 【函数 matchTime】把 Unix 秒 timestamp 格式化为本机当地时间。","// 处理步骤：0 返回旧档提示；转 time_t；localtime 拆解；失败返回无法显示；swprintf 生成日期时间。","// 变量含义：value 为 time_t；t 为 tm 指针；text[80] 为结果缓冲；tm_year 需加 1900，tm_mon 需","// 加 1。","inline std::wstring matchTime(unsigned long long timestamp) {","    if(!timestamp) {","        return L\"\\u5bf9\\u5c40\\u65f6\\u95f4\\uff1a\\u65e7\\u8bb0\\u5f55\\u672a\\u8bb0\\u5f55\";","    }      // 对局时间：旧记录未记录。0 就表示「从没记过时间」","    std::time_t value=static_cast<std::time_t>(timestamp);","    std::tm* t=std::localtime(&value);","    // 先转成时间类型，再按本机时区拆成年月日时分秒","    if(!t) {","        return L\"\\u5bf9\\u5c40\\u65f6\\u95f4\\uff1a\\u65e0\\u6cd5\\u663e\\u793a\";","    }      // 对局时间：无法显示。localtime 失败时走的备用分支","    wchar_t text[80];","    std::swprintf(text,80,L\"%04d-%02d-%02d %02d:%02d:%02d\",t->tm_year+1900,t->tm_mon+1,t->tm_mday,t->tm_hour,t->tm_min,t->tm_sec);","    return text;","    // 宽字符串会自动转换成 std::wstring 返回","}","#endif"],"record_store.h":["// 【本文件阅读路线】存档共用层：readRecord 读文件 -> parseRecord 校验；writeRecord -> encodeRecord 写文件。保留坏档检查。","// 【建议阅读 04 / 存档】record_store.h","// 先看 GameRecord，再看 encodeRecord 的格式，然后逆向读 parseRecord 的验证过程。","// 最后看 readRecord/writeRecord；读取重放真实落子，写入先自检再用临时文件替换。","// 外部接口声明位置：标准库对应的头文件；Win32/Winsock系统头；EGE的graphics.h。","// 头文件保护：首次包含时定义下面的宏，再次包含会跳过本文件，避免同一一次编译处理的源文件及其包含的头文件重复定义。","#ifndef GOMOKU_RECORD_STORE_H","#define GOMOKU_RECORD_STORE_H","#include <windows.h>","#include <string>","#include <sstream>","#include \"game_logic.h\"","#include \"match_metadata.h\"","// 【类型 GameRecord】存档记录把棋局、名称、模式及元数据打包；game类型见","// 不写入存档正文；replay为真不一定表示已分胜负，联网未完局也保存为复盘。","struct GameRecord {","    // 结构体：把一盘棋的所有信息打包在一起","    std::wstring name, path;","    // name为显示名；path为本机读写路径（本项目调用通常用相对路径），不写入正文。","    std::string mode;","    // mode 对局模式：LOCAL_TWO 单机 / HUMAN_AI 人机 / ONLINE 联网","    int difficulty, human, reason, version;","    // difficulty=0..2；human=1/2；reason见EndReason；version记录读入格式版本。","    unsigned long long started;","    // started 对局开始的 Unix 时间戳(秒)","    bool replay;","    // true为复盘、false为残局；联网未完记录也只能作为复盘保存。","    LocalGame game;","    // game 棋盘与落子历史本体","    // 【函数 GameRecord::GameRecord】创建默认单机记录。","    // 处理步骤：mode=LOCAL_TWO，difficulty=0，human=1，reason 未知，version=4，started=0，replay=false；","    // game 自动构造为空棋盘。","    // 变量含义：默认 version=4 不代表本地写出来是 v4；看 encodeRecord。","    GameRecord():mode(\"LOCAL_TWO\"),difficulty(0),human(1),reason(END_UNKNOWN),version(4),started(0),replay(false) {","    }","};","// 【函数 toUtf8】wstring → UTF-8 string。","// 处理步骤：空串直接返回；第一次 WideCharToMultiByte 问所需字节数，第二次填入已分配 out。","// 变量含义：s 输入；n 目标字节数；out 目标缓冲。","inline std::string toUtf8(const std::wstring& s) {","    if(s.empty()) {","        return \"\";","    }      // 空串直接返回，省去一次系统调用","    int n=WideCharToMultiByte(CP_UTF8,0,s.data(),static_cast<int>(s.size()),NULL,0,NULL,NULL);","    std::string out(n,0);","    WideCharToMultiByte(CP_UTF8,0,s.data(),static_cast<int>(s.size()),&out[0],n,NULL,NULL);","    return out;","    // 转好的 UTF-8 字节串就存在这里并返回","}","// 【函数 fromUtf8】UTF-8 string → wstring；无效 UTF-8 返回空串。","// 处理步骤：用 MB_ERR_INVALID_CHARS 严格测长度；n=0 失败；分配 out 后转换。","// 变量含义：s 输入字节；n 目标宽字符代码单元数；out 转换结果。","inline std::wstring fromUtf8(const std::string& s) {","    if(s.empty()) {","        return L\"\";","    }      // 空串直接返回","    // 语句说明：MB_ERR_INVALID_CHARS要求拒绝无效UTF-8；n为所需宽字符代码单元数。","    int n=MultiByteToWideChar(CP_UTF8,MB_ERR_INVALID_CHARS,s.data(),static_cast<int>(s.size()),NULL,0);","    if(!n) {","        return L\"\";","    }","    std::wstring out(n,0);","    MultiByteToWideChar(CP_UTF8,0,s.data(),static_cast<int>(s.size()),&out[0],n);","    return out;","}","// 【函数 recordDirectories】确保 data、unfinished、replays 三个目录存在。","// 处理步骤：创建失败但“已存在”可接受；再查询属性确认实际是目录。","// 变量含义：dirs 为三个路径；i 为索引；a 为属性位集合。","inline bool recordDirectories() {","    const wchar_t* dirs[]= {","        L\"data\",L\"data\\\\unfinished\",L\"data\\\\replays\"","    };","    for(int i=0;i<3;++i) {","        // 三个目录依次创建","        if(!CreateDirectoryW(dirs[i],NULL) && GetLastError()!=ERROR_ALREADY_EXISTS) {","            return false;","        }","        DWORD a=GetFileAttributesW(dirs[i]);","        if(a==INVALID_FILE_ATTRIBUTES || !(a&FILE_ATTRIBUTE_DIRECTORY)) {","            return false;","        }","    }","    return true;","}","// 【函数 numberLine】读取且校验一行“关键字 整数”；结果写入 value。","// 处理步骤：getline 读整行；istringstream 拆字段；必须 k==key，并且不存在 extra。","// 变量含义：input 输入流；key 期望关键字；value 输出整数引用；line 原行；row 行解析流；k 读到","// 的键；extra 检测多余字段。","inline bool numberLine(std::istream& input,const char* key,int& value) {","    std::string line,k,extra;","    if(!std::getline(input,line)) {","        return false;","    }","    std::istringstream row(line);","    return (row>>k>>value) && k==key && !(row>>extra);","    // 三个条件全满足才算这行合法","}","// 【函数 parseRecord】解析 bytes；replay 指定预期文件类型；全部成功才赋值 output。","// 处理步骤：限制 2 MiB；移除回车；校验头与版本 1..4；读名称与模式；按版本读附加字段；逐步检查手序、","// 棋色并调用 place；最后验证 END、结果、轮次、文件类型。","// 变量含义：normalized 是去回车文本；input 总流；r 临时记录；line/type/extra 当前行、关键字、","// 多余字段；version 为头部版本；head/modeLine/timestamp/number/move 是不同段的解析流；","// size/result/turn/count 为声明的盘宽、结果、回合、手数；stamp 是时间文本；i/index/row/col/stone","// 是第 i 手与它的字段。","// 注意：v4 只允许 ONLINE 复盘；v1 不能是 HUMAN_AI。只接受非零结果的本地复盘；v3/v4 ONLINE","// 允许 result=0。不应误读成所有版本都允许任意模式。","inline bool parseRecord(const std::string& bytes,bool replay,GameRecord& output) {","    if(bytes.size()>2*1024*1024) {","        return false;","    }","    std::string normalized;","    for(size_t i=0;i<bytes.size();++i) {","        if(bytes[i]!='\\r') {","            normalized+=bytes[i];","        }","    }","    std::istringstream input(normalized);","    // 把去掉回车后的内容包成输入流，后面逐行读取","    GameRecord r;","    r.replay=replay;","    // r 是解析中的临时对象；先记下本次读的是不是复盘，供后面分支判断使用","    std::string line,type,extra;","    int version=0;","    if(!std::getline(input,line)) {","        return false;","    }      // 读第一行，连一行都读不到说明文件是空的","    std::istringstream head(line);","    if(!(head>>type>>version) || (head>>extra) || (version!=1 && version!=2 && version!=3 && version!=4) ||","    type!=(replay?\"GOMOKU_LOCAL_REPLAY\":\"GOMOKU_LOCAL_SAVE\")) {","        return false;","    }      // 要求：关键字与类型相符，且版本号在 1 到 4 之间","    if(!std::getline(input,line) || line.substr(0,5)!=\"NAME \") {","        return false;","    }","    r.name=fromUtf8(line.substr(5));","    // 语句说明：name.size计Windows UTF-16代码单元；24并非所有Unicode字符都能按24个计。","    if(r.name.empty() || r.name.size()>24 || r.name.find_first_of(L\"\\t\\r\\n\")!=std::wstring::npos ||","    r.name.find(L'\\0')!=std::wstring::npos || r.name.find_first_not_of(L' ')==std::wstring::npos) {","        return false;","    }","    int size=0,result=0,turn=0,count=0;","    if(!numberLine(input,\"SIZE\",size) || size!=15 || !std::getline(input,line)) {","        return false;","    }      // 要求下一行是 \"SIZE 15\"，也就是确认棋盘尺寸；随后还要再读一行模式行","    std::istringstream modeLine(line);","    // 这一行形如 \"MODE HUMAN_AI\"","    if(!(modeLine>>type>>r.mode) || type!=\"MODE\" || (modeLine>>extra) ||      // 模式必须是三种已知取值之一，否则判为坏档","    (r.mode!=\"LOCAL_TWO\" && r.mode!=\"HUMAN_AI\" && r.mode!=\"ONLINE\")) {","        return false;","    }","    if(version>=2) {","        if(!numberLine(input,\"DIFFICULTY\",r.difficulty) || r.difficulty<0 || r.difficulty>2 ||","        !numberLine(input,\"HUMAN\",r.human) || (r.human!=1 && r.human!=2)) {","            return false;","        }      // 难度只能是 0 到 2；玩家颜色只能是 1(黑) 或 2(白)","    } else if(r.mode==\"HUMAN_AI\") {","        return false;","    }","    r.version=version;","    // 记下版本号，后面几个地方都要按版本决定校验规则","    if(version>=4) {","        if(r.mode!=\"ONLINE\" || !replay) {","            return false;","        }","        if(!numberLine(input,\"REASON\",r.reason) || r.reason<0 || r.reason>END_RESTART || !std::getline(input,line)) {","            return false;","        }      // 结束原因必须在枚举范围内","        std::istringstream timestamp(line);","        std::string stamp;","        if(!(timestamp>>type>>stamp) || type!=\"STARTED\" || (timestamp>>extra) || stamp.empty() ||      // 要求关键字是 STARTED、时间戳全是数字且不太长","        stamp.size()>10 || stamp.find_first_not_of(\"0123456789\")!=std::string::npos) {","            return false;","        }","        std::istringstream number(stamp);","        if(!(number>>r.started) || r.started>7258118400ULL) {","            return false;","        }      // 转成整数并限制上限(约合 2200 年)，防止异常的巨大数字","    }","    if(!numberLine(input,\"RESULT\",result) || !numberLine(input,\"TURN\",turn) ||","    !numberLine(input,\"MOVES\",count) || count<0 || count>225) {","        return false;","    }      // 手数越界就判为坏档","    for(int i=0;i<count;++i) {","        int index,row,col,stone;","        if(!std::getline(input,line)) {","            return false;","        }      // 读这一手那一行；读不到说明手数写多了，文件被截断或篡改","        std::istringstream move(line);","        if(!(move>>type>>index>>row>>col>>stone) || type!=\"MOVE\" || (move>>extra) || index!=i+1 ||","        stone!=r.game.turn || !r.game.place(row,col)) {","            return false;","        }      // 关键一步：game.place 会用真实规则走这一手，不合法它自己就会返回 false","    }","    if(!std::getline(input,line) || line!=\"END\" || (input>>extra)) {","        return false;","    }","    // 语句说明：结果/轮次必须与重放及原因相容；v3及以后ONLINE复盘允许未完结果0。","    if(!validResult(r.game.result,result,r.reason) || (version<4 && r.game.result!=result) || r.game.turn!=turn || (replay ? (result==0 && !(version>=3 && r.mode==\"ONLINE\")) : result!=0)) {","        return false;","    }","    r.game.result=result;","    output=r;","    return true;","    // 校验通过后采用记录声明的结果；认输结果不能由盘面五连直接推出。","}","// 【函数 readRecord】从 path 读文件并解析，成功补 output.path。","// 处理步骤：CreateFileW 打开；检查长度；一次读取且要求实读长度相等；关闭句柄；交 parseRecord。","// 变量含义：replay 为期望类型；f 文件句柄；size 为 LARGE_INTEGER；data 为字节缓冲；got 为实读","// 字节数；ok 汇总成功状态。","inline bool readRecord(const std::wstring& path,bool replay,GameRecord& output) {","    HANDLE f=CreateFileW(path.c_str(),GENERIC_READ,FILE_SHARE_READ,NULL,OPEN_EXISTING,FILE_ATTRIBUTE_NORMAL,NULL);","    if(f==INVALID_HANDLE_VALUE) {","        return false;","    }      // 打开失败(文件不存在、没有权限等)直接返回假","    LARGE_INTEGER size;","    // LARGE_INTEGER 是 Windows 用来表示 64 位长度的类型","    if(!GetFileSizeEx(f,&size) || size.QuadPart<=0 || size.QuadPart>2*1024*1024) {","        CloseHandle(f);","        return false;","    }","    std::string data(static_cast<size_t>(size.QuadPart),0);","    DWORD got=0;","    bool ok=ReadFile(f,&data[0],static_cast<DWORD>(data.size()),&got,NULL)!=0 && got==data.size();","    CloseHandle(f);","    // 读完后立刻关闭句柄","    if(!ok || !parseRecord(data,replay,output)) {","        return false;","    }      // 读取失败或解析失败都算读档失败","    output.path=path;","    return true;","    // 把路径一并记进结果，界面上删除存档时要用到它","}","// 【函数 encodeRecord】将记录 r 编成存档文本。","// 处理步骤：写文件头、名称、SIZE/MODE/难度/颜色；联网加原因与开始时间；写 RESULT/TURN/MOVES；逐手","// 写 MOVE；最后 END。","// 变量含义：out 为字符串输出流；i 为手序下标；m 是这一手的 const 引用。","// 注意：本地写 v2；联网写 v4。它只把数据转成可保存或发送的文本，真正写盘前还要由 writeRecord 调 parseRecord 自检。","inline std::string encodeRecord(const GameRecord& r) {","    std::ostringstream out;","    // ostringstream 是内存里的字符串输出流，可像写文件一样往里追加","    // 语句说明：实际输出版本由mode决定：ONLINE用v4，其余用v2，不直接采用r.version。","    out<<(r.replay?\"GOMOKU_LOCAL_REPLAY \":\"GOMOKU_LOCAL_SAVE \")<<(r.mode==\"ONLINE\"?4:2)<<\"\\n\";","    out<<\"NAME \"<<toUtf8(r.name)<<\"\\nSIZE 15\\nMODE \"<<r.mode<<\"\\nDIFFICULTY \"<<r.difficulty;","    out<<\"\\nHUMAN \"<<r.human;","    // 玩家颜色单独写一行","    if(r.mode==\"ONLINE\") {","        out<<\"\\nREASON \"<<r.reason<<\"\\nSTARTED \"<<r.started;","    }","    out<<\"\\nRESULT \"<<r.game.result<<\"\\nTURN \"<<r.game.turn;","    // 结果与轮到谁","    out<<\"\\nMOVES \"<<r.game.moves.size()<<\"\\n\";","    // 接下来是手数，然后是每一手","    for(size_t i=0;i<r.game.moves.size();++i) {","        const Move& m=r.game.moves[i];","        out<<\"MOVE \"<<i+1<<' '<<m.row<<' '<<m.col<<' '<<m.stone<<\"\\n\";","    }      // 最后用 END 收尾","    out<<\"END\\n\";","    return out.str();","    // str() 取出流里累积的全部文本","}","// 【函数 writeRecord】把 r 安全写入磁盘；overwrite 为空表示创建新文件。","// 处理步骤：建目录；编码后反向解析自检；生成时间名和序号；CREATE_NEW 建同目录 .tmp；写完并刷新；","// MoveFileExW 改为正式名；失败清理临时文件。","// 变量含义：bytes 为编码文本；check 为自检对象；now 为当前本地时间；sequence 为 0..999 避让序","// 号；filename 为文件名缓冲；path 为最终路径；temp 为临时路径；f 为写句柄；written 实写长度；ok 为","// 状态。","// 注意：新记录不会因显示名相同覆盖旧文件；只有显式 overwrite 才替换指定路径。先临时写再替","// 换可避免直接把原档写到一半；仍可能因权限或 I/O 错误失败。","inline bool writeRecord(GameRecord& r,const std::wstring& overwrite=L\"\") {","    if(!recordDirectories()) {","        return false;","    }      // 目录不存在就先建好，建不出来自然写不成功","    // 语句说明：bytes为将写出的文本；check仅用来验证这些文本能被本程序正确读回。","    std::string bytes=encodeRecord(r);","    GameRecord check;","    if(!parseRecord(bytes,r.replay,check)) {","        return false;","    }      // 自检：能解析回来才允许落盘","    SYSTEMTIME now;","    GetLocalTime(&now);","    for(int sequence=0;sequence<1000;++sequence) {","        wchar_t filename[256];","        // filename 用来装拼出来的文件名","        std::swprintf(filename,256,L\"data\\\\%ls\\\\%04d%02d%02d_%02d%02d%02d_%03d_%03d.%ls\",","        r.replay?L\"replays\":L\"unfinished\",now.wYear,now.wMonth,now.wDay,now.wHour,now.wMinute,      // 拼接路径的后续参数：目录名、各项时间数字、序号、扩展名","        now.wSecond,now.wMilliseconds,sequence,r.replay?L\"greplay\":L\"gsave\");","        // %03d 补零 3 位的毫秒和序号；%ls 插入判定出来的扩展名","        std::wstring path=overwrite.empty()?filename:overwrite;","        if(overwrite.empty() && GetFileAttributesW(path.c_str())!=INVALID_FILE_ATTRIBUTES) {","            continue;","        }","        std::wstring temp=path+L\".tmp\";","        // 临时文件放在目标旁；避免直接覆盖原文件后写入失败留下半份数据。","        HANDLE f=CreateFileW(temp.c_str(),GENERIC_WRITE,0,NULL,CREATE_NEW,FILE_ATTRIBUTE_NORMAL,NULL);","        if(f==INVALID_HANDLE_VALUE) {","            if(overwrite.empty() && GetLastError()==ERROR_FILE_EXISTS) {","                continue;","            } return false;","        }","        DWORD written=0;","        // written 会被 WriteFile 填成实际写入的字节数","        bool ok=WriteFile(f,bytes.data(),static_cast<DWORD>(bytes.size()),&written,NULL)!=0 && written==bytes.size();","        // 语句说明：先刷新文件数据，再关闭句柄；刷新失败同样视为保存失败。","        ok=ok && FlushFileBuffers(f);","        CloseHandle(f);","        // 语句说明：有overwrite时才允许替换原路径；新文件不请求覆盖已有目标。","        if(ok) {","            ok=MoveFileExW(temp.c_str(),path.c_str(),MOVEFILE_WRITE_THROUGH|(overwrite.empty()?0:MOVEFILE_REPLACE_EXISTING))!=0;","        }","        if(!ok) {","            DeleteFileW(temp.c_str());","            return false;","        }","        r.path=path;","        return true;","        // 成功则记下路径","    }","    return false;","    // 1000 次都没能写出，返回失败","}","#endif"],"replay_logic.h":["// 【本文件阅读路线】仅复盘：open 载入 -> play/pause 控制 -> tick 按时间推进 -> seek 跳步。不会修改正在进行的 game。","// 【建议阅读 05 / 复盘】replay_logic.h","// 先看成员 cursor/board/moves，再读 open -> seek -> play/pause -> tick -> speed。","// 本对象复制原始历史，不修改原存档；最终结果可能来自认输，不能只靠棋盘重新判胜。","// 外部接口声明位置：标准库对应的头文件；Win32/Winsock系统头；EGE的graphics.h。","// 头文件保护：首次包含时定义下面的宏，再次包含会跳过本文件，避免同一一次编译处理的源文件及其包含的头文件重复定义。","#ifndef GOMOKU_REPLAY_LOGIC_H","#define GOMOKU_REPLAY_LOGIC_H","#include <windows.h>","#include \"game_logic.h\"","// 【类型 ReplayPlayer】复盘播放器。moves是完整历史副本，board是前cursor手对应的展示盘；计时只决定","// 何时推进，不修改原棋局。原始结果放在finalResult，到末尾才恢复，以支持认输等无五连结束。","struct ReplayPlayer {","    std::vector<Move> moves;","    // 这一局完整的落子历史副本","    LocalGame board;","    // 当前播放到第几步时，应该显示出来的棋盘","    size_t cursor;","    // 已经播放的手数0..moves.size，而非最后一手的下标。","    bool started, playing;","    // started:是否点过播放；playing:此刻是否正在自动前进","    int interval, finalResult;","    // interval每手间隔毫秒；finalResult保存源记录结果，到播放末尾再恢复。","    ULONGLONG deadline, remaining;","    // deadline:下一次自动落子的时刻；remaining:暂停时还差多少毫秒","    // 【函数 ReplayPlayer::ReplayPlayer】初始化暂停的空播放器。","    // 处理步骤：cursor=0，started/playing=false，interval/remaining=3000，finalResult/deadline=0；","    // board 自动初始化。","    ReplayPlayer():cursor(0),started(false),playing(false),interval(3000),finalResult(0),deadline(0),remaining(3000) {","    }","    // 【函数 ReplayPlayer::open】从 source 取历史，准备从空盘观看。","    // 处理步骤：复制结果和历史；复位游标/播放标志/速度；清空展示盘；若历史为空，立刻显示 finalResult。","    // 变量含义：source 是只读棋局引用。","    // 注意：零步认输也有终局结果，所以不能要求“至少落一子才显示结果”。","    void open(const LocalGame& source) {","        finalResult=source.result;","        moves=source.moves;","        cursor=0;","        started=false;","        playing=false;","        interval=3000;","        remaining=3000;","        board.reset();","        if(moves.empty()) {","            board.result=finalResult;","        }","    }","    // 【函数 ReplayPlayer::seek】跳到 position 手，超过末尾则夹到总手数。","    // 处理步骤：清空 board，再重放前 cursor 手；到末尾才恢复 finalResult；remaining 设为 interval。","    // 变量含义：position 是目标手数；i 为重放下标。","    // 注意：重放最多 225 手，简单可靠；不会删除 source 的历史。seek 自己不改 playing/deadline，","    // 上层只在暂停单步，tick 则会重新设 deadline。","    void seek(size_t position) {","        cursor=position>moves.size()?moves.size():position;","        // ?: 是「三目运算符」：条件为真取问号后的值，为假取冒号后的值；这里是防止 position 超出范围","        board.reset();","        for(size_t i=0;i<cursor;++i) {","            board.place(moves[i].row,moves[i].col);","        }       // 以空盘重放前cursor手；最多225手，易于保持历史与盘面一致。","        if(cursor==moves.size()) {","            board.result=finalResult;","        }       // 如果已经播到最后一手，就把终局结果也放上棋盘，让界面显示出胜负","        remaining=interval;","        // 倒计时复位，下一步仍要等满一个间隔","    }","    // 【函数 ReplayPlayer::pause】暂停并保留还需等待的时间。","    // 处理步骤：若正在播，remaining=max(deadline-now,0)；playing=false。","    // 变量含义：now 为调用者传入的当前毫秒。","    void pause(ULONGLONG now) {","        if(playing) {","            remaining=deadline>now?deadline-now:0;","        }       // 只在「正在播放」时才计算剩余时间，避免把已暂停的状态算错","        playing=false;","        // 置为未播放状态","    }","    // 【函数 ReplayPlayer::play】从剩余倒计时开始/继续自动播放。","    // 处理步骤：已到末尾就返回；否则 started/playing=true；deadline=now+remaining。","    // 变量含义：now 为当前毫秒。","    void play(ULONGLONG now) {","        if(cursor>=moves.size()) {","            return;","        }       // 已经到末尾了，没有可播的内容，直接返回","        started=true;","        playing=true;","        deadline=now+remaining;","        // 标记为「已开始播放」并进入播放状态；把下一次落子定在「现在 + 剩余时间」之后","    }","    // 【函数 ReplayPlayer::speed】改变一手间隔 milliseconds。","    // 处理步骤：记住 active；pause；把 remaining 按新旧 interval 比例缩放；写新 interval；原先在播放就","    // 恢复。","    // 变量含义：active 保存原 playing；now 当前毫秒。","    // 注意：调用者只传 3000 或 1500；函数本身没有检查零或负间隔。","    void speed(int milliseconds,ULONGLONG now) {","        bool active=playing;","        pause(now);","        // 先记住原状态并暂停，改完速度后再决定要不要恢复播放","        remaining=remaining*milliseconds/interval;","        interval=milliseconds;","        // 按剩余时间比例换算；调用方保证milliseconds>0、原interval>0。","        if(active) {","            play(now);","        }       // 之前正在播放的话，用新速度接着播","    }","    // 【函数 ReplayPlayer::tick】主循环每帧调用，按时自动前进一步。","    // 处理步骤：仅在 playing 且 now>=deadline 且未到末尾时 seek(cursor+1)；下次 deadline=now+interval；","    // 到末尾停止。","    // 变量含义：now 当前毫秒。","    // 注意：每次 tick 最多一手；卡顿后不会 while 循环补播所有错过的手。","    void tick(ULONGLONG now) {","        if(playing && now>=deadline && cursor<moves.size()) {","            seek(cursor+1);","            deadline=now+interval;","            // 一次tick最多推进一手；即使本帧迟到，也不会连续补播所有错过的手。","            if(cursor==moves.size()) {","                playing=false;","            }       // 播到最后一手了，自动停止播放","        }","    }","};","#endif"],"ai_engine.h":["// 【本文件阅读路线】仅人机底层：AIWorker 管理计算线程，AIEngine 评分和搜索。界面入口是 game_actions.h 的 updateAI。","// 【建议阅读 06 / AI 与工作线程】ai_engine.h","// AIPoint/AIEntry -> AISearch::choose -> candidates/pointScore -> search -> put。","// 最后看 AIWorker，再回 main.cpp 的 cancelAI/updateAI；区分完成搜索与允许采用答案。","// 外部接口声明位置：标准库对应的头文件；Win32/Winsock系统头；EGE的graphics.h。","// 头文件保护：首次包含时定义下面的宏，再次包含会跳过本文件，避免同一一次编译处理的源文件及其包含的头文件重复定义。","#ifndef GOMOKU_AI_ENGINE_H","#define GOMOKU_AI_ENGINE_H","#include <windows.h>","#include <algorithm>","#include <vector>","#include <string>","#include <cstdlib>","#include \"game_logic.h\"","// 【类型 AIPoint】AI候选落点。row/col为0..14，非法答案常用-1；score是启发排序分，choose返回时未必","// 是最终递归分数。","struct AIPoint {","    int row,col;","    long long score;","};","inline bool higherPointScoreFirst(const AIPoint& a, const AIPoint& b) {","    return a.score > b.score;","}","// 【类型 AIEntry】困难档已计算局面的记录表的一条缓存。key为含轮次的局面键；score为缓存值；depth为搜索深度；","// flag=0精确值/1下界/2上界；point为row*15+col最佳点。","struct AIEntry {","    unsigned long long key;","    long long score;","    int depth,flag,point;","    // key局面键；score搜索结论；depth已搜索深度；flag=0精确/1下界/2上界；point压平落点。","    // 【函数 AIEntry::AIEntry】初始化一个未使用的已计算局面的记录表槽。","    // 处理步骤：key/score/flag=0，depth=-1，point=-1。","    // 变量含义：depth=-1 使默认条目不能满足正常深度命中条件。","    AIEntry():key(0),score(0),depth(-1),flag(0),point(-1) {","    }","};","// 【类型 AISearch】一次AI思考的搜索器，持有独立LocalGame副本。public以前的成员默认private；choose","// 是选点入口，completedDepth供观察完整完成的深度。它不调用图形API，也不直接修改客户端全局game。","class AISearch {","    LocalGame board;","    // 自己那份棋盘副本，在上面随便试子不会影响真正的对局","    int level,limit;","    // level 难度 0-2；limit 是普通候选点最多保留多少个","    volatile LONG* cancel;","    // 指向有效取消标志的地址；通过Interlocked操作访问，volatile本身不是完整同步机制。","    ULONGLONG deadline;","    // 本次思考的截止时刻(毫秒)","    bool interrupted;","    // 一旦被打断就置真，后面所有循环看到它都尽快退出","    unsigned int randomState;","    // 由计算公式生成的随机数的当前状态","    unsigned long long hash,zobrist[15][15][3];","    // hash 是当前局面的识别码；zobrist 是每个「格子和颜色」对应的随机数","    std::vector<AIEntry> table;","    // 已计算局面的记录表本体，只有困难档才启用","    long long history[2][225];","    // 颜色下标stone-1；落点下标r*15+c；发生跳过不值得继续计算的路线时累加depth*depth，不是简单次数。","    static const long long WIN=1000000000000LL;","    // 检查取消标志和时间：用户取消或超过时间预算，就把 interrupted 设为 true。","    // cancel 指向取消标志；deadline 是截止时间。InterlockedCompareExchange 用来安全读取其他线程可能修改的标志。","    //","    //","    //","    //","    bool stopped() {","        if(InterlockedCompareExchange(cancel,0,0) || GetTickCount64()>=deadline) {","            interrupted=true;","        }      // 任一条件成立就标记为已打断","        return interrupted;","    }","    // 按固定公式更新 randomState，得到一个随机数；简单难度用它从几个接近的好位置中选一个。","    //","    //","    //","    //","    unsigned int random() {","        randomState^=randomState<<13;","        randomState^=randomState>>17;","        randomState^=randomState<<5;","        // 三次移位异或，是 xorshift 的核心步骤","        return randomState;","    }","    // 在 AI 自己的棋盘副本上试着放棋子；stone=0 表示撤掉。真实游戏棋盘不会改变。","    // 同时更新 hash（棋盘识别码），方便困难难度查找算过的局面；不修改 turn、moves、result。","    //","    //","    //","    void put(int r,int c,int stone) {","        int old=board.cells[r][c];","        // 先看看这格原来是什么子","        if(old) {","            hash^=zobrist[r][c][old];","        }      // 如果有子，先把它的随机数异或掉，相当于抹掉这一格的影响","        board.cells[r][c]=stone;","        // 放入新子","        if(stone) {","            hash^=zobrist[r][c][stone];","        }      // 再异或新子的随机数，加上它的影响；异或两次等于抵消，所以撤子同理","    }","    // 假设在 (r,c) 放 stone 色棋子，检查横、竖、两条斜线，每条线看前后各5格。","    // X 表示同色棋子，. 表示空格，# 表示对方或边界。每条线取匹配到的最强棋形分，再把4条线相加。","    // 五连1亿、活四100万、冲四10万、活三1万、眠三1000、活二100、普通二连10；这是经验分，不是胜率。","    //","    //","    //","    //","    long long pointScore(int r,int c,int stone) {","        static const int dir[4][2]= {","            {","                1,0","            }, {","                0,1","            }, {","                1,1","            }, {","                1,-1","            }","        };","        // (行增量,列增量)：竖直、水平、右下斜线、左下斜线；负k负责另一端。","        long long sum=0;","        // 四条线的分数累加在这里","        for(int d=0;d<4;++d) {","            // 逐一处理四个方向","            std::string line;","            // 这一条线的局部字符串","            for(int k=-5;k<=5;++k) {","                // 从中心第 -5 格取到第 +5 格，共 11 格","                int x=r+k*dir[d][0],y=c+k*dir[d][1];","                // 把相对偏移 k 换算成棋盘上的绝对坐标","                if(!k) {","                    line+='X';","                }      // k 等于 0 就是中心点，也就是这一手的落点，记作 X","                else if(x<0 || x>=15 || y<0 || y>=15) {","                    line+='#';","                }      // 越出棋盘边界的格子记作井号，表示「此路不通」","                else {","                    line+=board.cells[x][y]==stone?'X':board.cells[x][y]==0?'.':'#';","                }      // 否则看那一格：是自己就记 X，是空就记点号，是对方就记井号","            }","            // 【阅读提示】每条11格线按从强到弱的else-if选一个分档，再将四方向相加。","            // 【阅读提示】find在整段内匹配，未强制棋型经过中心；因此这是按棋形和经验打分的评分，不是严格棋型证明。","            long long value=0;","            if(line.find(\"XXXXX\")!=std::string::npos) {","                value=100000000;","            }","            else if(line.find(\".XXXX.\")!=std::string::npos) {","                value=1000000;","            }","            else if(line.find(\"XXXX.\")!=std::string::npos || line.find(\".XXXX\")!=std::string::npos ||","            line.find(\"XXX.X\")!=std::string::npos || line.find(\"XX.XX\")!=std::string::npos ||","            line.find(\"X.XXX\")!=std::string::npos) {","                value=100000;","            }","            else if(line.find(\".XXX.\")!=std::string::npos || line.find(\".XX.X.\")!=std::string::npos ||","            line.find(\".X.XX.\")!=std::string::npos) {","                value=10000;","            }","            else if(line.find(\"XXX.\")!=std::string::npos || line.find(\".XXX\")!=std::string::npos ||","            line.find(\"XX.X\")!=std::string::npos || line.find(\"X.XX\")!=std::string::npos) {","                value=1000;","            }","            else if(line.find(\".XX.\")!=std::string::npos || line.find(\".X.X.\")!=std::string::npos) {","                value=100;","            }","            else if(line.find(\"XX.\")!=std::string::npos || line.find(\".XX\")!=std::string::npos) {","                value=10;","            }","            sum+=value;","            // 把这条线的得分累加起来","        }","        return sum;","        // 四条线的总分就是这一手的评分","    }","    // 选出当前值得试下的位置：能直接赢的位置优先；否则优先堵住对方下一手能赢的位置。","    // 普通位置必须在已有棋子周围2格以内，按 自己棋形分*10+对方棋形分*11 排序。","    // 普通候选点简单/中等最多12个，困难最多16个；直接赢和必须堵的位置不受这个数量限制。空棋盘选中心(7,7)。","    // preferred 是以前计算推荐的位置编号，-1表示没有推荐；困难还用 history 调整试下顺序。","    //","    //","    //","    std::vector<AIPoint> candidates(int stone,int preferred=-1) {","        std::vector<AIPoint> wins,blocks,normal;","        // 分三类收集：能直接赢的点、必须挡的点、普通候选点","        bool occupied=false;","        // occupied 用来判断棋盘上是否已经有子","        for(int r=0;r<15;++r) {","            for(int c=0;c<15;++c) {","                if(board.cells[r][c]) {","                    occupied=true;","                }","            }","        }","        if(!occupied) {","            AIPoint center= {","                7,7,0","            };","            normal.push_back(center);","            return normal;","        }      // 空棋盘的第一手：没有参考，就直接下在正中央(7,7)","        for(int r=0;r<15;++r) {","            if(stopped()) {","                return normal;","            }","            for(int c=0;c<15;++c) {","                if(!board.cells[r][c]) {","                    // 只考察空位","                    put(r,c,stone);","                    bool win=board.wins(r,c);","                    put(r,c,3-stone);","                    // 先试自己能否赢，再把同一位置换成对方颜色；put同步更新hash。","                    bool block=board.wins(r,c);","                    put(r,c,0);","                    // 测试对方在该点能否赢，随后立刻撤回到空格。","                    AIPoint p= {","                        r,c,0","                    };","                    // 本候选初始score=0；普通候选稍后打分，wins/blocks保留此初值。","                    if(win) {","                        wins.push_back(p);","                    }      // 能直接赢的点单独收集","                    if(block) {","                        blocks.push_back(p);","                    }      // 必须防的点单独收集","                    bool nearby=false;","                    for(int x=std::max(0,r-2);x<=std::min(14,r+2) && !nearby;++x)      // 在这个点周围 5 格见方的范围里找有没有已有棋子","                    {","                        for(int y=std::max(0,c-2);y<=std::min(14,c+2);++y)","                        {","                            if(board.cells[x][y]) {","                                nearby=true;","                                break;","                            }","                        }","                    }      // 找到一颗就认为这个点「有邻居」，可以留作候选","                    if(!nearby) {","                        continue;","                    }      // 周围空荡荡的点直接跳过，节省计算量","                    // 语句说明：普通候选分=自己棋型*10+对方棋型*11；稍偏防守，直接成五仍优先。","                    p.score=pointScore(r,c,stone)*10+pointScore(r,c,3-stone)*11;","                    if(level==2) {","                        p.score+=history[stone-1][r*15+c];","                    }","                    // 语句说明：把缓存最佳点优先排序；不是把这个加分当成真实获胜分。","                    if(r*15+c==preferred) {","                        p.score+=WIN/2;","                    }","                    normal.push_back(p);","                    // 这个点加入普通候选","                }","            }","        }","        // 【阅读提示】返回优先级：直接赢 > 对方一步赢的堵点 > 普通近邻候选；堵点多不代表一手能全挡住。","        if(!wins.empty()) {","            return wins;","        }      // 有能一步取胜的点，其它一概不考虑，直接返回","        if(!blocks.empty()) {","            return blocks;","        }      // 没有取胜点，但有必须挡的点，也只考虑这些","        // 语句说明：lambda比较两个AIPoint的score，按从大到小排列；只对normal排序。","        std::sort(normal.begin(),normal.end(),higherPointScoreFirst);","        if(static_cast<int>(normal.size())>limit) {","            normal.resize(limit);","        }      // 普通候选太多时截断，只保留评分最高的若干个","        return normal;","    }","    // 搜索到最后一层时，遍历棋盘，计算 自己已有棋子的棋形分总和-对方的棋形分总和。","    // 同一棋形可能被多颗棋子重复计分，所以它只是比较局面好坏的经验分。stone 是本次评分站在哪一方看。","    //","    //","    long long evaluate(int stone) {","        long long value=0;","        // 累加的总分","        for(int r=0;r<15;++r) {","            for(int c=0;c<15;++c) {","                if(board.cells[r][c]) {","                    int s=board.cells[r][c];","                    value+=(s==stone?1:-1)*pointScore(r,c,s);","                    // 自己的棋加正分，对方的棋加负分，代数和就是当前局势的优劣","                }","            }","        }","        return value;","    }","    // 在棋盘副本上轮流模拟双方下棋：试放一颗→判断五连→继续算对方的应对→撤掉这一颗。","    // depth 是还要模拟几层；一层代表落一颗。depth=0 时调用 evaluate 给局面打分。","    // 对方的好局面对自己是坏局面，所以递归返回值前取负号；3-stone 在黑1和白2之间切换。","    // alpha 是本层已找到的较好分数；beta 是上层给的停止界限。alpha>=beta 时，这条路线不必再算。","    // ply 是从开始搜索起已经走了几层。获胜分 WIN-ply 让更快获胜的路线分数更高。困难会记录算过的局面，减少重复计算。","    //","    //","    //","    //","    long long search(int stone,int depth,long long alpha,long long beta,int ply) {","        if(stopped()) {","            return 0;","        }      // 一开始就检查是否该中止，避免白算","        if(!depth) {","            return evaluate(stone);","        }      // 深度用尽，改用静态评分估计局势","        long long oldAlpha=alpha,oldBeta=beta;","        // 先把进来的 alpha、beta 存一份，后面写已计算局面的记录表时要用到","        unsigned long long key=hash^(stone==1?0x9e3779b97f4a7c15ULL:0x123456789abcdef0ULL);","        // 把「当前该谁下」也并进识别码；同一棋盘但轮次不同，是两个不同局面","        AIEntry* entry=level==2?&table[key%table.size()]:NULL;","        // 只有困难档查已计算局面的记录表；NULL 表示不启用","        int preferred=-1;","        // 缓存记录里的最佳点；-1表示无推荐，不保证一定来自紧邻的上一轮。","        if(entry && entry->key==key) {","            preferred=entry->point;","            // 只要完整key命中就可借最佳点排序；是否能采用缓存分数要再看depth。","            if(entry->depth>=depth) {","                // 缓存搜索深度足够，才根据flag使用其分数或边界。","                if(entry->flag==0) {","                    return entry->score;","                }      // 精确值：结论可以直接用，省掉整棵子树的搜索","                if(entry->flag==1) {","                    alpha=std::max(alpha,entry->score);","                }      // 只知道「不低于这个分」，可以据此收紧 alpha","                else {","                    beta=std::min(beta,entry->score);","                }      // 只知道「不高于这个分」，可以据此收紧 beta","                if(alpha>=beta) {","                    return entry->score;","                }      // 收紧后如果区间已经无效，同样可以直接采用这个结论","            }","        }","        std::vector<AIPoint> points=candidates(stone,preferred);","        if(interrupted || points.empty()) {","            return 0;","        }      // 被中途取消、或者根本没有可选点，返回 0 交给上层处理","        long long best=-WIN;","        int bestPoint=-1;","        // best 记录目前最好的分数；bestPoint 记录对应的落点","        for(size_t i=0;i<points.size();++i) {","            if(stopped()) {","                return 0;","            }      // 每个候选点开始前检查一次是否该中止","            const AIPoint& p=points[i];","            put(p.row,p.col,stone);","            // 把这一子放上棋盘开始推演","            // 语句说明：换对手视角后分数取负，窗口也反向；已成五则用WIN-ply偏好更早获胜。","            long long score=board.wins(p.row,p.col)?WIN-ply:-search(3-stone,depth-1,-beta,-alpha,ply+1);","            put(p.row,p.col,0);","            // 包括取消和超时出口都先撤回试落子。","            if(interrupted) {","                return 0;","            }      // 递归过程中被取消，立刻返回","            if(score>best) {","                best=score;","                bestPoint=p.row*15+p.col;","            }      // 这一步比目前最好的还好，就更新记录","            alpha=std::max(alpha,score);","            // alpha 是「我至少能拿到这么多」，所以取较大者","            // 语句说明：窗口已足够证明这条分支无需继续；困难档增加该点的历史排序奖励。","            if(alpha>=beta) {","                if(level==2) {","                    history[stone-1][p.row*15+p.col]+=depth*depth;","                }","                break;","            }","        }","        if(entry) {","            entry->key=key;","            entry->score=best;","            entry->depth=depth;","            entry->point=bestPoint;","            // 语句说明：依据进入本层时的原始窗口记录上界、下界或精确值。","            entry->flag=best<=oldAlpha?2:best>=oldBeta?1:0;","        }","        return best;","        // 返回这一层的分数给上一层","    }","    public:","    // 语句说明：公开的观测值：最后完整完成的一轮深度；中断轮次不计入。","    int completedDepth;","    // 建立一次AI思考任务：复制真实棋盘，并设置难度、候选数量和截止时间。","    // difficulty=0简单、1中等、2困难。普通候选上限12/12/16，时间预算500/500/2000毫秒。","    // history 先清零；给每个位置和颜色生成识别数字，用它们算出棋盘识别码。困难另准备65536条局面记录。","    //","    //","    //","    //","    AISearch(const LocalGame& source,int difficulty,volatile LONG* stop,unsigned int seed=1234567):","    board(source),level(difficulty),limit(difficulty==2?16:12),cancel(stop),","    deadline(GetTickCount64()+(difficulty==2?2000:500)),interrupted(false),randomState(seed?seed:1),hash(0),completedDepth(0) {","        // 各项成员的初值：难度决定候选上限和时间预算","        std::memset(history,0,sizeof(history));","        // 历史启发表清零","        for(int r=0;r<15;++r) {","            for(int c=0;c<15;++c) {","                for(int s=1;s<=2;++s) {","                    zobrist[r][c][s]=(static_cast<unsigned long long>(random())<<32)|random();","                    // 64 位随机数由两次 32 位随机数拼成","                    if(board.cells[r][c]==s) {","                        hash^=zobrist[r][c][s];","                    }      // 如果盘面上已经有子，就把它们的贡献并入初始识别码","                }","            }","        }","        if(level==2) {","            table.resize(65536);","        }      // 困难档才分配已计算局面的记录表空间，65536 条","    }","    // AI选位置的总入口：先准备备用空位，再调用 candidates 选出值得考虑的位置。","    // 直接能赢或只剩一个候选位置时立即返回。简单难度从最多3个达到最高分90%的正分候选位置中随机选。","    // 中等从1层算到最多4层，困难从1层算到最多8层；每层用 search 比较所有候选位置。","    // 时间不足或被取消时，使用上一次完整算完的结果；completedDepth 记录完整算完的层数。","    //","    //","    //","    //","    AIPoint choose() {","        AIPoint fallback= {","            -1,-1,0","        };","        if(board.result) {","            return fallback;","        }      // 棋局已经结束，返回空着法","        for(int r=0;r<15 && fallback.row<0;++r) {","            for(int c=0;c<15;++c)","            {","                if(!board.cells[r][c]) {","                    fallback.row=r;","                    fallback.col=c;","                    break;","                }","            }","        }      // 记下第一个空位作为备用着法","        if(fallback.row<0) {","            return fallback;","        }      // 连一个空位都没有，棋盘下满了","        std::vector<AIPoint> root=candidates(board.turn);","        // 生成电脑当前准备落子的这一层的候选着法列表","        if(root.empty()) {","            return fallback;","        }      // 没有候选点，只能用备用着法","        fallback=root[0];","        if(interrupted) {","            return fallback;","        }      // 以返回候选的首点作备用；只有完成的normal列表才经过评分排序。","        put(fallback.row,fallback.col,board.turn);","        bool immediate=board.wins(fallback.row,fallback.col);","        // 试一下这个点能不能直接连成五子","        put(fallback.row,fallback.col,0);","        // 试完还原","        if(immediate || root.size()==1) {","            return fallback;","        }      // 能一步取胜、或者只剩一个可选点，就不必再深搜了","        if(level==0) {","            int count=1;","            // count 是要参与随机的候选个数，从 1 开始","            while(count<3 && count<static_cast<int>(root.size()) && root[count].score>0 &&      // 条件依次是：最多取 3 个、不能超出候选总数、分数必须为正、且不能比最高分差太多","            root[count].score*10>=root[0].score*9) {","                ++count;","            }      // 满足就再多纳入一个候选","            return root[random()%count];","            // 在这几个「好但略有差别」的点里随机选一个，让电脑走棋有变化","        }","        // 【阅读提示】先算1层，再逐层增加深度：每轮从1层往上加；只有遍历完全部根候选才提交next。","        // 【阅读提示】timeout/cancel中断当前轮时沿用此前完整轮次结果，不采用半轮比较。","        for(int depth=1;depth<=(level==2?8:4);++depth) {","            long long best=-WIN;","            AIPoint next=fallback;","            // best重置为负胜分；next先沿用已有落点，本轮完整完成后才提交它。","            for(size_t i=0;i<root.size();++i) {","                if(stopped()) {","                    break;","                }","                AIPoint p=root[i];","                put(p.row,p.col,board.turn);","                // 把电脑当前准备落子的这一层这一手放上棋盘","                long long value=board.wins(p.row,p.col)?WIN:-search(3-board.turn,depth-1,-WIN,WIN,1);","                // 根的各候选均用完整[-WIN,WIN]窗口搜索；根循环没有共享递增alpha。","                put(p.row,p.col,0);","                // 试完还原","                if(interrupted) {","                    break;","                }      // 被取消就中止本轮","                if(value>best) {","                    best=value;","                    next=p;","                }      // 找到更好的着法就更新","            }","            if(interrupted) {","                break;","            }      // 本轮被取消，那就继续用上一轮完成的结果，不更新","            fallback=next;","            completedDepth=depth;","            // 本轮完整搜完，更新最佳着法和已完成深度","            for(size_t i=0;i<root.size();++i) {","                if(root[i].row==next.row && root[i].col==next.col) {","                    std::swap(root[0],root[i]);","                    break;","                    // 把这个点换到列表首位","                }","            }","            if(best>WIN/2) {","                break;","            }      // 当前受候选裁剪和评分约束的搜索已返回接近胜分，提前结束迭代。","        }","        return fallback;","    }","};","// 【类型 AIWorker】搜索线程的管理者。主线程先填snapshot，再启动run；后台只写answer，主线程确认线程","// 结束后通过take取走。generation让上层判断结果是否属于当前棋局。","struct AIWorker {","    HANDLE thread;","    volatile LONG cancelled;","    // 线程句柄；cancelled 是给搜索看的取消标志","    // 语句说明：snapshot棋盘副本；difficulty难度；generation任务版本；answer线程计算结果。","    LocalGame snapshot;","    int difficulty,generation;","    AIPoint answer;","    // 【函数 AIWorker::AIWorker】建立尚未启动的工作器。","    // 处理步骤：thread=NULL，cancelled=0，difficulty/generation=0；snapshot 自动初始化。","    // 变量含义：answer 未显式初始化，但只在成功创建的线程结束并写出结果后由 take 使用。","    AIWorker():thread(NULL),cancelled(0),difficulty(0),generation(0) {","    }      // 初始没有线程，标志清零","    // 【函数 AIWorker::run】CreateThread 调用的静态入口，返回 DWORD 0。","    // 处理步骤：把 context 转为 self；用当时状态的副本、难度、取消地址、时钟种子建 AISearch search；choose 结果","    // 写入 answer。","    // 变量含义：context 是传入的 this；self 为 AIWorker*；search 为本次搜索对象。","    static DWORD WINAPI run(void* context) {","        AIWorker* self=static_cast<AIWorker*>(context);","        // 取出 AIWorker 自身","        AISearch search(self->snapshot,self->difficulty,&self->cancelled,static_cast<unsigned int>(GetTickCount64()));","        // 把snapshot复制给AISearch；取消标志是共享地址，随机种子取当前时钟。","        self->answer=search.choose();","        return 0;","        // 开始搜索，结果写进 answer","    }","    // 【函数 AIWorker::cancel】发出定期检查是否应该停止的取消请求。","    // 处理步骤：InterlockedExchange 把 cancelled 设1；不强制杀线程，也不立即关闭句柄。","    void cancel() {","        InterlockedExchange(&cancelled,1);","    }      // 请求取消：把标志置 1，搜索循环很快就会发现","    // 【函数 AIWorker::start】为 game 启动 level 难度、gen 版本的任务；返回创建是否成功。","    // 处理步骤：已有 thread 就失败；复制 game；存参数；原子清取消标志；CreateThread(run,this)。","    // 变量含义：game 是输入只读引用；level/gen 为任务参数。","    bool start(const LocalGame& game,int level,int gen) {","        if(thread) {","            return false;","        }      // 句柄未回收前拒绝重用；线程可能已结束但take尚未领取结果。","        snapshot=game;","        difficulty=level;","        generation=gen;","        InterlockedExchange(&cancelled,0);","        // 复制一份当前棋盘作为当时状态的副本，并清空取消标志","        thread=CreateThread(NULL,0,run,this,0,NULL);","        return thread!=NULL;","        // 创建线程；返回句柄表示成功","    }","    // 【函数 AIWorker::take】尝试取结果，经 point、gen 输出；未完成返回 false。","    // 处理步骤：WaitForSingleObject(thread,0) 非阻塞检查；确认完成后复制 answer/generation；关句柄并置","    // NULL。","    // 变量含义：point/gen 是输出引用。","    // 注意：线程已经完成也仍可能是被取消或旧棋局的结果；接受与否由 updateAI 的额外条件决定。","    bool take(AIPoint& point,int& gen) {","        if(!thread || WaitForSingleObject(thread,0)!=WAIT_OBJECT_0) {","            return false;","        }      // 线程还没结束就返回假，表示结果尚未就绪","        point=answer;","        gen=generation;","        CloseHandle(thread);","        thread=NULL;","        return true;","        // 结果已就绪：取走落点、取走代号，并回收线程","    }","    // 【函数 AIWorker::shutdown】程序退出时彻底收尾。","    // 处理步骤：cancel；若有线程则无限等待实际结束，再关句柄清NULL。","    // 变量含义：等待期间不会继续该调用者的正常工作，适合退出清理。","    void shutdown() {","        cancel();","        if(thread) {","            WaitForSingleObject(thread,INFINITE);","            CloseHandle(thread);","            thread=NULL;","        }","    }","};","#endif"],"network_protocol.h":["// 【本文件阅读路线】仅联网规则：NetState 保存由服务器确认的游戏状态、处理操作；netEncode/netDecode 转换网络消息。","// 【建议阅读 07 / 网络规则根据当前阶段决定下一步的流程】network_protocol.h","// NetPhase/LeaveReason -> NetState成员 -> start/apply -> netEncode/netDecode。","// 座位0/1对应棋色1/2；服务端裁决，客户端收到当时状态的副本后才更新显示盘。","// 外部接口声明位置：标准库对应的头文件；Win32/Winsock系统头；EGE的graphics.h。","// 头文件保护：首次包含时定义下面的宏，再次包含会跳过本文件，避免同一一次编译处理的源文件及其包含的头文件重复定义。","#ifndef GOMOKU_NETWORK_PROTOCOL_H","#define GOMOKU_NETWORK_PROTOCOL_H","#include <sstream>","#include <string>","#include \"game_logic.h\"","#include \"match_metadata.h\"","// 【类型 NetPhase】房间阶段：N_LOBBY=0等待室；N_PLAY=1对局；N_SELF=2发起者自己确认；N_PEER=3对方确","// 认；N_FINISH=4终局保存/再战；N_RESTART=5双方同意重开后处理保存；N_CLOSED=6关闭。","enum NetPhase {","    N_LOBBY, N_PLAY, N_SELF, N_PEER, N_FINISH, N_RESTART, N_CLOSED","};","// 【类型 LeaveReason】连接离开原因：0无，1朋友离开等待室，2房主关房，3退出对局，4拒绝再战，5取消已","// 提交的等待，6掉线。不能与EndReason的同值数字混用。","enum LeaveReason {","    LEAVE_NONE, LEAVE_LOBBY, LEAVE_HOST, LEAVE_QUIT, LEAVE_DECLINE, LEAVE_CANCEL, LEAVE_DROP","};","// 【类型 NetState】房间的规则状态，服务端是权威；客户端只保存收到的副本。game见","// 位数组描述同一盘棋的两名玩家，不是两盘棋。","struct NetState {","    LocalGame game;","    // 棋盘与落子历史","    // 语句说明：round局号；phase阶段；owner发起座位0/1；kind请求1..4；question问答号；reason棋局结束原","    // 因。","    int round,phase,owner,kind,question,reason;","    int leaveReason,leaver,exitSerial,saveStage[2];","    // leaveReason连接离开原因；leaver离开座位；exitSerial离开流水；saveStage[2]为双方保存进度0..3。","    unsigned long long started;","    // 本局开始时的 Unix 时间戳","    bool present[2],ready[2],done[2],again[2];","    // present 是否在房；ready 是否已准备；done 是否已处理保存；again 是否同意再战","    // 【函数 NetState::NetState】构造等待室状态。","    // 处理步骤：round=0、phase=N_LOBBY；标量流水和原因复位；两方数组全false，saveStage=0；game 自动创","    // 建空盘。","    NetState():round(0),phase(N_LOBBY),owner(0),kind(0),question(0),reason(END_UNKNOWN),","    leaveReason(0),leaver(0),exitSerial(0),started(0) {","        for(int i=0;i<2;++i) {","            present[i]=ready[i]=done[i]=again[i]=false;","            saveStage[i]=0;","        }      // 两名玩家的标志位与保存进度一律清零","    }","    // 【函数 NetState::start】开始新一局。","    // 处理步骤：局号加1；清棋盘；phase=N_PLAY；清请求类型及原因；记当前Unix秒；清准备、保存、再战标志。","    // 变量含义：i 为双方座位数组下标。","    // 注意：present 保留；question、exitSerial 也不归零，流水号继续递增。owner=0 只表示默认值，","    // 不代表正在询问房主。","    void start() {","        ++round;","        game.reset();","        phase=N_PLAY;","        owner=kind=0;","        reason=END_UNKNOWN;","        leaveReason=0;","        // 新局清棋盘、请求类型和原因；保留present、question、exitSerial等跨局状态。","        started=static_cast<unsigned long long>(std::time(NULL));","        // 记住开局的时刻，存档时要用","        for(int i=0;i<2;++i) {","            ready[i]=done[i]=again[i]=false;","            saveStage[i]=0;","        }      // 就绪、已处理保存、同意再战这三类标志复位；保存进度也归零","    }","    // 【函数 NetState::finish】将当前局转为结束阶段。","    // 处理步骤：reason=why；phase=N_FINISH；双方 saveStage=1。","    // 变量含义：why 为 END_FIVE、END_DRAW 或 END_RESIGN。","    // 注意：它不计算胜者；连五由 place 设置 result，认输由 apply 设置 result。","    void finish(int why) {","        reason=why;","        phase=N_FINISH;","        saveStage[0]=saveStage[1]=1;","    }","    // 【函数 NetState::lastMove】寻找 player 座位最近一手下标，无则 -1。","    // 处理步骤：从历史末尾找 stone==player+1。","    // 变量含义：player 为0/1座位；i 为有符号历史下标。","    int lastMove(int player) const {","        for(int i=static_cast<int>(game.moves.size())-1;i>=0;--i) {","            if(game.moves[i].stone==player+1) {","                return i;","            }","        }","        return -1;","    }","    // 【函数 NetState::closeRoom】记录座位 p 因 why 发起离开。","    // 处理步骤：写 leaver、leaveReason，增加 exitSerial；朋友在等待室离开时只清朋友在房/准备及房主准备，","    // 保留房间；其他场景设置未完结束原因并转 N_CLOSED。","    // 变量含义：p 为离开者0/1；why 为 LeaveReason。","    // 注意：对已结束局或重开阶段保留原棋局 reason。该函数不总清 present，真正连接断开由 leave","    // 清理。","    void closeRoom(int p,int why) {","        leaver=p;","        leaveReason=why;","        ++exitSerial;","        // 记下离开的人和原因，并让流水号加一","        if(phase==N_LOBBY && p==1) {","            present[p]=ready[p]=false;","            ready[0]=false;","            return;","        }      // 等待室里朋友离开的特殊处理：只让他退出，房主留在房间里继续等别人","        if(!game.result && phase!=N_RESTART) {","            reason=why==LEAVE_DROP?END_DISCONNECT:END_QUIT;","        }      // 只为未完且不处于重开阶段的棋局补退出/断线原因，保留已明确的原原因。","        phase=N_CLOSED;","        // 房间进入已关闭状态","    }","    // 【函数 NetState::leave】处理底层连接消失。","    // 处理步骤：若已不在房就返回；清 present/ready；尚未关闭的房间交 closeRoom(...,LEAVE_DROP)。","    // 变量含义：p 为失联座位。","    // 注意：房间已关闭时不重写离开原因，防止“拒绝再战”被随后断线覆盖。","    void leave(int p) {","        if(!present[p]) {","            return;","        }      // 本来就不在房，不必重复处理","        present[p]=ready[p]=false;","        // 清掉这个人的在房与准备状态","        if(phase!=N_CLOSED) {","            closeRoom(p,LEAVE_DROP);","        }","    }","    // 【函数 NetState::apply】检查并执行座位 p 发来的 message；返回是否接受；event 输出可选提示事件。","    // 处理步骤：检查座位/在房与命令格式；READY 单独处理；其余要求局号匹配；按命令验证阶段、手数、权限","    // 和问答编号，再改变状态。","    // 变量含义：in 为消息流；cmd 指令；extra 检测多余字段；r 局号；a/b/c 是按命令解释的整数；at","    // 是悔棋目标历史下标。","    // 注意：N_SELF由申请者自己确认，N_PEER由另一方回答。MOVE没有棋色字段；根据座位和game.turn","    // 判权限。","    bool apply(int p,const std::string& message,std::string& event) {","        event.clear();","        if(p<0 || p>1 || !present[p]) {","            return false;","        }      // 先清空事件；发送者编号或「是否在房」不合法就直接拒绝","        std::istringstream in(message);","        std::string cmd,extra;","        int r=0,a=0,b=0,c=0;","        // 把消息包成输入流，以便像读文件一样逐项读取","        if(!(in>>cmd)) {","            return false;","        }      // 连指令名都读不到，说明是空消息","        // 【阅读提示】READY不带局号；两方在房且都准备才开局。其余业务命令必须携带round。","        if(cmd==\"READY\") {","            if(!(in>>a) || (in>>extra) || phase!=N_LOBBY || (a!=0 && a!=1)) {","                return false;","            }      // 准备指令只在等待室有效，取值只能是 0 或 1","            ready[p]=a!=0;","            if(present[0] && present[1] && ready[0] && ready[1]) {","                start();","            }","            return true;","            // 两人都在房且都点了准备，立即开局","        }","        if(!(in>>r) || r!=round) {","            return false;","        }","        // 【阅读提示】MOVE round moveCount row col：服务端从p决定颜色，不接受客户端任意指定执棋方。","        if(cmd==\"MOVE\") {","            if(!(in>>a>>b>>c) || (in>>extra) || phase!=N_PLAY || game.turn!=p+1 ||      // a已有手数、b行、c列；没有颜色字段，轮次必须对应发送座位p+1。","            a!=static_cast<int>(game.moves.size()) || !game.place(b,c)) {","                return false;","            }      // 手数必须等于当前已有手数(不能跳号)，且这一手必须真的能落下去","            if(game.result) {","                finish(game.result==3?END_DRAW:END_FIVE);","            }      // 落子后如果分出胜负，结束本局，并区分是连五获胜还是满盘平局","            // 【阅读提示】ASK round moveCount kind：1重开、2退出、3悔棋、4认输；先进入本人确认。","        } else if(cmd==\"ASK\") {","            if(!(in>>a>>b) || (in>>extra) || phase!=N_PLAY || a!=static_cast<int>(game.moves.size()) || b<1 || b>4) {","                return false;","            }      // 要求手数正确、请求类型在 1 到 4 之间","            if(b==3 && lastMove(p)<0) {","                return false;","            }      // 一手未下时不允许申请悔棋","            owner=p;","            kind=b;","            ++question;","            phase=N_SELF;","            // 记录申请者和类型，分配新问答号；N_SELF先让申请者本人确认。","            // 【阅读提示】ANSWER round question yes：question必须匹配当前请求；本人/对方由phase限定。","        } else if(cmd==\"ANSWER\") {","            if(!(in>>a>>b) || (in>>extra) || a!=question || (b!=0 && b!=1) ||","            !((phase==N_SELF && p==owner) || (phase==N_PEER && p!=owner))) {","                return false;","            }      // N_SELF仅owner能回答；N_PEER仅另一方能回答；旧question被拒绝。","            // 语句说明：本人取消或对方拒绝均恢复对局；只有对方拒绝时给申请者额外拒绝事件。","            if(!b) {","                if(phase==N_PEER) {","                    event=kind==3?\"UNDO_REFUSED\":\"REFUSED\";","                }","                phase=N_PLAY;","            }","            else if(kind==2) {","                closeRoom(owner,LEAVE_QUIT);","            }      // 申请者确认退出即可关房，不要求对手批准。","            else if(kind==4) {","                game.result=2-owner;","                finish(END_RESIGN);","            }      // 申请者确认认输；座位0认输则白2胜，座位1认输则黑1胜。","            else if(phase==N_SELF) {","                phase=N_PEER;","            }      // 其余是重开/悔棋；本人同意后转N_PEER，等待对手答复。","            else if(kind==3) {","                int at=lastMove(owner);","                if(at<0) {","                    return false;","                }      // 找到申请者最近一手；找不到说明状态异常","                while(static_cast<int>(game.moves.size())>at) {","                    game.undo();","                }      // 撤掉下标at的申请者一手及其后的应答；最终size等于at。","                phase=N_PLAY;","                event=\"UNDO_ACCEPTED\";","                // 回到对局中，并通知对方「悔棋已完成」","            } else {","                phase=N_RESTART;","                reason=END_RESTART;","                done[0]=done[1]=false;","                saveStage[0]=saveStage[1]=1;","            }      // 其余情况是重开：进入重开阶段，双方重新走一遍保存流程","            // 【阅读提示】SAVE round stage：1选择保存、2命名、3本机完成；同步状态，不传对方的文件名或文件内容。","        } else if(cmd==\"SAVE\") {","            if(!(in>>a) || (in>>extra) || (phase!=N_FINISH && phase!=N_RESTART && phase!=N_CLOSED) || a<1 || a>3 || done[p] || again[p]) {","                return false;","            }","            saveStage[p]=a;","            // 记录这一方的保存进度","            // 【阅读提示】重开用DONE等待双方完成当前步骤的关卡，双方本机保存处理完才reset；终局再战用AGAIN，不要混用。","        } else if(cmd==\"DONE\") {","            if((in>>extra) || phase!=N_RESTART || saveStage[p]!=3) {","                return false;","            }","            done[p]=true;","            if(done[0] && done[1]) {","                start();","            }      // 标记此人已处理完；两边都完成就开局","        } else if(cmd==\"AGAIN\") {","            if((in>>extra) || phase!=N_FINISH || saveStage[p]!=3) {","                return false;","            }","            again[p]=true;","            if(again[0] && again[1] && present[0] && present[1]) {","                start();","            }      // 标记此人已同意；两边都同意且都在房就开局","        } else if(cmd==\"CLOSE\") {","            if(!(in>>a) || (in>>extra)) {","                return false;","            }      // 先做出基本格式校验","            if(phase==N_LOBBY && a==LEAVE_LOBBY) {","                closeRoom(p,p==0?LEAVE_HOST:LEAVE_LOBBY);","            }      // 等待室里离开：房主离开记为关房，朋友离开记为普通离开","            else if(phase==N_FINISH && a==LEAVE_DECLINE && saveStage[p]==3 && !again[p]) {","                closeRoom(p,a);","            }      // 一局结束后拒绝再战：此时才允许关房","            else if(((phase==N_FINISH && again[p]) || (phase==N_RESTART && done[p])) && a==LEAVE_CANCEL) {","                closeRoom(p,a);","            }      // 已经同意再战又反悔取消：同样记为关房","            else {","                return false;","            }      // 其余情况的 CLOSE 一律视为非法","        } else {","            return false;","        }      // 未知指令一律拒绝","        return true;","    }","};","// 【函数 netEncode】把 NetState s 编成一条 STATE 消息。","// 处理步骤：写局号/阶段/询问；写两方4类布尔标志；写手数和每手行列；最后写结果、原因、时间、保存进","// 度和离开信息。","// 变量含义：o 为输出流；i 为座位或手序索引。","// 注意：消息只传每手行列；颜色由黑白交替重放恢复。当时状态的副本不是把结构体内存 memcpy 到网络上。","inline std::string netEncode(const NetState& s) {","    std::ostringstream o;","    o<<\"STATE \"<<s.round<<' '<<s.phase<<' '<<s.owner<<' '<<s.kind<<' '<<s.question;","    // 第一段：局号、阶段、发起者、类型、问答编号","    for(int i=0;i<2;++i) {","        o<<' '<<s.present[i]<<' '<<s.ready[i]<<' '<<s.done[i]<<' '<<s.again[i];","    }      // 两名玩家的四个标志位","    o<<' '<<s.game.moves.size();","    // 后面跟着当前的手数，再跟每一手的行列","    for(size_t i=0;i<s.game.moves.size();++i) {","        o<<' '<<s.game.moves[i].row<<' '<<s.game.moves[i].col;","    }","    o<<' '<<s.game.result<<' '<<s.reason<<' '<<s.started<<' '<<s.saveStage[0]<<' '<<s.saveStage[1]      // 末尾是结果、原因、开局时间、双方保存进度","    <<' '<<s.leaveReason<<' '<<s.leaver<<' '<<s.exitSerial;","    // 以及离开原因、离开者、离开流水号","    return o.str();","}","// 【函数 netDecode】解析 message，成功后才整体赋给 result。","// 处理步骤：临时建 s；校验 STATE 头和范围；读双方标志和手数；逐手 place 重建；验证结果原因与其他范","// 围、拒绝多余字段；写最终结果并输出。","// 变量含义：s 临时状态；tag 头标记；extra 多余字段；in 输入流；count 手数；outcome 消息宣称结","// 果；i/r/c 是重放下标与行列。","// 注意：这里做了多项格式和规则校验，但不是对所有字段组合做完整根据当前阶段决定下一步的流程证明。不要把它描述为能","// 够识别一切恶意状态；权威性主要来自服务器执行 apply。","inline bool netDecode(const std::string& message,NetState& result) {","    NetState s;","    std::string tag,extra;","    std::istringstream in(message);","    int count=0,outcome=0;","    // 解析中的临时状态；tag 用来核对开头的关键字 STATE","    if(!(in>>tag>>s.round>>s.phase>>s.owner>>s.kind>>s.question) || tag!=\"STATE\" ||","    s.round<0 || s.phase<0 || s.phase>N_CLOSED || s.owner<0 || s.owner>1 || s.kind<0 || s.kind>4) {","        return false;","    }      // phase为阶段；owner是请求发起座位，不一定是房主；kind为请求类型。","    for(int i=0;i<2;++i) {","        if(!(in>>s.present[i]>>s.ready[i]>>s.done[i]>>s.again[i])) {","            return false;","        }","    }","    if(!(in>>count) || count<0 || count>225) {","        return false;","    }      // 手数必须在 0 到 225 之间","    for(int i=0;i<count;++i) {","        int r,c;","        if(!(in>>r>>c) || !s.game.place(r,c)) {","            return false;","        }","    }","    if(!(in>>outcome>>s.reason>>s.started>>s.saveStage[0]>>s.saveStage[1]>>s.leaveReason>>s.leaver>>s.exitSerial) || (in>>extra) ||","    !validResult(s.game.result,outcome,s.reason) || s.started>7258118400ULL ||","    s.saveStage[0]<0 || s.saveStage[0]>3 || s.saveStage[1]<0 || s.saveStage[1]>3 ||      // 保存进度、离开原因、离开者编号、流水号也都要在合法范围内","    s.leaveReason<0 || s.leaveReason>6 || s.leaver<0 || s.leaver>1 || s.exitSerial<0) {","        return false;","    }","    s.game.result=outcome;","    result=s;","    return true;","}","#endif"],"network_transport.h":["// 【本文件阅读路线】仅联网传输：连接、收发和线程；不负责画页面。协议规则见 network_protocol.h。","// 【建议阅读 08 / TCP与网络线程】network_transport.h","// NetSocket::queue/pump负责字节分帧；NetClient负责连接、线程及完整消息队列。","// Winsock相关头文件必须早于一般windows.h，避免引入旧Winsock声明而冲突。","// 外部接口声明位置：标准库对应的头文件；Win32/Winsock系统头；EGE的graphics.h。","// 头文件保护：首次包含时定义下面的宏，再次包含会跳过本文件，避免同一一次编译处理的源文件及其包含的头文件重复定义。","#ifndef GOMOKU_NETWORK_TRANSPORT_H","#define GOMOKU_NETWORK_TRANSPORT_H","#include <winsock2.h>","#include <ws2tcpip.h>","#include <windows.h>","#include <string>","#include <deque>","#include <vector>","#include <cstring>","#include <sstream>","// 【类型 NetSocket】单条TCP连接的字节缓冲封装。queue添加长度帧，pump尝试收发并拆出完整正文；不判断","// 五子棋规则。没有自定义析构函数，使用者按当前代码路径显式close。","struct NetSocket {","    SOCKET fd;","    std::string input,output;","    ULONGLONG received,sent;","    bool failed;","    // fd套接字；input待拆接收字节、output待发送字节；received/sent最近收发毫秒；failed为缓冲错误。","    // 【函数 NetSocket::NetSocket】构造尚未连接的流缓冲对象。","    // 处理步骤：fd=INVALID_SOCKET；received=当前毫秒；sent=0；failed=false；字符串自动为空。","    NetSocket():fd(INVALID_SOCKET),received(GetTickCount64()),sent(0),failed(false) {","    }","    // 【函数 NetSocket::close】关闭套接字并清空收发字节。","    // 处理步骤：若 fd 有效调用 closesocket；设无效；清 input/output。","    // 变量含义：它不自动重置 failed/received，下一次 attach 会重置必要状态。","    void close() {","        if(fd!=INVALID_SOCKET) {","            closesocket(fd);","        }","        fd=INVALID_SOCKET;","        input.clear();","        output.clear();","    }","    // 【函数 NetSocket::attach】接管 SOCKET s 并设为非阻塞。","    // 处理步骤：先关闭旧连接；清 failed；保存 s；ioctlsocket(FIONBIO)；重设 received。","    // 变量含义：s 是接管的句柄；mode=1 代表非阻塞。","    // 注意：后续由此对象负责 close。当前代码没有检查 ioctlsocket 的返回值。","    void attach(SOCKET s) {","        close();","        failed=false;","        fd=s;","        u_long mode=1;","        ioctlsocket(fd,FIONBIO,&mode);","        received=GetTickCount64();","    }","    // 【函数 NetSocket::queue】把一条正文 message 封装到待发送字节缓冲，返回是否成功。","    // 处理步骤：拒绝空正文、>8192字节或总缓冲>65536；用 htonl 得4字节长度；追加长度头与正文。","    // 变量含义：n 为网络序正文长度。","    // 注意：queue 只入缓冲，不表示已经送达。Windows 中 unsigned long 为4字节，这段实现依赖当前","    // 平台。","    bool queue(const std::string& message) {","        // 语句说明：正文1..8192字节，累计待发不超过65536；超限将连接标记failed。","        if(message.empty() || message.size()>8192 || output.size()+message.size()+4>65536) {","            failed=true;","            return false;","        }","        // 语句说明：Windows的unsigned long为4字节；htonl把正文长度变为网络字节序。","        unsigned long n=htonl(static_cast<unsigned long>(message.size()));","        output.append(reinterpret_cast<const char*>(&n),4);","        output+=message;","        return true;","        // 长度头和正文一起进发送缓冲区","    }","    // 【阅读提示】TCP是字节流：半个头、半条正文保留到下次；同批多帧则while连续拆。","    // 【函数 NetSocket::pump】尝试发送并接收；把完整正文追加到 messages；false 表示连接不可继续。","    // 处理步骤：先发送 output 的一部分并移除实发字节；最多16次 recv；把新字节追加 input；while 拆完整","    // 帧；遇零长度、超限、断开或超时失败；暂时无数据 WSAEWOULDBLOCK 不算故障。","    // 变量含义：messages 为输出数组引用；n 分别为 send/recv 实际字节数；bytes[4096] 为接收块；","    // iteration 限制本轮读取次数；length 为从包头取出的正文长度。","    // 注意：send 可能只发一部分。recv 返回0是有序关闭；<0才检查错误码。messages 超256也失败；","    // 这些界限防止缓冲无限增长。","    bool pump(std::vector<std::string>& messages) {","        if(fd==INVALID_SOCKET || failed) {","            return false;","        }      // 连接已经不可用，直接返回假","        if(!output.empty()) {","            int n=send(fd,output.data(),static_cast<int>(output.size()),0);","            if(n>0) {","                output.erase(0,n);","                sent=GetTickCount64();","            }      // n可能小于待发总长；仅删除已发送前缀，余下字节留待下轮。","            else if(n==0 || WSAGetLastError()!=WSAEWOULDBLOCK) {","                return false;","            }","        }","        char bytes[4096];","        // 一次最多收 4096 字节","        for(int iteration=0;iteration<16;++iteration) {","            int n=recv(fd,bytes,sizeof(bytes),0);","            if(n==0) {","                return false;","            }      // 对方关闭了连接","            if(n<0) {","                if(WSAGetLastError()!=WSAEWOULDBLOCK) {","                    return false;","                }","                break;","            }","            input.append(bytes,n);","            received=GetTickCount64();","            // 把收到的字节追加到缓冲区，并更新「最后收到数据的时刻」","            if(input.size()>65536) {","                return false;","            }      // 接收缓冲超过上限则中止连接；这是资源保护，不据此证明对方主观恶意。","            while(input.size()>=4) {","                // 语句说明：先memcpy避免未对齐读取，再ntohl还原本机整数长度。","                unsigned long length;","                std::memcpy(&length,input.data(),4);","                length=ntohl(length);","                if(!length || length>8192) {","                    return false;","                }","                // 语句说明：已有合法长度头但正文尚未到齐；保留input等待下次recv。","                if(input.size()<length+4) {","                    break;","                }","                // 语句说明：产出一条完整正文并删去头+正文；while可继续拆同一批收到的后续帧。","                messages.push_back(input.substr(4,length));","                input.erase(0,length+4);","                if(messages.size()>256) {","                    return false;","                }","            }","        }      // 本轮接收结束","        // 语句说明：自上次收到任何数据起不到15秒才视为仍存活；这不是等待完整业务回复的超时。","        return GetTickCount64()-received<15000;","    }","};","// 【类型 NetClient】客户端网络工作线程。private部分负责收发循环，public部分供UI提交/取得正文；临界","// 区保护incoming/outgoing，不让后台线程直接操作界面。start成功仅表示线程创建，不等于已连上房间。","class NetClient {","    CRITICAL_SECTION mutex;","    HANDLE thread;","    volatile LONG stopFlag;","    // mutex 保护消息队列；thread 是后台线程句柄；stopFlag 是停止标志","    std::deque<std::string> incoming,outgoing;","    // incoming 是「收到的、等界面取走」；outgoing 是「界面交来的、等发送」","    std::string address,hello;","    int port;","    // 连接目标：地址、端口，以及连接后要发的问候语","    // 【函数 NetClient::push】网络线程把字符串 s 放入 incoming。","    // 处理步骤：进锁；未满256则追加；否则置 stopFlag；离锁。","    // 变量含义：s 是交给UI的完整消息或内部通知。","    void push(const std::string& s) {","        EnterCriticalSection(&mutex);","        if(incoming.size()<256) {","            incoming.push_back(s);","        }","        else {","            InterlockedExchange(&stopFlag,1);","        }","        LeaveCriticalSection(&mutex);","    }","    // 【函数 NetClient::entry】Win32线程静态入口。","    // 处理步骤：将 LPVOID p 转回 NetClient*，调用成员 run，再返回0。","    // 变量含义：p 是 CreateThread 传来的 this。","    static DWORD WINAPI entry(LPVOID p) {","        static_cast<NetClient*>(p)->run();","        return 0;","    }","    // 【函数 NetClient::run】后台线程的连接与收发主循环。","    // 处理步骤：初始化Winsock；创建非阻塞TCP；connect并用select等最多约8秒；连上后queue hello；每轮取","    // 走outgoing、发心跳、pump、处理PING/PONG与延迟，其他消息push给UI；失败push LOST；退出清理。","    // 变量含义：data 为Winsock信息；sock 为流封装；fd 为原句柄；target 为IPv4地址结构；rc/error","    // 为connect结果和错误码；connected 是否完成；start 为等待开始毫秒；writeSet/errorSet 为select集合；","    // wait 是10毫秒超时；n 为select结果；e/len 为SO_ERROR值及长度；ping 为最近本机心跳时间；pending 为","    // 本轮出站消息副本；ok/alive 为入缓冲及连接结果；request 为PING输出流；messages 为收到的正文；i 为","    // 索引；stamp/value 为PONG时间解析流与值；latency 为内部LATENCY通知流。","    // 注意：ping 时间由本机生成并由服务器原样回传，因此测的是往返时间，不需要两台机器时钟一致。","    // 线程每轮 Sleep(10)，没有进行图形绘制。","    void run() {","        WSADATA data;","        if(WSAStartup(MAKEWORD(2,2),&data)) {","            push(\"ERROR SOCKET\");","            return;","        }","        NetSocket sock;","        SOCKET fd=socket(AF_INET,SOCK_STREAM,IPPROTO_TCP);","        // 创建一个 TCP 套接字","        if(fd==INVALID_SOCKET) {","            push(\"ERROR SOCKET\");","            WSACleanup();","            return;","        }      // 创建失败就通知界面并释放 Winsock","        sock.attach(fd);","        sockaddr_in target;","        ZeroMemory(&target,sizeof(target));","        target.sin_family=AF_INET;","        target.sin_port=htons(static_cast<u_short>(port));","        target.sin_addr.s_addr=inet_addr(address.c_str());","        // 把点分十进制形式的 IP 字符串转成网络地址","        int rc=connect(fd,reinterpret_cast<sockaddr*>(&target),sizeof(target));","        bool connected=rc==0;","        int error=WSAGetLastError();","        if(rc && error!=WSAEWOULDBLOCK && error!=WSAEINPROGRESS) {","            push(\"ERROR CONNECT\");","            sock.close();","            WSACleanup();","            return;","        }","        ULONGLONG start=GetTickCount64();","        // 记下开始等连接的时刻，用来判断是否超时","        // 【阅读提示】非阻塞connect的暂未完成不是失败；select等可写，再用SO_ERROR确认成功。","        while(!connected && !InterlockedCompareExchange(&stopFlag,0,0) && GetTickCount64()-start<8000) {","            fd_set writeSet,errorSet;","            FD_ZERO(&writeSet);","            FD_ZERO(&errorSet);","            FD_SET(fd,&writeSet);","            FD_SET(fd,&errorSet);","            timeval wait= {","                0,10000","            };","            int n=select(0,NULL,&writeSet,&errorSet,&wait);","            if(n>0) {","                int e=0,len=sizeof(e);","                getsockopt(fd,SOL_SOCKET,SO_ERROR,reinterpret_cast<char*>(&e),&len);","                if(e || FD_ISSET(fd,&errorSet)) {","                    break;","                }","                connected=true;","            }","            if(n<0) {","                break;","            }      // select 返回负数表示出错，同样跳出","        }","        if(!connected) {","            if(!stopFlag) {","                push(\"ERROR CONNECT\");","            }","            sock.close();","            WSACleanup();","            return;","        }","        sock.queue(hello);","        ULONGLONG ping=0;","        while(!InterlockedCompareExchange(&stopFlag,0,0)) {","            // 语句说明：锁内只交换消息队列；pending由本线程独享，后续封包无需占用UI的队列锁。","            EnterCriticalSection(&mutex);","            std::deque<std::string> pending;","            pending.swap(outgoing);","            LeaveCriticalSection(&mutex);","            bool ok=true;","            for(size_t i=0;i<pending.size();++i) {","                if(!sock.queue(pending[i])) {","                    ok=false;","                }","            }","            if(GetTickCount64()-ping>3000) {","                ping=GetTickCount64();","                std::ostringstream request;","                request<<\"PING \"<<ping;","                sock.queue(request.str());","            }","            std::vector<std::string> messages;","            bool alive=ok && sock.pump(messages);","            for(size_t i=0;i<messages.size();++i) {","                // 逐条处理收到的消息","                if(messages[i]==\"PING\") {","                    sock.queue(\"PONG\");","                    continue;","                }      // 对方的 PING 要立刻回 PONG，保持这条链路活着","                if(messages[i].compare(0,5,\"PONG \")==0) {","                    std::istringstream stamp(messages[i].substr(5));","                    ULONGLONG value=0;","                    // 把时间戳那部分单独取出来解析","                    if(stamp>>value && value==ping && value<=GetTickCount64()) {","                        // 语句说明：回传的是本机先前发出的毫秒值，差值为RTT，不依赖服务端时钟同步。","                        std::ostringstream latency;","                        latency<<\"LATENCY \"<<(GetTickCount64()-value);","                        push(latency.str());","                    }","                } else if(messages[i]!=\"PONG\") {","                    push(messages[i]);","                }","            }      // 一轮收发结束","            if(!alive) {","                push(\"LOST\");","                break;","            }","            Sleep(10);","        }      // 循环结束，关闭连接并释放 Winsock","        sock.close();","        WSACleanup();","    }","    public:","    // 【函数 NetClient::NetClient】构造客户端通信对象。","    // 处理步骤：thread=NULL，stopFlag=0，port=0；InitializeCriticalSection 建锁。","    NetClient():thread(NULL),stopFlag(0),port(0) {","        InitializeCriticalSection(&mutex);","    }","    // 【函数 NetClient::~NetClient】对象销毁时释放线程和锁。","    // 处理步骤：先 stop 等线程退出，再 DeleteCriticalSection。","    // 变量含义：析构函数名以 ~ 开头，随对象生命周期自动调用。","    ~NetClient() {","        stop();","        DeleteCriticalSection(&mutex);","    }","    // 【函数 NetClient::stop】停止并回收后台线程，再清队列。","    // 处理步骤：原子置 stopFlag；有线程则等待结束、关句柄、清NULL；在锁保护下清 incoming/outgoing。","    void stop() {","        InterlockedExchange(&stopFlag,1);","        // 置停止标志，通知后台线程退出","        if(thread) {","            WaitForSingleObject(thread,INFINITE);","            CloseHandle(thread);","            thread=NULL;","        }      // INFINITE 表示「一直等到线程真正结束」","        EnterCriticalSection(&mutex);","        incoming.clear();","        outgoing.clear();","        LeaveCriticalSection(&mutex);","        // 清空两个队列，避免下次启动时读到上次的残留消息","    }","    // 【函数 NetClient::start】用 ip、p、greeting 启动连接任务，返回建线程是否成功。","    // 处理步骤
